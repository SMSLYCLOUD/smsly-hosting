name: Trivy Scheduled Runtime Scan

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  trivy-runtime-scan:
    name: Trivy Runtime Scan — All Platform Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build -t smsly-backend:ci -f backend/Dockerfile backend/

      - name: Build frontend image
        run: docker build -t smsly-frontend:ci -f frontend/Dockerfile frontend/

      - name: Run Trivy scan on backend
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bcbf0874569a87b02f # 0.28.0
        with:
          scan-type: "image"
          image-ref: "smsly-backend:ci"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-runtime-backend.sarif"
          exit-code: "1"

      - name: Run Trivy scan on frontend
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bcbf0874569a87b02f # 0.28.0
        with:
          scan-type: "image"
          image-ref: "smsly-frontend:ci"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-runtime-frontend.sarif"
          exit-code: "1"

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.26.6
        if: always()
        with:
          sarif_file: "trivy-runtime-backend.sarif"
          category: "trivy-runtime-backend"

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.26.6
        if: always()
        with:
          sarif_file: "trivy-runtime-frontend.sarif"
          category: "trivy-runtime-frontend"
