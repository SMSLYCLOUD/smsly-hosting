name: SMSLY Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsly_hosting
          POSTGRES_USER: smsly_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-django coverage pytest-cov

    # SECURITY: These are test-only dummy values. Never use real production secrets in CI test workflows.
    - name: Run backend tests with coverage
      env:
        SECRET_KEY: test_secret_key
        DEBUG: True
        SMSLY_DISABLE_SIGNATURE_CHECK: "True"
        GITHUB_WEBHOOK_SECRET: "test_github_secret"
        FIELD_ENCRYPTION_KEY: 6wqMiiFNfx00cUbgSF55NClcHSdKnFpGhc8XfR7E99w=
        DATABASE_URL: postgres://smsly_admin:test_password@localhost:5432/smsly_hosting
        DJANGO_SETTINGS_MODULE: config.settings
      run: |
        cd backend
        coverage run -m pytest --cov=apps --cov=config --cov-report=xml --cov-report=term-missing -m "not slow and not e2e"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: backend/coverage.xml
        fail_ci_if_error: false
        continue-on-error: true  # Don't fail CI on first run

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

  frontend-e2e:
    name: Frontend Playwright e2e
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  dockerfile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsly_hosting
          POSTGRES_USER: smsly_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smsly_admin -d smsly_hosting"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Monolithic Dockerfile
        run: |
          docker build -t smsly-hosting:ci -f Dockerfile .

      - name: Smoke Test Container
        run: |
          set -euo pipefail

          docker run -d --rm --name smsly-hosting-ci --network host \
            -e ROLE=web \
            -e PORT=18080 \
            -e BACKEND_PORT=18000 \
            -e FRONTEND_PORT=13000 \
            -e DEBUG=True \
            -e SMSLY_DISABLE_SIGNATURE_CHECK=True \
            -e SECRET_KEY=test_secret_key \
            -e FIELD_ENCRYPTION_KEY=6wqMiiFNfx00cUbgSF55NClcHSdKnFpGhc8XfR7E99w= \
            -e DATABASE_URL=postgres://smsly_admin:test_password@127.0.0.1:5432/smsly_hosting \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            smsly-hosting:ci

          echo "Waiting for /health..."
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then
              echo "health ok"
              exit 0
            fi
            echo "waiting for health..."
            sleep 2
          done

          echo "container logs:"
          docker logs smsly-hosting-ci || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smsly-hosting-ci 2>/dev/null || true
