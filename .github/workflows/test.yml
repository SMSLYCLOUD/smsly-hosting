name: SMSLY Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsly_hosting
          POSTGRES_USER: smsly_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-django

    - name: Run Tests
      env:
        SECRET_KEY: test_secret_key
        DEBUG: True
        FIELD_ENCRYPTION_KEY: 6wqMiiFNfx00cUbgSF55NClcHSdKnFpGhc8XfR7E99w=
        DATABASE_URL: postgres://smsly_admin:test_password@localhost:5432/smsly_hosting
      run: |
        cd backend
        pytest
