name: SMSLY Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsly_hosting
          POSTGRES_USER: smsly_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-django

    - name: Run Tests
      env:
        SECRET_KEY: test_secret_key
        DEBUG: True
        SMSLY_DISABLE_SIGNATURE_CHECK: "True"
        GITHUB_WEBHOOK_SECRET: "test_github_secret"
        FIELD_ENCRYPTION_KEY: 6wqMiiFNfx00cUbgSF55NClcHSdKnFpGhc8XfR7E99w=
        DATABASE_URL: postgres://smsly_admin:test_password@localhost:5432/smsly_hosting
        DJANGO_SETTINGS_MODULE: config.settings
      run: |
        cd backend
        pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

  dockerfile-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsly_hosting
          POSTGRES_USER: smsly_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smsly_admin -d smsly_hosting"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build Monolithic Dockerfile
        run: |
          docker build -t smsly-hosting:ci -f Dockerfile .

      - name: Smoke Test Container
        run: |
          set -euo pipefail

          docker run -d --rm --name smsly-hosting-ci --network host \
            -e ROLE=web \
            -e PORT=18080 \
            -e BACKEND_PORT=18000 \
            -e FRONTEND_PORT=13000 \
            -e DEBUG=True \
            -e SMSLY_DISABLE_SIGNATURE_CHECK=True \
            -e SECRET_KEY=test_secret_key \
            -e FIELD_ENCRYPTION_KEY=6wqMiiFNfx00cUbgSF55NClcHSdKnFpGhc8XfR7E99w= \
            -e DATABASE_URL=postgres://smsly_admin:test_password@127.0.0.1:5432/smsly_hosting \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            smsly-hosting:ci

          echo "Waiting for /nginx-health..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/nginx-health >/dev/null; then
              echo "nginx ok"
              break
            fi
            sleep 2
          done

          echo "Waiting for /health..."
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then
              echo "health ok"
              exit 0
            fi
            echo "waiting for health..."
            sleep 2
          done

          echo "container logs:"
          docker logs smsly-hosting-ci || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smsly-hosting-ci 2>/dev/null || true
