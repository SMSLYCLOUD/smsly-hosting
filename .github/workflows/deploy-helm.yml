name: Deploy Helm Chart

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      helm_values_file:
        description: "Helm values file (relative to repo root)"
        required: false
        default: "charts/smsly-hosting/values.prod.yaml"
      image_tag:
        description: "Image tag to deploy"
        required: false
        default: "latest"
  push:
    branches: [ "main" ]
    paths:
      - "charts/smsly-hosting/**"
      - ".github/workflows/deploy-helm.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  helm-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Cosign
        uses: sigstore/cosign-installer@59acb6260d86c0f8a58fa4c3ddb032a715305043 # v3.5.0

      - name: Build backend image
        run: docker build -t smsly/backend:latest -f backend/Dockerfile backend/

      - name: Build frontend image
        run: docker build -t smsly/frontend:latest -f frontend/Dockerfile frontend/

      - name: Run Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4 # master
        with:
          image-ref: smsly/backend:latest
          format: sarif
          output: trivy-backend.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4
        with:
          image-ref: smsly/frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif

      - name: Sign and verify backend
        run: |
          cosign sign --yes smsly/backend:latest
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/deploy-helm.yml@${{ github.ref }}" \
            smsly/backend:latest

      - name: Sign and verify frontend
        run: |
          cosign sign --yes smsly/frontend:latest
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/deploy-helm.yml@${{ github.ref }}" \
            smsly/frontend:latest

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.VPS_SSH_HOST_KEY }}" ]; then
            echo "${{ secrets.VPS_SSH_HOST_KEY }}" >> ~/.ssh/known_hosts
          else
            # ssh-keyscan at deploy time is a TOCTOU risk — pin VPS_SSH_HOST_KEY
            # as a repository secret to eliminate it.
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Deploy via deploy-agent
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 # v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 900s
          script: |
            set -e
            cd /opt/smsly-hosting

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building images ==="
            docker compose build backend frontend

            echo "=== Deploying via deploy-agent ==="
            python scripts/deploy-agent.py install \
              --set backend.image.tag=${{ github.sha }} \
              --set frontend.image.tag=${{ github.sha }}

            echo "=== Running health check ==="
            sleep 10
            curl -sf --connect-timeout 10 --max-time 10 http://localhost/health || \
              { echo "WARNING: curl health check failed — checking K8s rollout status"; }
            kubectl wait --for=condition=available --timeout=120s \
              -n smsly-system deployment -l app.kubernetes.io/instance=smsly-hosting

            echo "=== Verifying image signatures on cluster ==="
            if [ -f scripts/cosign-verify.sh ]; then
              source scripts/cosign-verify.sh
              cosign_verify_image "smsly/backend:latest" || { echo "FATAL: Backend image signature verification failed"; exit 1; }
              cosign_verify_image "smsly/frontend:latest" || { echo "FATAL: Frontend image signature verification failed"; exit 1; }
            else
              echo "WARNING: cosign-verify.sh not found — skipping signature verification"
            fi

            echo "=== Deploy complete ==="
