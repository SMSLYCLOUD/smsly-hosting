name: Deploy Helm Chart

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      helm_values_file:
        description: "Helm values file (relative to repo root)"
        required: false
        default: "charts/smsly-hosting/values.prod.yaml"
      image_tag:
        description: "Image tag to deploy"
        required: false
        default: "latest"
  push:
    branches: [ "main" ]
    paths:
      - "charts/smsly-hosting/**"
      - ".github/workflows/deploy-helm.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  helm-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Configure SSH
        # TODO: ssh-keyscan at deploy time is a TOCTOU risk — an attacker who
        # controls DNS/BGP could inject a rogue host key.  For stronger
        # guarantees, pin the expected SSH host key fingerprint in a repository
        # secret (e.g. VPS_SSH_HOST_KEY) and write it directly to known_hosts.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via deploy-agent
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 # v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 900s
          script: |
            set -e
            cd /opt/smsly-hosting

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building images ==="
            docker compose build backend frontend

            echo "=== Deploying via deploy-agent ==="
            python scripts/deploy-agent.py install \
              --set backend.image.tag=${{ github.sha }} \
              --set frontend.image.tag=${{ github.sha }}

            echo "=== Running health check ==="
            sleep 10
            kubectl wait --for=condition=available --timeout=120s \
              -n smsly-system deployment -l app.kubernetes.io/instance=smsly-hosting

            echo "=== Deploy complete ==="
