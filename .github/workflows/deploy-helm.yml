name: Deploy Helm Chart

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      helm_values_file:
        description: "Helm values file (relative to repo root)"
        required: false
        default: "charts/smsly-hosting/values.prod.yaml"
      image_tag:
        description: "Image tag to deploy"
        required: false
        default: ""
  push:
    branches: [ "master" ]
    paths:
      - "charts/smsly-hosting/**"
      - ".github/workflows/deploy-helm.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  helm-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Cosign
        uses: sigstore/cosign-installer@59acb6260d86c0f8a58fa4c3ddb032a715305043 # v3.5.0

      - name: Build backend image
        run: docker build -t smsly/backend:latest -f backend/Dockerfile backend/

      - name: Build frontend image
        run: docker build -t smsly/frontend:latest -f frontend/Dockerfile frontend/

      - name: Run Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4 # master
        with:
          image-ref: smsly/backend:latest
          format: sarif
          output: trivy-backend.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4
        with:
          image-ref: smsly/frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF results (backend)
        uses: github/codeql-action/upload-sarif@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.26.6
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy SARIF results (frontend)
        uses: github/codeql-action/upload-sarif@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.26.6
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Sign and verify backend
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if docker manifest inspect smsly/backend:latest >/dev/null 2>&1; then
            cosign sign --yes smsly/backend:latest
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${GITHUB_REPO}/.github/workflows/deploy-helm.yml@${GITHUB_REF}" \
              smsly/backend:latest
          else
            echo "Skipping cosign sign/verify for smsly/backend:latest (local-only unpushed tag)"
          fi

      - name: Sign and verify frontend
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if docker manifest inspect smsly/frontend:latest >/dev/null 2>&1; then
            cosign sign --yes smsly/frontend:latest
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${GITHUB_REPO}/.github/workflows/deploy-helm.yml@${GITHUB_REF}" \
              smsly/frontend:latest
          else
            echo "Skipping cosign sign/verify for smsly/frontend:latest (local-only unpushed tag)"
          fi

      - name: Add pinned SSH host key
        env:
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          if [ -z "$VPS_SSH_HOST_KEY" ]; then
            echo "FATAL: VPS_SSH_HOST_KEY secret is required (ssh-keyscan TOCTOU disabled)" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_HOST_KEY" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via Helm
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 # v1.2.1
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          HELM_VALUES_FILE: ${{ inputs.helm_values_file || 'charts/smsly-hosting/values.prod.yaml' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 900s
          envs: IMAGE_TAG,HELM_VALUES_FILE
          script: |
            set -e
            cd /opt/smsly-hosting

            echo "=== Pulling latest code ==="
            git pull origin master

            echo "=== Building images ==="
            docker compose -f docker-compose.prod.yml build backend frontend

            echo "=== Deploying via Helm ==="
            helm upgrade --install smsly-hosting ./charts/smsly-hosting \
              --namespace smsly-system \
              --create-namespace \
              -f "${HELM_VALUES_FILE}" \
              --set "secrets.existingSecret=smsly-hosting-env" \
              --set "backend.env.allowedHosts=smsly.cloud" \
              --set "backend.image.tag=${IMAGE_TAG}" \
              --set "frontend.image.tag=${IMAGE_TAG}" \
              --set "celery.image.tag=${IMAGE_TAG}"

            echo "=== Running health check ==="
            sleep 10
            curl -sf --connect-timeout 10 --max-time 10 http://localhost/health || \
              { echo "WARNING: curl health check failed — checking K8s rollout status"; }
            kubectl wait --for=condition=available --timeout=120s \
              -n smsly-system deployment -l app.kubernetes.io/instance=smsly-hosting

            echo "=== Verifying image signatures on cluster ==="
            if [ -f scripts/cosign-verify.sh ]; then
              source scripts/cosign-verify.sh
              for img in smsly/backend:latest smsly/frontend:latest; do
                case "$img" in
                  *.*/*|*:5000/*)
                    if docker image inspect "$img" >/dev/null 2>&1; then
                      cosign_verify_image "$img" || { echo "FATAL: Signature verification failed for $img"; exit 1; }
                    fi
                    ;;
                  *)
                    echo "Skipping cosign verify for local-only image $img (no registry host)"
                    ;;
                esac
              done
            else
              echo "WARNING: cosign-verify.sh not found — skipping signature verification"
            fi

            echo "=== Deploy complete ==="
