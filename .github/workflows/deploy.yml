name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Cosign
        uses: sigstore/cosign-installer@59acb6260d86c0f8a58fa4c3ddb032a715305043 # v3.5.0

      - name: Build backend image
        run: docker build -t smsly/backend:latest -f backend/Dockerfile backend/

      - name: Build frontend image
        run: docker build -t smsly/frontend:latest -f frontend/Dockerfile frontend/

      - name: Run Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4 # master
        with:
          image-ref: smsly/backend:latest
          format: sarif
          output: trivy-backend.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4
        with:
          image-ref: smsly/frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF results (backend)
        uses: github/codeql-action/upload-sarif@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.26.6
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy SARIF results (frontend)
        uses: github/codeql-action/upload-sarif@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.26.6
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Sign and verify backend
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if docker manifest inspect smsly/backend:latest >/dev/null 2>&1; then
            cosign sign --yes smsly/backend:latest
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${GITHUB_REPO}/.github/workflows/deploy.yml@${GITHUB_REF}" \
              smsly/backend:latest
          else
            echo "Skipping cosign sign/verify for smsly/backend:latest (local-only unpushed tag)"
          fi

      - name: Sign and verify frontend
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if docker manifest inspect smsly/frontend:latest >/dev/null 2>&1; then
            cosign sign --yes smsly/frontend:latest
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${GITHUB_REPO}/.github/workflows/deploy.yml@${GITHUB_REF}" \
              smsly/frontend:latest
          else
            echo "Skipping cosign sign/verify for smsly/frontend:latest (local-only unpushed tag)"
          fi

      - name: Add pinned SSH host key
        env:
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          if [ -z "$VPS_SSH_HOST_KEY" ]; then
            echo "FATAL: VPS_SSH_HOST_KEY secret is required (ssh-keyscan TOCTOU disabled)" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_HOST_KEY" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 # v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 600s
          script: |
            set -e
            cd /opt/smsly-hosting

            # NOTE: safe-update.sh provides automatic rollback on failure and
            # should be preferred for automated deploys once it is validated.
            echo "=== Running installer update mode (safe pull + rebuild) ==="
            SKIP_SCREEN=1 bash install.sh --update

            echo "=== Running health check ==="
            sleep 10
            curl -sf http://localhost/health || { echo "FATAL: Health check failed after deploy"; exit 1; }

            echo "=== Verifying image signatures on VPS ==="
            if [ -f scripts/cosign-verify.sh ]; then
              source scripts/cosign-verify.sh
              for img in smsly-hosting-backend:latest smsly-hosting-frontend:latest; do
                case "$img" in
                  *.*/*|*:5000/*)
                    if docker image inspect "$img" >/dev/null 2>&1; then
                      cosign_verify_image "$img" || { echo "FATAL: Signature verification failed for $img"; exit 1; }
                    fi
                    ;;
                  *)
                    echo "Skipping cosign verify for local-only image $img (no registry host)"
                    ;;
                esac
              done
            else
              echo "WARNING: cosign-verify.sh not found — skipping VPS-side signature verification"
            fi

            echo "=== Deploy complete ==="
