name: Deploy to Production

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@59acb6260d86c0f8a58fa4c3ddb032a715305043 # v3.5.0

      - name: Build backend image
        run: docker build -t smsly/backend:latest -f backend/Dockerfile backend/

      - name: Build frontend image
        run: docker build -t smsly/frontend:latest -f frontend/Dockerfile frontend/

      - name: Run Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4 # master
        with:
          image-ref: smsly/backend:latest
          format: sarif
          output: trivy-backend.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4
        with:
          image-ref: smsly/frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif

      - name: Sign and verify backend
        run: |
          cosign sign --yes smsly/backend:latest
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@${{ github.ref }}" \
            smsly/backend:latest

      - name: Sign and verify frontend
        run: |
          cosign sign --yes smsly/frontend:latest
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@${{ github.ref }}" \
            smsly/frontend:latest

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.VPS_SSH_HOST_KEY }}" ]; then
            echo "${{ secrets.VPS_SSH_HOST_KEY }}" >> ~/.ssh/known_hosts
          else
            # ssh-keyscan at deploy time is a TOCTOU risk — pin VPS_SSH_HOST_KEY
            # as a repository secret to eliminate it.
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 # v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 600s
          script: |
            set -e
            cd /opt/smsly-hosting

            # NOTE: safe-update.sh provides automatic rollback on failure and
            # should be preferred for automated deploys once it is validated.
            echo "=== Running installer update mode (safe pull + rebuild) ==="
            SKIP_SCREEN=1 bash install.sh --update

            echo "=== Running health check ==="
            sleep 10
            curl -sf http://localhost/health || { echo "FATAL: Health check failed after deploy"; exit 1; }

            echo "=== Verifying image signatures on VPS ==="
            if [ -f scripts/cosign-verify.sh ]; then
              source scripts/cosign-verify.sh
              cosign_verify_image "smsly/backend:latest" || { echo "FATAL: Backend image signature verification failed"; exit 1; }
              cosign_verify_image "smsly/frontend:latest" || { echo "FATAL: Frontend image signature verification failed"; exit 1; }
            else
              echo "WARNING: cosign-verify.sh not found — skipping VPS-side signature verification"
            fi

            echo "=== Deploy complete ==="
