name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 600s
          script: |
            set -e
            cd /opt/smsly-hosting

            echo "=== Running installer update mode (safe pull + rebuild) ==="
            SKIP_SCREEN=1 bash install.sh --update

            echo "=== Running health check ==="
            sleep 10
            curl -sf http://localhost/health || { echo "FATAL: Health check failed after deploy"; exit 1; }

            echo "=== Deploy complete ==="
