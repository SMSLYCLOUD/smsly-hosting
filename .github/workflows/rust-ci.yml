name: Rust Twin CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'rust_twin/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'rust_twin/**'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Fail builds on warnings to ensure strict code quality
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust_twin

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (1.82.0)
      with:
        toolchain: 1.82.0
        components: clippy, rustfmt
        targets: wasm32-unknown-unknown

    - name: Rust Cache
      uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      with:
        workspaces: rust_twin

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Clippy Lints
      run: cargo clippy --workspace --all-targets --all-features

    - name: Run Tests
      # We skip the frontend crate here because WASM requires a browser environment
      # or a Node.js runner to execute correctly in CI.
      run: cargo test --workspace --exclude frontend --all-features