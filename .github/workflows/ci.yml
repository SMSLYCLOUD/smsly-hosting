name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SECRET_KEY: "ci-secret-key-must-be-long-enough-for-checks"
      DEBUG: "False"
      USE_SSL: "True"
      DATABASE_URL: "postgres://smsly_admin:test_password@localhost:5432/smsly_hosting"
      REDIS_URL: "redis://localhost:6379/0"
      GITHUB_WEBHOOK_SECRET: "dummy"
      FIELD_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" # 32 bytes base64
      RABBITMQ_PASSWORD: "guest"
      POSTGRES_PASSWORD: "test_password"
      POSTGRES_USER: "smsly_admin"
      POSTGRES_DB: "smsly_hosting"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsly_hosting
          POSTGRES_USER: smsly_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smsly_admin -d smsly_hosting"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: "3.12"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "backend/requirements.txt" ]; then
          pip install -r backend/requirements.txt
        else
          pip install -r requirements.txt
        fi
        pip install pytest pytest-django coverage pytest-cov pytest-asyncio hypothesis
    - name: Run PIP Check
      run: pip check
    - name: Run Django Check
      working-directory: ./backend
      run: |
        python manage.py check
        python manage.py check --deploy
    - name: Run Tests
      working-directory: ./backend
      run: |
        pytest --import-mode=importlib -ra --tb=short \
          --strict-markers \
          --cov=apps \
          --cov=config \
          --cov-report=xml \
          --cov-report=term-missing \
          -m "not e2e and not integration" \
          backend/
      env:
        DATABASE_URL: postgres://smsly_admin:test_password@localhost:5432/smsly_hosting
        DJANGO_SETTINGS_MODULE: config.settings
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      if: always()
      with:
        file: backend/coverage.xml
        fail_ci_if_error: false

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Set up Node
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
      with:
        node-version: "20"
    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
    - name: Build
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
      run: npm run build

  infra-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Create dummy env
      run: |
        touch .env
        echo "REDIS_PASSWORD=dummy" >> .env
        echo "POSTGRES_PASSWORD=dummy" >> .env
        echo "FIELD_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" >> .env
        echo "SECRET_KEY=dummy" >> .env
        echo "FRP_AUTH_TOKEN=dummy" >> .env
    - name: Validate Compose Config
      run: |
        docker compose -f docker-compose.yml config > /dev/null
        docker compose -f docker-compose.prod.yml config > /dev/null

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Set up Python
      uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
      with:
        python-version: "3.11"
    - name: Set up Node
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: "20"
    - name: Install pip-audit and bandit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit
    - name: Run pip-audit
      run: pip-audit --strict --requirement backend/requirements.txt
    - name: Run bandit
      run: bandit -r backend/ -ll -i
    - name: Run npm audit
      working-directory: ./frontend
      run: npm audit --omit=dev --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        fetch-depth: 0
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_UPLOAD_SARIF: "true"

  pre-commit:
    name: pre-commit hooks (gitleaks, ruff, bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  safety:
    name: Safety Python CVE check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
      - name: Install safety
        run: pip install safety
      - name: Run safety
        run: safety check --file backend/requirements.txt --json
        continue-on-error: true
