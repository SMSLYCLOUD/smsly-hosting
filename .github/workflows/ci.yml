name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SECRET_KEY: "ci-secret-key-must-be-long-enough-for-checks"
      DEBUG: "False"
      USE_SSL: "True"
      DATABASE_URL: "postgres://smsly_admin:test_password@localhost:5432/smsly_hosting"
      REDIS_URL: "redis://localhost:6379/0"
      GITHUB_WEBHOOK_SECRET: "dummy"
      FIELD_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" # 32 bytes base64
      RABBITMQ_PASSWORD: "guest"
      POSTGRES_PASSWORD: "test_password"
      POSTGRES_USER: "smsly_admin"
      POSTGRES_DB: "smsly_hosting"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsly_hosting
          POSTGRES_USER: smsly_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smsly_admin -d smsly_hosting"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "backend/requirements.txt" ]; then
          pip install -r backend/requirements.txt
        else
          pip install -r requirements.txt
        fi
        pip install pytest pytest-django coverage pytest-cov pytest-asyncio hypothesis
    - name: Run PIP Check
      run: pip check
    - name: Run Django Check
      working-directory: ./backend
      run: |
        python manage.py check
        python manage.py check --deploy
    - name: Run Tests
      working-directory: ./backend
      run: |
        pytest --import-mode=importlib -ra --tb=short \
          --strict-markers \
          --cov=apps \
          --cov=config \
          --cov-report=xml \
          --cov-report=term-missing \
          -m "not e2e and not integration" \
          backend/
      env:
        DATABASE_URL: postgres://smsly_admin:test_password@localhost:5432/smsly_hosting
        DJANGO_SETTINGS_MODULE: config.settings
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      if: always()
      with:
        file: backend/coverage.xml
        fail_ci_if_error: false

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "20"
    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
    - name: Build
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
      run: npm run build

  infra-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Create dummy env
      run: |
        touch .env
        echo "REDIS_PASSWORD=dummy" >> .env
        echo "POSTGRES_PASSWORD=dummy" >> .env
        echo "FIELD_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" >> .env
        echo "SECRET_KEY=dummy" >> .env
        echo "FRP_AUTH_TOKEN=dummy" >> .env
    - name: Validate Compose Config
      run: |
        docker compose -f docker-compose.yml config > /dev/null
        docker compose -f docker-compose.prod.yml config > /dev/null

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.11"
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "20"
    - name: Install pip-audit and bandit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit
    - name: Run pip-audit
      run: pip-audit --strict --requirement backend/requirements.txt
    - name: Run bandit
      run: bandit -r backend/ -ll -i
    - name: Run npm audit
      working-directory: ./frontend
      run: npm audit --omit=dev --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_UPLOAD_SARIF: "true"

  pre-commit:
    name: pre-commit hooks (gitleaks, ruff, bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  safety:
    name: Safety Python CVE check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install safety
        run: pip install safety
      - name: Run safety
        # safety uses a different CVE DB than pip-audit — informational only
        # since pip-audit --strict (sca job) is the primary blocking gate.
        run: safety check --file backend/requirements.txt --json
        continue-on-error: true

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4 # master
        with:
          scan-type: fs
          scan-ref: backend/
          format: cyclonedx
          output: sbom-backend.json
      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@7c62194b1f09d5f3cb5df92e2c1af313850846b4
        with:
          scan-type: fs
          scan-ref: frontend/
          format: cyclonedx
          output: sbom-frontend.json
      - name: Set up Cosign
        uses: sigstore/cosign-installer@59acb6260d86c0f8a58fa4c3ddb032a715305043 # v3.5.0
      - name: Sign SBOMs with Cosign
        run: |
          for sbom in sbom-*.json; do
            cosign sign-blob --yes "$sbom" \
              --output-signature "$sbom.sig" \
              --output-certificate "$sbom.cert"
          done
      - name: Upload SBOMs and signatures
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            sbom-*.json
            sbom-*.json.sig
            sbom-*.json.cert

  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smsly_hosting
          POSTGRES_USER: smsly_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smsly_admin -d smsly_hosting"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run security tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://smsly_admin:test_password@localhost:5432/smsly_hosting
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: "ci-secret-key-must-be-long-enough-for-checks"
          DEBUG: "False"
          USE_SSL: "True"
          FIELD_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          pytest -v --tb=short --import-mode=importlib \
            apps/core/tests_security.py \
            apps/core/tests/test_ssrf_validator.py \
            apps/core/tests_rate_limits.py \
            apps/deployments/tests/test_security.py \
            apps/deployments/tests/test_security_fixes.py \
            apps/deployments/tests/test_authentication_hardening.py
