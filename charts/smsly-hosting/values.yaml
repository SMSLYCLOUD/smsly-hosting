# Default values for smsly-hosting.

global:
  domain: "hosting.example.com"
  environment: "production"
  imageRegistry: ""
  imagePullSecrets: []

backend:
  image:
    repository: smsly/backend
    pullPolicy: IfNotPresent
    # Pin a specific tag in production. The chart validator refuses "latest" or empty.
    tag: "2.1.0"
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8000
  env:
    debug: "False"
    secretKey: ""
    dbName: "smsly_hosting"
    dbUser: "smsly_admin"
    dbPassword: ""
    redisPassword: ""
    fieldEncryptionKey: ""
    githubWebhookSecret: ""
    allowedHosts: "*"
    csrfTrustedOrigins: ""
    corsAllowedOrigins: ""
    internalApiUrl: "http://smsly-hosting-backend:8000"
  serviceAccount:
    create: true
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 384Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTargetAverageUtilization: 70
    memoryTargetAverageUtilization: 75
  healthcheck:
    path: "/health"
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    path: "/health"
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1

frontend:
  image:
    repository: smsly/frontend
    pullPolicy: IfNotPresent
    # Pin a specific tag in production. The chart validator refuses "latest" or empty.
    tag: "2.1.0"
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3000
  nextPublicApiUrl: ""
  serviceAccount:
    create: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTargetAverageUtilization: 70
    memoryTargetAverageUtilization: 75
  healthcheck:
    path: "/"
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

celery:
  enabled: true
  image:
    repository: smsly/backend
    pullPolicy: IfNotPresent
    # Pin a specific tag in production. Mirrors backend.image.tag.
    tag: "2.1.0"
  replicaCount: 2
  serviceAccount:
    create: true
  workers:
    default:
      concurrency: 8
      queues: "celery"
      replicaCount: 2
    fast:
      concurrency: 8
      queues: "fast"
      replicaCount: 1
    deploy:
      concurrency: 8
      queues: "deploy"
      replicaCount: 1
  beat:
    enabled: true
    schedule: "celery -A config beat -l info"
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 384Mi

nginx:
  enabled: false
  image: nginx:1.27-alpine
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

redis:
  enabled: true
  image: redis:7-alpine
  auth:
    enabled: false
    password: ""
  master:
    persistence:
      size: 8Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    database: smsly_hosting
    username: smsly_admin
    password: "change-me"
  primary:
    persistence:
      size: 50Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: ""
  hosts:
    - host: hosting.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /admin
          pathType: Prefix
          backend: backend
        - path: /ws
          pathType: Prefix
          backend: backend
        - path: /health
          pathType: Prefix
          backend: backend
        - path: /static
          pathType: Prefix
          backend: backend
        - path: /media
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend
  tls:
    enabled: true

observability:
  enabled: false
  prometheus:
    image: prom/prometheus:v2.45.0
    port: 9090
    retention: 15d
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
  grafana:
    enabled: false
    image: grafana/grafana:10.0.0
    port: 3000

socketProxy:
  enabled: false
  image: tecnativa/docker-socket-proxy:latest

registry:
  enabled: false
  image: registry:2
  persistence:
    size: 50Gi

caddy:
  enabled: false
  image: smsly/caddy:latest

backup:
  enabled: false
  schedule: "0 2 * * *"
  persistence:
    size: 100Gi

secrets:
  existingSecret: ""
  extraEnvVars: []
  extraEnvVarsSecret: ""
  # Required when not using secrets.existingSecret. The chart validator
  # refuses "change-me", "change-me-in-prod", "latest" or empty values.
  secretKey: ""
  dbPassword: ""
  redisPassword: ""

networkPolicy:
  enabled: true

pdb:
  backend:
    enabled: true
    minAvailable: 1
  celery:
    enabled: true
    minAvailable: 1
  frontend:
    enabled: true
    minAvailable: 1
