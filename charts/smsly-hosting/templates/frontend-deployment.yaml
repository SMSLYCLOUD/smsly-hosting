apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-frontend
  labels:
    app: {{ include "smsly-hosting.name" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "smsly-hosting.name" . }}-frontend
  template:
    metadata:
      labels:
        app: {{ include "smsly-hosting.name" . }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://{{ .Values.global.domain }}/api/v1"
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
