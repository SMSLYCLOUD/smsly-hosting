{{- if .Values.redis.enabled }}
{{- include "smsly.validateValues" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-redis-master
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-redis-master
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-redis-master
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-redis-master
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-redis-master
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "smsly-hosting.fullname" . }}-redis-master
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-redis-master
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-redis-master
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.global.imageRegistry }}{{ .Values.redis.image }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              {{- if .Values.redis.auth.enabled }}
              exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
              {{- else }}
              exec redis-server --appendonly yes
              {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          {{- if .Values.redis.auth.enabled }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: redisPassword
          {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ${REDIS_PASSWORD:+-a "$REDIS_PASSWORD"} ping
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ${REDIS_PASSWORD:+-a "$REDIS_PASSWORD"} ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ default "ReadWriteOnce" .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.redis.master.persistence.size }}
{{- end }}
