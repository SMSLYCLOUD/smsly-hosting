apiVersion: v1
kind: Service
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "smsly-hosting.name" . }}-backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "smsly-hosting.name" . }}-frontend
