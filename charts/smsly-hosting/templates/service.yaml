apiVersion: v1
kind: Service
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
