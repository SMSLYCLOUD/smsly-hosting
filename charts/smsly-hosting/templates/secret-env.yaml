{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-env
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-env
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  SECRET_KEY: "{{ .Values.backend.env.secretKey }}"
  FIELD_ENCRYPTION_KEY: "{{ .Values.backend.env.fieldEncryptionKey }}"
  GITHUB_WEBHOOK_SECRET: "{{ .Values.backend.env.githubWebhookSecret }}"
  dbPassword: "{{ .Values.postgresql.auth.password }}"
  redisPassword: "{{ .Values.redis.auth.password }}"
{{- end }}
