{{- include "smsly.validateValues" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-env
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-env
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  SECRET_KEY: "{{ .Values.secrets.secretKey }}"
  FIELD_ENCRYPTION_KEY: "{{ .Values.secrets.fieldEncryptionKey }}"
  GITHUB_WEBHOOK_SECRET: "{{ .Values.secrets.githubWebhookSecret }}"
  GATEWAY_SECRET: "{{ .Values.secrets.gatewaySecret }}"
  EDGE_JWT_SECRET: "{{ .Values.secrets.edgeJwtSecret }}"
  CADDY_ASK_SECRET: "{{ .Values.secrets.caddyAskSecret }}"
  RABBITMQ_PASSWORD: "{{ .Values.secrets.rabbitmqPassword }}"
  dbPassword: "{{ .Values.secrets.dbPassword }}"
  {{- if or .Values.redis.auth.enabled (and .Values.externalRedis .Values.externalRedis.enabled) }}
  REDIS_PASSWORD: "{{ .Values.secrets.redisPassword }}"
  redisPassword: "{{ .Values.secrets.redisPassword }}"
  {{- end }}
{{- end }}
