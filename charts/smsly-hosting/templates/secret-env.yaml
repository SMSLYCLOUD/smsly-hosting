{{- include "smsly.validateValues" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-env
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-env
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  SECRET_KEY: "{{ .Values.secrets.secretKey }}"
  FIELD_ENCRYPTION_KEY: "{{ .Values.secrets.fieldEncryptionKey }}"
  GITHUB_WEBHOOK_SECRET: "{{ .Values.secrets.githubWebhookSecret }}"
  dbPassword: "{{ .Values.secrets.dbPassword }}"
  redisPassword: "{{ .Values.secrets.redisPassword }}"
{{- end }}
