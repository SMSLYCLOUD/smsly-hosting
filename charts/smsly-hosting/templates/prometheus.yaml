{{- if .Values.observability.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-prometheus
  labels:
    app: {{ include "smsly-hosting.name" . }}-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "smsly-hosting.name" . }}-prometheus
  template:
    metadata:
      labels:
        app: {{ include "smsly-hosting.name" . }}-prometheus
    spec:
      securityContext:
        {{- include "smsly.podSecurityContext" . | nindent 8 }}
      containers:
        - name: prometheus
          image: "{{ .Values.observability.prometheus.image }}"
          securityContext:
            {{- include "smsly.containerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: {{ include "smsly-hosting.fullname" . }}-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-prometheus
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: {{ include "smsly-hosting.name" . }}-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'smsly-backend'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['{{ include "smsly-hosting.fullname" . }}-backend:8000']
      - job_name: 'smsly-frontend'
        static_configs:
          - targets: ['{{ include "smsly-hosting.fullname" . }}-frontend:3000']
{{- end }}
