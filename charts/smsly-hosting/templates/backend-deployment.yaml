{{- include "smsly.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-env.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.backend.serviceAccount.create .Values.backend.serviceAccount.name }}
      serviceAccountName: {{ default (printf "%s-backend" (include "smsly-hosting.fullname" .)) .Values.backend.serviceAccount.name }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "smsly.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.global.imageRegistry }}{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          securityContext:
            {{- include "smsly.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "smsly-hosting.dbHost" . }} -p {{ include "smsly-hosting.dbPort" . }} -U {{ include "smsly-hosting.dbUser" . }} -d {{ include "smsly-hosting.dbName" . }}; do
                echo "Waiting for database..."
                sleep 2
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: dbPassword
        - name: wait-for-redis
          image: "{{ .Values.global.imageRegistry }}{{ .Values.redis.image }}"
          securityContext:
            {{- include "smsly.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ include "smsly-hosting.redisHost" . }} -p {{ include "smsly-hosting.redisPort" . }} ${REDIS_PASSWORD:+-a "$REDIS_PASSWORD"} ping; do
                echo "Waiting for redis..."
                sleep 2
              done
          env:
            {{- if or .Values.redis.auth.enabled (and .Values.externalRedis .Values.externalRedis.enabled) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: redisPassword
                  optional: true
            {{- end }}
        - name: migrate
          image: "{{ .Values.global.imageRegistry }}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- include "smsly.containerSecurityContext" . | nindent 12 }}
          command:
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - secretRef:
                name: {{ include "smsly-hosting.secretName" . }}
          env:
            - name: DEBUG
              value: "{{ .Values.backend.env.debug }}"
            - name: DOMAIN
              value: "{{ .Values.global.domain }}"
            - name: POSTGRES_USER
              value: "{{ include "smsly-hosting.dbUser" . }}"
            - name: POSTGRES_DB
              value: "{{ include "smsly-hosting.dbName" . }}"
            - name: POSTGRES_HOST
              value: "{{ include "smsly-hosting.dbHost" . }}"
            - name: POSTGRES_PORT
              value: "{{ include "smsly-hosting.dbPort" . }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: dbPassword
            - name: DATABASE_URL
              value: "postgres://{{ include "smsly-hosting.dbUser" . }}:$(POSTGRES_PASSWORD)@{{ include "smsly-hosting.dbHost" . }}:{{ include "smsly-hosting.dbPort" . }}/{{ include "smsly-hosting.dbName" . }}"
            - name: REDIS_HOST
              value: "{{ include "smsly-hosting.redisHost" . }}"
            - name: REDIS_PORT
              value: "{{ include "smsly-hosting.redisPort" . }}"
            {{- if or .Values.redis.auth.enabled (and .Values.externalRedis .Values.externalRedis.enabled) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: redisPassword
                  optional: true
            {{- end }}
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: GATEWAY_SECRET
                  optional: true
            - name: EDGE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: EDGE_JWT_SECRET
                  optional: true
            - name: CADDY_ASK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: CADDY_ASK_SECRET
                  optional: true
            - name: ALLOWED_HOSTS
              value: "{{ include "smsly-hosting.allowedHosts" . }}"
          volumeMounts:
            - name: home-smsly
              mountPath: /home/smsly
            - name: backups
              mountPath: /app/backups
            - name: tmp
              mountPath: /tmp
        - name: collectstatic
          image: "{{ .Values.global.imageRegistry }}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- include "smsly.containerSecurityContext" . | nindent 12 }}
          command:
            - python
            - manage.py
            - collectstatic
            - --noinput
          envFrom:
            - secretRef:
                name: {{ include "smsly-hosting.secretName" . }}
          env:
            - name: DEBUG
              value: "{{ .Values.backend.env.debug }}"
            - name: DOMAIN
              value: "{{ .Values.global.domain }}"
            - name: POSTGRES_USER
              value: "{{ include "smsly-hosting.dbUser" . }}"
            - name: POSTGRES_DB
              value: "{{ include "smsly-hosting.dbName" . }}"
            - name: POSTGRES_HOST
              value: "{{ include "smsly-hosting.dbHost" . }}"
            - name: POSTGRES_PORT
              value: "{{ include "smsly-hosting.dbPort" . }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: dbPassword
            - name: DATABASE_URL
              value: "postgres://{{ include "smsly-hosting.dbUser" . }}:$(POSTGRES_PASSWORD)@{{ include "smsly-hosting.dbHost" . }}:{{ include "smsly-hosting.dbPort" . }}/{{ include "smsly-hosting.dbName" . }}"
            - name: REDIS_HOST
              value: "{{ include "smsly-hosting.redisHost" . }}"
            - name: REDIS_PORT
              value: "{{ include "smsly-hosting.redisPort" . }}"
            {{- if or .Values.redis.auth.enabled (and .Values.externalRedis .Values.externalRedis.enabled) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: redisPassword
                  optional: true
            {{- end }}
            - name: ALLOWED_HOSTS
              value: "{{ include "smsly-hosting.allowedHosts" . }}"
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: home-smsly
              mountPath: /home/smsly
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- include "smsly.containerSecurityContext" . | nindent 12 }}
          command:
            - gunicorn
            - config.asgi:application
            - --bind
            - "0.0.0.0:{{ .Values.backend.service.port }}"
            - --workers
            - "4"
            - --worker-class
            - "uvicorn.workers.UvicornWorker"
            - --timeout
            - "120"
            - --max-requests
            - "1000"
            - --max-requests-jitter
            - "50"
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "smsly-hosting.secretName" . }}
          env:
            - name: DEBUG
              value: "{{ .Values.backend.env.debug }}"
            - name: DOMAIN
              value: "{{ .Values.global.domain }}"
            - name: POSTGRES_USER
              value: "{{ include "smsly-hosting.dbUser" . }}"
            - name: POSTGRES_DB
              value: "{{ include "smsly-hosting.dbName" . }}"
            - name: POSTGRES_HOST
              value: "{{ include "smsly-hosting.dbHost" . }}"
            - name: POSTGRES_PORT
              value: "{{ include "smsly-hosting.dbPort" . }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: dbPassword
            - name: DATABASE_URL
              value: "postgres://{{ include "smsly-hosting.dbUser" . }}:$(POSTGRES_PASSWORD)@{{ include "smsly-hosting.dbHost" . }}:{{ include "smsly-hosting.dbPort" . }}/{{ include "smsly-hosting.dbName" . }}"
            - name: REDIS_HOST
              value: "{{ include "smsly-hosting.redisHost" . }}"
            - name: REDIS_PORT
              value: "{{ include "smsly-hosting.redisPort" . }}"
            {{- if or .Values.redis.auth.enabled (and .Values.externalRedis .Values.externalRedis.enabled) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: redisPassword
                  optional: true
            {{- end }}
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: GATEWAY_SECRET
                  optional: true
            - name: EDGE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: EDGE_JWT_SECRET
                  optional: true
            - name: CADDY_ASK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "smsly-hosting.secretName" . }}
                  key: CADDY_ASK_SECRET
                  optional: true
            - name: RABBITMQ_HOST
              value: "{{ include "smsly-hosting.rabbitmqHost" . }}"
            - name: RABBITMQ_PORT
              value: "{{ include "smsly-hosting.rabbitmqPort" . }}"
            - name: RABBITMQ_DEFAULT_USER
              value: "{{ include "smsly-hosting.rabbitmqUser" . }}"
            - name: INTERNAL_API_URL
              value: {{ default (printf "http://%s-backend:%v" (include "smsly-hosting.fullname" .) .Values.backend.service.port) .Values.backend.env.internalApiUrl | quote }}
            - name: ALLOWED_HOSTS
              value: "{{ include "smsly-hosting.allowedHosts" . }}"
            {{- if .Values.backend.env.csrfTrustedOrigins }}
            - name: CSRF_TRUSTED_ORIGINS
              value: "{{ .Values.backend.env.csrfTrustedOrigins }}"
            {{- end }}
            {{- if .Values.backend.env.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: "{{ .Values.backend.env.corsAllowedOrigins }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthcheck.path }}
              port: {{ .Values.backend.service.port }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.backend.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.healthcheck.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: {{ .Values.backend.service.port }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.backend.readinessProbe.successThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: media
              mountPath: /app/media
            - name: caddy-config
              mountPath: /caddy-config
            - name: home-smsly
              mountPath: /home/smsly
            - name: backups
              mountPath: /app/backups
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: staticfiles
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "smsly-hosting.fullname" . }}-media
        - name: caddy-config
          emptyDir: {}
        - name: home-smsly
          emptyDir: {}
        - name: backups
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-media
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-media
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - {{ default "ReadWriteOnce" .Values.persistence.accessMode }}
  resources:
    requests:
      storage: 10Gi
