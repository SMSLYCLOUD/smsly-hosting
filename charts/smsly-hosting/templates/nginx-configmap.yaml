{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-nginx
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;

      server {
        listen {{ .Values.nginx.service.port }};
        server_name _;

        location /health {
          proxy_pass http://{{ include "smsly-hosting.fullname" . }}-backend:{{ .Values.backend.service.port }}/health;
        }

        location /api {
          proxy_pass http://{{ include "smsly-hosting.fullname" . }}-backend:{{ .Values.backend.service.port }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin {
          proxy_pass http://{{ include "smsly-hosting.fullname" . }}-backend:{{ .Values.backend.service.port }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
          proxy_pass http://{{ include "smsly-hosting.fullname" . }}-backend:{{ .Values.backend.service.port }};
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
        }

        location /static {
          proxy_pass http://{{ include "smsly-hosting.fullname" . }}-backend:{{ .Values.backend.service.port }};
        }

        location /media {
          proxy_pass http://{{ include "smsly-hosting.fullname" . }}-backend:{{ .Values.backend.service.port }};
        }

        location / {
          proxy_pass http://{{ include "smsly-hosting.fullname" . }}-frontend:{{ .Values.frontend.service.port }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-nginx
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-nginx
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-nginx
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image }}"
          ports:
            - containerPort: {{ .Values.nginx.service.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "smsly-hosting.fullname" . }}-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smsly-hosting.fullname" . }}-nginx
  labels:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: {{ .Values.nginx.service.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "smsly-hosting.name" . }}-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
