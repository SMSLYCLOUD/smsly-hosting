[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths =
    backend
    tests
    rust_twin
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    tmp
    frontend
    node_modules
    .git
    .pytest_cache
    __pycache__
    scratch
    verification
addopts = --import-mode=importlib -ra --strict-markers --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration (requires external services)
    security: marks tests as security regression tests
    e2e: marks tests as end-to-end (requires running stack)
    smoke: marks tests as smoke tests (run in CI fast path)
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:celery.*
    ignore::PendingDeprecationWarning
