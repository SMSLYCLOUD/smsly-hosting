      context: ./backend
      dockerfile: Dockerfile
    image: smsly-hosting-backend:latest
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --worker-class
      uvicorn.workers.UvicornWorker --timeout ${GUNICORN_TIMEOUT:-600}
    restart: unless-stopped
    # SECURITY: NET_ADMIN was used for iptables in dev; in prod the host should
    # manage firewall rules, not the app container. Re-enable only if a
    # specific feature requires it and document why.
    env_file: .env
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis-primary}
      UVICORN_WS_PING_INTERVAL: 20
      UVICORN_WS_PING_TIMEOUT: 20
      MASTER_MESH_IP: ${MASTER_MESH_IP:-}
      # SECURITY: Use Docker DNS (registry:5000) for inter-container
      # communication. 127.0.0.1:5000 resolves to the container's OWN
      # loopback, not the host's registry. The Docker daemon push goes
      # through socket-proxy which resolves registry:5000 on the smsly-net
      # overlay to the registry container.
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-registry:5000}
      DOCKER_HOST: tcp://socket-proxy:2375

      SMSLY_ENABLE_STARTUP_CADDY_SYNC: ${SMSLY_ENABLE_STARTUP_CADDY_SYNC:-true}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
      APT_CACHE_HOST: http://apt-cacher:3142
      NPM_REGISTRY_URL: http://verdaccio:4873
    depends_on:
      pgcat:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      registry:
        condition: service_started
    volumes:
    - static_volume:/app/staticfiles
    - media_volume:/app/media
    - caddy_config:/caddy-config
    # SECURITY: install.sh is baked into the Docker image. The host bind
    # mount was overriding it with a stale copy, causing provisioning
    # failures (acquire_install_lock not found) until the host pulled.
    # SECURITY: mount .env read-only. The backend's platform-config sync
    # (`apps.deployments.signals.sync_infrastructure_on_config_change`) writes
    # to /app/.env, but the existing PermissionError handler already logs a
    # warning and continues; the new value persists in DB and is re-applied
    # at process restart. For full read-write sync, switch to a writable
    # volume (e.g. `caddy_env:/app/.env`) instead of a host-file bind.
    - ./.env:/app/.env:ro,z
    # SECURITY: removed `./:/platform-src:ro` bind mount. Mounting the full
    # repo into the backend container leaks the entire host source tree to
    # every backend process and the deploy worker. The two files actually
    # used from that tree (install.sh, infrastructure/.../docker-labels-
    # exporter.py) are now accessed via the explicit single-file install.sh
    # mount above, and via /app/infrastructure/... when the backend image
    # bundles it (the prometheus_targets loader has a fallback chain).
    - /opt/smsly-cache:/opt/smsly-cache:z
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds:z
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets:z
    - /opt/smsly-hosting/cosign-keys:/opt/smsly-hosting/cosign-keys:z
    - backups_data:/app/backups
    - caddy_logs:/var/log/caddy:ro
    - traefik_logs:/var/log/traefik:ro
    # Mount auth directory so the signal can sync htpasswd when registry
    # credentials change via the Settings UI. The entrypoint chowns this
    # to UID 1000 (smsly) so the Django process can write htpasswd.
    - ./auth:/auth:rw,z
