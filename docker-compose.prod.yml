# SMSLY Hosting Production Stack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      # SECURITY: No default password - must be set in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsly_admin -d smsly_hosting"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smsly-net

  pgbouncer:
    build:
      context: ./infrastructure/pgbouncer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-smsly_admin}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-smsly_hosting}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: 10
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_MAX_CLIENT_CONN: 10000
      PGBOUNCER_MAX_DB_CONNECTIONS: 20
      PGBOUNCER_SERVER_RESET_QUERY: DISCARD ALL
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_PORT: 5432
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-smsly_hosting}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-smsly_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: 64M

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smsly-net

  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - smsly-net

  # NOTE: backend-init removed - migrations run by install script
  # This avoids blocking issues with containers that don't exit properly

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Use ASGI so Django Channels WebSockets (`/ws/...`) work in production.
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: registry:5000
      DOCKER_HOST: tcp://socket-proxy:2375  # Connect via restricted proxy
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - caddy_config:/caddy-config
      - ./install.sh:/app/install.sh:ro
      - ./:/platform-src:ro
      # SECURITY: Use socket-proxy instead of direct socket mount
      # - /var/run/docker.sock:/var/run/docker.sock  # REMOVED - security risk
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=4
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: registry:5000
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      pgbouncer:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    volumes:
      - media_volume:/app/media
      - ./install.sh:/app/install.sh:ro
      - ./:/platform-src:ro
    networks:
      - smsly-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    restart: unless-stopped
    env_file: .env
    depends_on:
      pgbouncer:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
    networks:
      - smsly-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"  # Security: Bind to localhost only
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: 128M

  # Docker Socket Proxy - Restricted access to Docker daemon
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      # Only allow specific Docker API calls (least privilege)
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      BUILD: 1
      # Required for provisioning/deployments (create/start containers, create networks/volumes, etc.)
      POST: 1
      PUT: 1
      DELETE: 1
      EXEC: 1
      # Deny dangerous operations
      SERVICES: 0
      SWARM: 0
      NODES: 0
      CONFIGS: 0
      SECRETS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only mount
    networks:
      - smsly-net

  # Traefik - Dynamic reverse proxy for deployed containers
  # Reads Docker labels from deployed containers and routes traffic to them.
  # Caddy handles SSL and proxies *.cloud.smsly.cloud → Traefik:8081
  route-fallback:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/route-fallback/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/route-fallback/index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.route-fallback.rule=PathPrefix(`/`)"
      - "traefik.http.routers.route-fallback.entrypoints=web"
      - "traefik.http.routers.route-fallback.priority=1"
      - "traefik.http.services.route-fallback.loadbalancer.server.port=80"
    networks:
      - smsly-net

  traefik:
    image: traefik:v3.6  # v3.6.1+ required for Docker 29 API compatibility
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=smsly-net"
      # Read Docker metadata via restricted socket-proxy
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--entrypoints.web.address=:80"
      - "--log.level=WARN"
    ports:
      - "127.0.0.1:8081:80"      # Deployed apps (Caddy proxies *.cloud.smsly.cloud here)
      - "127.0.0.1:8082:8080"    # Traefik dashboard (optional debug)
    depends_on:
      socket-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  smsly-net:
    external: true
    name: smsly-net

volumes:
  postgres_data:
  redis_data:
  registry_data:
  static_volume:
  media_volume:
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smsly-hosting/caddy-config
