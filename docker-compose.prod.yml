services:
  # ── PostgreSQL HA (primary + replica) ──────────────────────────────────
  # Service is named `db` for backwards compat with scripts; container name
  # and network alias keep `postgres-primary` resolvable for HA configs.
  # Profile: "local-ha" — only started with --profile local-ha
  db:
    profiles: ["local-ha"]
    security_opt:
      - apparmor:docker-default
    image: postgres:16-alpine
    container_name: smsly-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-}
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - postgres-archive:/var/lib/postgresql/archive
      - ./infrastructure/docker/postgres/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_log_hints=on
      -c hot_standby=on
      -c wal_keep_size=1GB
      -c max_slot_wal_keep_size=${PG_MAX_SLOT_WAL_KEEP_SIZE:-5GB}
      -c wal_sender_timeout=60s
      -c archive_mode=on
      -c archive_command='mkdir -p /var/lib/postgresql/archive && cp %p /var/lib/postgresql/archive/%f'
      -c max_connections=${DB_MAX_CONNECTIONS:-200}
      -c shared_buffers=${DB_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" pg_isready -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    networks:
      smsly-net:
        aliases:
        - postgres-primary
    deploy:
      resources:
        reservations:
          memory: ${DB_PRIMARY_RESERVATION:-2G}
        limits:
          memory: ${DB_PRIMARY_LIMIT:-8G}

  postgres-replica:
    profiles: ["local-ha"]
    security_opt:
      - apparmor:docker-default
    image: postgres:16-alpine
    container_name: smsly-postgres-replica
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      PGUSER: replicator
      PGPASSWORD: ${REPLICATION_PASSWORD:-}
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - postgres-archive:/var/lib/postgresql/archive
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Initializing replica from primary..."
          pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -Fp -Xs -P -R
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on -c max_connections=300
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" pg_isready -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${DB_REPLICA_RESERVATION:-1G}
        limits:
          memory: ${DB_REPLICA_LIMIT:-4G}
  pgcat:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: ./infrastructure/pgcat
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${PGCAT_DB_HOST:-postgres-primary}
      POSTGRES_PORT: ${PGCAT_DB_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      PGCAT_ADMIN_PASSWORD: ${PGCAT_ADMIN_PASSWORD:?PGCAT_ADMIN_PASSWORD must be set in .env}
      DB_REPLICA_HOSTS: ${DB_REPLICA_HOSTS:-postgres-replica:5432}
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1', 6432)); s.close()"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    ports:
      - "${PGCAT_BIND_IP:-127.0.0.1}:5432:6432"
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${PGCAT_MEMORY_LIMIT:-256M}
          cpus: "0.50"
  # ── Patroni HA (auto-failover via etcd DCS) ──────────────────────────────
  # Profile: "patroni" — only started with --profile patroni
  # Replaces db + postgres-replica for automatic failover.
  etcd:
    profiles: ["patroni"]
    image: quay.io/coreos/etcd:v3.5.9
    container_name: smsly-etcd
    command: etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd:2379 --listen-peer-urls http://0.0.0.0:2380
    restart: unless-stopped
    volumes:
      - etcd-data:/var/lib/etcd
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
    - managed_by=smsly-hosting
    deploy:
      resources:
        limits:
          memory: ${ETCD_MEMORY_LIMIT:-256M}

  patroni1:
    profiles: ["patroni"]
    image: ghcr.io/zalando/spilo-16:3.0-p1
    container_name: smsly-patroni-1
    hostname: patroni1
    restart: unless-stopped
    environment:
      SCOPE: smsly-cluster
      ETCD3_HOST: "etcd:2379"
      PATRONI_NAME: patroni1
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${PATRONI_SUPERUSER_PASSWORD:-}
      PGUSER_ADMIN: ${POSTGRES_USER:-smsly_admin}
      PGPASSWORD_ADMIN: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGPASSWORD_STANDBY: ${REPLICATION_PASSWORD:-}
      # POD_IP intentionally unset — Spilo auto-detects the container IP for
      # Patroni connect_address. A hardcoded value breaks after re-creation.
    volumes:
      - patroni1-data:/var/lib/postgresql/data
      - patroni-wal:/var/lib/postgresql/wal
    networks:
      - smsly-net
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    deploy:
      resources:
        reservations:
          memory: ${PATRONI_PRIMARY_RESERVATION:-2G}
        limits:
          memory: ${PATRONI_PRIMARY_LIMIT:-8G}

  patroni2:
    profiles: ["patroni"]
    image: ghcr.io/zalando/spilo-16:3.0-p1
    container_name: smsly-patroni-2
    hostname: patroni2
    restart: unless-stopped
    environment:
      SCOPE: smsly-cluster
      ETCD3_HOST: "etcd:2379"
      PATRONI_NAME: patroni2
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${PATRONI_SUPERUSER_PASSWORD}
      PGUSER_ADMIN: ${POSTGRES_USER:-smsly_admin}
      PGPASSWORD_ADMIN: ${POSTGRES_PASSWORD}
      PGPASSWORD_STANDBY: ${REPLICATION_PASSWORD}
    volumes:
      - patroni2-data:/var/lib/postgresql/data
      - patroni-wal:/var/lib/postgresql/wal
    networks:
      - smsly-net
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    deploy:
      resources:
        reservations:
          memory: ${PATRONI_REPLICA_RESERVATION:-1G}
        limits:
          memory: ${PATRONI_REPLICA_LIMIT:-4G}

  patroni3:
    profiles: ["patroni"]
    image: ghcr.io/zalando/spilo-16:3.0-p1
    container_name: smsly-patroni-3
    hostname: patroni3
    restart: unless-stopped
    environment:
      SCOPE: smsly-cluster
      ETCD3_HOST: "etcd:2379"
      PATRONI_NAME: patroni3
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${PATRONI_SUPERUSER_PASSWORD}
      PGUSER_ADMIN: ${POSTGRES_USER:-smsly_admin}
      PGPASSWORD_ADMIN: ${POSTGRES_PASSWORD}
      PGPASSWORD_STANDBY: ${REPLICATION_PASSWORD}
    volumes:
      - patroni3-data:/var/lib/postgresql/data
      - patroni-wal:/var/lib/postgresql/wal
    networks:
      - smsly-net
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    deploy:
      resources:
        reservations:
          memory: ${PATRONI_REPLICA_RESERVATION:-1G}
        limits:
          memory: ${PATRONI_REPLICA_LIMIT:-4G}

  haproxy:
    profiles: ["patroni"]
    image: haproxy:2.8
    container_name: smsly-haproxy
    restart: unless-stopped
    volumes:
      - ./infrastructure/docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${HAPROXY_WRITE_BIND:-127.0.0.1}:5000:5000"
      - "${HAPROXY_READ_BIND:-127.0.0.1}:5001:5001"
      - "127.0.0.1:7000:7000"
    networks:
      - smsly-net
    depends_on:
      patroni1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7000/ | grep -q postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
    - managed_by=smsly-hosting
    deploy:
      resources:
        limits:
          memory: ${HAPROXY_MEMORY_LIMIT:-128M}

  # One-shot bootstrap: creates the app database owned by the app user.
  # Spilo creates the smsly_admin role (PGUSER_ADMIN) but NOT the database.
  # Idempotent — safe on every `compose up`.
  patroni-db-init:
    profiles: ["patroni"]
    image: postgres:16-alpine
    container_name: smsly-patroni-db-init
    restart: "no"
    environment:
      PGHOST: haproxy
      PGPORT: "5000"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${PATRONI_SUPERUSER_PASSWORD:-}
      APP_DB: ${POSTGRES_DB:-smsly_hosting}
      APP_USER: ${POSTGRES_USER:-smsly_admin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Patroni leader via HAProxy..."
        i=0
        until psql -tAc "SELECT 1" >/dev/null 2>&1; do
          i=$$((i+1))
          if [ $$i -gt 60 ]; then echo "Leader not reachable after 300s"; exit 1; fi
          sleep 5
        done
        echo "Creating database $$APP_DB owned by $$APP_USER (idempotent)..."
        psql -v ON_ERROR_STOP=0 <<SQL
        SELECT 'CREATE DATABASE "$$APP_DB" OWNER "$$APP_USER"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$APP_DB')\gexec
        SQL
        echo "Granting schema privileges..."
        psql -d "$$APP_DB" -c "GRANT ALL ON SCHEMA public TO \"$$APP_USER\";" || true
        echo "patroni-db-init complete."
    networks:
      - smsly-net
    depends_on:
      haproxy:
        condition: service_healthy
    labels:
    - managed_by=smsly-hosting

  # ── Redis HA (primary + replica + 3 sentinels) ─────────────────────────
  redis-primary:
    security_opt:
      - apparmor:docker-default
    read_only: true
    image: redis:7-alpine
    container_name: smsly-redis-primary
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --maxmemory ${REDIS_MAXMEMORY:-400mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --repl-backlog-size 64mb
      --repl-backlog-ttl 3600
      --min-replicas-to-write ${REDIS_MIN_REPLICAS_TO_WRITE:-0}
      --min-replicas-max-lag ${REDIS_MIN_REPLICAS_MAX_LAG:-10}
    volumes:
      - redis-primary-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${REDIS_PRIMARY_RESERVATION:-256M}
        limits:
          memory: ${REDIS_PRIMARY_LIMIT:-1G}

  redis-replica:
    security_opt:
      - apparmor:docker-default
    read_only: true
    image: redis:7-alpine
    container_name: smsly-redis-replica
    restart: unless-stopped
    command: >
      redis-server
      --replicaof redis-primary 6379
      --masterauth ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-400mb}
      --maxmemory-policy allkeys-lru
      --replica-read-only yes
      --repl-diskless-sync yes
      --repl-diskless-sync-delay 5
      --repl-ping-replica-period 5
    volumes:
      - redis-replica-data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${REDIS_REPLICA_RESERVATION:-128M}
        limits:
          memory: ${REDIS_REPLICA_LIMIT:-512M}

  redis-sentinel-1:
    security_opt:
      - apparmor:docker-default
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=1M
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-1
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD}
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          "sentinel monitor mymaster redis-primary 6379 2" \
          "sentinel auth-pass mymaster $${REDIS_PASSWORD}" \
          "sentinel down-after-milliseconds mymaster 5000" \
          "sentinel failover-timeout mymaster 15000" \
          "sentinel parallel-syncs mymaster 1" \
          "sentinel resolve-hostnames yes" \
          "sentinel announce-hostnames yes" \
          > /tmp/sentinel.conf
        if [ -n "$$SENTINEL_PASSWORD" ]; then
          echo "sentinel sentinel-user default" >> /tmp/sentinel.conf
          echo "sentinel sentinel-pass $$SENTINEL_PASSWORD" >> /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-primary:
        condition: service_started
      redis-replica:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${SENTINEL_MEMORY_LIMIT:-32M}

  redis-sentinel-2:
    security_opt:
      - apparmor:docker-default
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=1M
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-2
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD}
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          "sentinel monitor mymaster redis-primary 6379 2" \
          "sentinel auth-pass mymaster $${REDIS_PASSWORD}" \
          "sentinel down-after-milliseconds mymaster 5000" \
          "sentinel failover-timeout mymaster 15000" \
          "sentinel parallel-syncs mymaster 1" \
          "sentinel resolve-hostnames yes" \
          "sentinel announce-hostnames yes" \
          > /tmp/sentinel.conf
        if [ -n "$$SENTINEL_PASSWORD" ]; then
          echo "sentinel sentinel-user default" >> /tmp/sentinel.conf
          echo "sentinel sentinel-pass $$SENTINEL_PASSWORD" >> /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-primary:
        condition: service_started
      redis-replica:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${SENTINEL_MEMORY_LIMIT:-32M}

  redis-sentinel-3:
    security_opt:
      - apparmor:docker-default
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=1M
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-3
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD}
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          "sentinel monitor mymaster redis-primary 6379 2" \
          "sentinel auth-pass mymaster $${REDIS_PASSWORD}" \
          "sentinel down-after-milliseconds mymaster 5000" \
          "sentinel failover-timeout mymaster 15000" \
          "sentinel parallel-syncs mymaster 1" \
          "sentinel resolve-hostnames yes" \
          "sentinel announce-hostnames yes" \
          > /tmp/sentinel.conf
        if [ -n "$$SENTINEL_PASSWORD" ]; then
          echo "sentinel sentinel-user default" >> /tmp/sentinel.conf
          echo "sentinel sentinel-pass $$SENTINEL_PASSWORD" >> /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-primary:
        condition: service_started
      redis-replica:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${SENTINEL_MEMORY_LIMIT:-32M}
  registry:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: registry:2.8.3
    restart: unless-stopped
    ports:
    # Localhost by default; set REGISTRY_BIND_IP=0.0.0.0 or 10.100.0.1 in .env for multi-node mesh
    - "${REGISTRY_BIND_IP:-127.0.0.1}:5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: ":5000"
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-}
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
      REGISTRY_AUTH_HTPASSWD_REALM: registry-realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry_data:/var/lib/registry
      - ./certs:/certs:ro,z
      - ./auth:/auth:ro,z
    healthcheck:
      # registry:2.8.3 is scratch-based (no shell, no curl/wget).
      # The Docker restart policy handles crash recovery.
      # For active health monitoring, run the registry-health.sh script
      # from the host or use an external monitoring container.
      test: ["NONE"]
      disable: true
    labels:
    - managed_by=smsly-hosting
    # SECURITY: No public Traefik route — registry is accessed via
    # Docker DNS (registry:5000) for inter-container communication
    # inside smsly-net, or via WireGuard mesh IP (10.100.0.1:5000)
    # for remote nodes. The public domain (registry.smsly.cloud)
    # should be routed through Caddy's reverse proxy with TLS
    # termination, not Traefik, to avoid leaking the registry port.
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${REGISTRY_MEMORY_LIMIT:-1G}
  docker-mirror:
    profiles:
      - build-cache
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - docker_mirror_data:/var/lib/registry
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:5000/v2/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${DOCKER_MIRROR_MEMORY_LIMIT:-512M}
  apt-cacher:
    security_opt:
      - apparmor:docker-default
    image: sameersbn/apt-cacher-ng:latest
    container_name: smsly-apt-cacher
    restart: unless-stopped
    volumes:
      - apt_cache:/var/cache/apt-cacher-ng
      - apt_log:/var/log/apt-cacher-ng
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3142/acng-report.html || exit 1"]
