services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" pg_isready -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: -c max_connections=${DB_MAX_CONNECTIONS:-200}
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${DB_MEMORY_RESERVATION:-1G}
        limits:
          memory: ${DB_MEMORY_LIMIT:-4G}
  pgcat:
    build:
      context: ./infrastructure/pgcat
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      PGCAT_ADMIN_PASSWORD: ${PGCAT_ADMIN_PASSWORD:?PGCAT_ADMIN_PASSWORD must be set in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}" -c "SELECT 1;" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    ports:
      - "10.100.0.1:5432:5432"
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${PGCAT_MEMORY_LIMIT:-256M}
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env} --maxmemory ${REDIS_MAXMEMORY:-400mb} --maxmemory-policy allkeys-lru --repl-backlog-size 64mb --repl-backlog-ttl 3600
    restart: unless-stopped
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-256M}
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512M}
  registry:
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: registry:2.8.3
    restart: unless-stopped
    ports:
    # SECURITY: registry on loopback only; build hosts reach it via SSH tunnel
    # or the internal smsly-net overlay through the Traefik proxy.
    - 127.0.0.1:5000:5000
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: ":5000"
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test:
      - CMD-SHELL
      - timeout 5 nc -z 127.0.0.1 5000 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${REGISTRY_MEMORY_LIMIT:-1G}
  docker-mirror:
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      - 5001:5000
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - docker_mirror_data:/var/lib/registry
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:5000/v2/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${DOCKER_MIRROR_MEMORY_LIMIT:-512M}
  apt-cacher:
    image: sameersbn/apt-cacher-ng:latest
    container_name: smsly-apt-cacher
    restart: unless-stopped
    volumes:
      - apt_cache:/var/cache/apt-cacher-ng
      - apt_log:/var/log/apt-cacher-ng
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3142/acng-report.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${APT_CACHE_MEMORY_LIMIT:-256M}

  verdaccio:
    image: verdaccio/verdaccio:latest
    container_name: smsly-verdaccio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - verdaccio_data:/verdaccio
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4873/-/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${VERDACCIO_MEMORY_LIMIT:-256M}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --worker-class
      uvicorn.workers.UvicornWorker --timeout ${GUNICORN_TIMEOUT:-600}
    restart: unless-stopped
    # SECURITY: NET_ADMIN was used for iptables in dev; in prod the host should
    # manage firewall rules, not the app container. Re-enable only if a
    # specific feature requires it and document why.
    env_file: .env
    environment:
      UVICORN_WS_PING_INTERVAL: 20
      UVICORN_WS_PING_TIMEOUT: 20
      MASTER_MESH_IP: ${MASTER_MESH_IP:-}
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-127.0.0.1:5000}
      DOCKER_HOST: tcp://socket-proxy:2375
      BUILDKIT_HOST: tcp://buildkitd:1234
      SMSLY_ENABLE_STARTUP_CADDY_SYNC: ${SMSLY_ENABLE_STARTUP_CADDY_SYNC:-true}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
      APT_CACHE_HOST: http://apt-cacher:3142
      NPM_REGISTRY_URL: http://verdaccio:4873
    depends_on:
      pgcat:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - static_volume:/app/staticfiles
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - ./install.sh:/app/install.sh:ro
    # SECURITY: mount .env read-only. The backend's platform-config sync
    # (`apps.deployments.signals.sync_infrastructure_on_config_change`) writes
    # to /app/.env, but the existing PermissionError handler already logs a
    # warning and continues; the new value persists in DB and is re-applied
    # at process restart. For full read-write sync, switch to a writable
    # volume (e.g. `caddy_env:/app/.env`) instead of a host-file bind.
    - ./.env:/app/.env:ro
    # SECURITY: removed `./:/platform-src:ro` bind mount. Mounting the full
    # repo into the backend container leaks the entire host source tree to
    # every backend process and the deploy worker. The two files actually
    # used from that tree (install.sh, infrastructure/.../docker-labels-
    # exporter.py) are now accessed via the explicit single-file install.sh
    # mount above, and via /app/infrastructure/... when the backend image
    # bundles it (the prometheus_targets loader has a fallback chain).
    - /opt/smsly-cache:/opt/smsly-cache
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets
    - backups_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
    - smsly-net
    deploy:
      update_config:
        order: start-first
      resources:
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-512M}
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
    labels:
    - traefik.enable=true
    - traefik.http.routers.backend.rule=PathPrefix(`/api/v1/`) || PathPrefix(`/admin/`) || PathPrefix(`/health/`) || PathPrefix(`/accounts/`) || PathPrefix(`/dj-rest-auth/`)
    - traefik.http.routers.backend.entrypoints=web
    - traefik.http.routers.backend.priority=10
    - traefik.http.routers.backend.middlewares=api-ratelimit,backend-cb
    - traefik.http.middlewares.api-ratelimit.ratelimit.average=200
    - traefik.http.middlewares.api-ratelimit.ratelimit.period=1s
    - traefik.http.middlewares.api-ratelimit.ratelimit.burst=50
    - traefik.http.middlewares.backend-cb.circuitbreaker.expression=ResponseCodeRatio(500, 600, 0, 600) > 0.30
    - traefik.http.middlewares.backend-cb.circuitbreaker.checkperiod=10s
    - traefik.http.middlewares.backend-cb.circuitbreaker.fallbackduration=30s
    - traefik.http.services.backend.loadbalancer.server.port=8000
    - traefik.docker.network=smsly-net
    - managed_by=smsly-hosting
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --autoscale=${CELERY_AUTOSCALE:-12,4} -Q celery
    restart: unless-stopped
    env_file: .env
    environment:
      MASTER_MESH_IP: ${MASTER_MESH_IP:-}
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-127.0.0.1:5000}
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - ./install.sh:/app/install.sh:ro
    - /opt/smsly-cache:/opt/smsly-cache
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets
    - backups_data:/app/backups
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info -S redbeat.RedBeatScheduler --pidfile=/app/celerybeat.pid
    restart: unless-stopped
    env_file: .env
    environment:
      MASTER_MESH_IP: ${MASTER_MESH_IP:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      REDBEAT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 300s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NODE_BUILD_MEMORY_MB: ${FRONTEND_BUILD_MEMORY_MB:-2048}
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
    - smsly-net
    deploy:
      update_config:
        order: start-first
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-1G}
    labels:
    - traefik.enable=true
    - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) || Host(`${PUBLIC_IP}`) || Host(`localhost`) || Host(`127.0.0.1`)
    - traefik.http.routers.frontend.entrypoints=web
    - traefik.http.routers.frontend.priority=5
    - traefik.http.services.frontend.loadbalancer.server.port=3000
    - traefik.docker.network=smsly-net
    - managed_by=smsly-hosting
  celery-fast:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --autoscale=${CELERY_FAST_AUTOSCALE:-8,2} -Q fast
    restart: always
    env_file: .env
    environment:
      MASTER_MESH_IP: ${MASTER_MESH_IP:-}
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-127.0.0.1:5000}
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - ./install.sh:/app/install.sh:ro
    - /opt/smsly-cache:/opt/smsly-cache
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds
    - backups_data:/app/backups
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
  celery-deploy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --autoscale=${CELERY_DEPLOY_AUTOSCALE:-8,2} -Q deploy --hostname=deploy@%h
    restart: unless-stopped
    env_file: .env
    environment:
      MASTER_MESH_IP: ${MASTER_MESH_IP:-}
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-127.0.0.1:5000}
      DOCKER_HOST: tcp://socket-proxy:2375
      BUILDKIT_HOST: tcp://buildkitd:1234
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
      APT_CACHE_HOST: http://apt-cacher:3142
      NPM_REGISTRY_URL: http://verdaccio:4873
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - ./install.sh:/app/install.sh:ro
    - /opt/smsly-cache:/opt/smsly-cache
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds
    - backups_data:/app/backups
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
  socket-proxy:
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: tecnativa/docker-socket-proxy:0.1.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      BUILD: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      COMMIT: 1
      EXEC: 1
      POST: 1
      DELETE: 0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2375/version || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
    deploy:
      resources:
        limits:
          memory: ${SOCKET_PROXY_MEMORY_LIMIT:-256M}
  route-fallback:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
    - ./infrastructure/route-fallback/Caddyfile:/etc/caddy/Caddyfile:ro
    - ./infrastructure/route-fallback/index.html:/srv/index.html:ro
    labels:
    - traefik.enable=true
    - traefik.http.routers.route-fallback.rule=PathPrefix(`/`)
    - traefik.http.routers.route-fallback.entrypoints=web
    - traefik.http.routers.route-fallback.priority=1
    - traefik.http.services.route-fallback.loadbalancer.server.port=80
    - managed_by=smsly-hosting
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:80/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${ROUTE_FALLBACK_MEMORY_LIMIT:-128M}
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.docker.network=smsly-net
    - --providers.docker.endpoint=tcp://socket-proxy:2375
    - --providers.docker.httpClientTimeout=300s
    - --entrypoints.web.address=:80
    - --entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http.tls=true
    - --entrypoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
    - --entrypoints.metrics.address=:8082
    # SECURITY: removed --api.insecure=true; the dashboard now requires auth
    # via a Traefik middleware (configure traefik.http.routers.api.middlewares
    # with a basicauth/forwardauth handler on a websecure entrypoint). The
    # :8082 port mapping below remains for Prometheus metrics, not the API.
    - --metrics.prometheus=true
    - --metrics.prometheus.entrypoint=metrics
    - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@${DOMAIN:-localhost}}
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    - --log.level=WARN
    - --ping=true
    ports:
    - "${TRAEFIK_HTTP_BIND:-127.0.0.1:8081}:80"
    - "${TRAEFIK_HTTPS_BIND:-127.0.0.1:8443}:443"
    - 127.0.0.1:8082:8082
    volumes:
    - letsencrypt_data:/letsencrypt
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
    - no-new-privileges:true
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
    deploy:
      resources:
        limits:
          cpus: '${TRAEFIK_CPU_LIMIT:-0.50}'
          memory: ${TRAEFIK_MEMORY_LIMIT:-512M}
  frps:
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: snowdreamtech/frps:0.61.0
    restart: unless-stopped
    env_file: .env
    environment:
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:?FRP_AUTH_TOKEN must be set in .env}
      TUNNEL_DOMAIN: ${TUNNEL_DOMAIN:-tunnel.localhost}
    volumes:
    - ./infrastructure/frps/frps.toml:/etc/frp/frps.toml:ro
    ports:
    # SECURITY: bind the frps control port to loopback. NOTE: real tunnels
    # need a public ingress — terminate them on the host firewall / reverse
    # proxy and forward to this loopback port, or rebind to the public IP
    # explicitly (do NOT use 0.0.0.0).
    - 127.0.0.1:7000:7000
    - 127.0.0.1:7080:7080
    - 127.0.0.1:7500:7500
    command:
    - -c
    - /etc/frp/frps.toml
    entrypoint:
    - frps
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 7000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${FRPS_MEMORY_LIMIT:-256M}
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      # SECURITY: AMQP broker on loopback; producers/consumers talk to it
      # through the smsly-net overlay only.
      - "127.0.0.1:5672:5672"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smsly_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      RABBITMQ_MEMORY_WATERMARK: ${RABBITMQ_MEMORY_WATERMARK:-0.6}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    command: sh -c 'echo "vm_memory_high_watermark.relative = $${RABBITMQ_MEMORY_WATERMARK:-0.6}" > /etc/rabbitmq/conf.d/10-smsly.conf && exec docker-entrypoint.sh rabbitmq-server'
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${RABBITMQ_MEMORY_RESERVATION:-256M}
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-1G}
  buildkitd:
    image: moby/buildkit:latest
    container_name: smsly-buildkitd
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_ADMIN
    networks:
      - smsly-net
    volumes:
      - buildkit_data:/var/lib/buildkit
    tmpfs:
      - /tmp
    command:
      - --addr=tcp://0.0.0.0:1234
    healthcheck:
      test: ["CMD", "buildctl", "debug", "workers"]
      interval: 30s
      timeout: 10s
      retries: 3
  caddy:
    build:
      context: .
      dockerfile: infrastructure/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./caddy-config:/etc/caddy
      - caddy_config:/config
      - caddy_data:/data
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-512M}
networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true
  smsly-proxy:
    external: true
volumes:
  postgres_data: null
  redis_data: null
  registry_data: null
  docker_mirror_data: null
  static_volume: null
  media_volume: null
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smsly-hosting/caddy-config
  caddy_data:
    driver: local
  backups_data: null
  rabbitmq_data: null
  letsencrypt_data: null
  apt_cache: null
  apt_log: null
  verdaccio_data: null
  buildkit_data: null
