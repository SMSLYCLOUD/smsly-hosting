# SMSLY Hosting Production Stack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      # SECURITY: No default password - crash if not set
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsly_admin -d smsly_hosting"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - smsly-net

  pgbouncer:
    build:
      context: ./infrastructure/pgbouncer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-smsly_admin}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-smsly_hosting}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: 10
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_MAX_CLIENT_CONN: 10000
      PGBOUNCER_MAX_DB_CONNECTIONS: 20
      PGBOUNCER_SERVER_RESET_QUERY: DISCARD ALL
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_PORT: 5432
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-smsly_hosting}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-smsly_admin}",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - smsly-net

  redis:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - smsly-net

  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - smsly-net

  # NOTE: backend-init removed - migrations run by install script
  # This avoids blocking issues with containers that don't exit properly

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Use ASGI so Django Channels WebSockets (`/ws/...`) work in production.
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 600
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: registry:5000
      DOCKER_HOST: tcp://socket-proxy:2375 # Connect via restricted proxy
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - caddy_config:/caddy-config
      - ./install.sh:/app/install.sh:ro
      - ./:/platform-src:ro
      - /opt/smsly-cache:/opt/smsly-cache
      - backups_data:/app/backups
      # SECURITY: Use socket-proxy instead of direct socket mount
      # - /var/run/docker.sock:/var/run/docker.sock  # REMOVED - security risk
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - smsly-net

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=8 -Q celery
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: registry:5000
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    volumes:
      - media_volume:/app/media
      - caddy_config:/caddy-config
      - ./install.sh:/app/install.sh:ro
      - ./:/platform-src:ro
      - /opt/smsly-cache:/opt/smsly-cache
      - backups_data:/app/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    networks:
      - smsly-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    env_file: .env
    environment:
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
      - caddy_config:/caddy-config
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1",
        ]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s
    networks:
      - smsly-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NODE_BUILD_MEMORY_MB: ${FRONTEND_BUILD_MEMORY_MB:-2048}
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smsly-net

  # Fast worker (Heartbeats, Metrics) - Low latency, high frequency
  celery-fast:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=8 -Q fast
    restart: always
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: registry:5000
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    volumes:
      - media_volume:/app/media
      - caddy_config:/caddy-config
      - ./install.sh:/app/install.sh:ro
      - ./:/platform-src:ro
      - /opt/smsly-cache:/opt/smsly-cache
      - backups_data:/app/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    networks:
      - smsly-net
      - socket-proxy

  # Deploy worker (Builds, Cleanup) - High latency, low frequency
  celery-deploy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Queue 'deploy' matches routing in settings.py / celery.py
    command: celery -A config worker -l info --concurrency=32 -Q deploy
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: registry:5000
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    volumes:
      - media_volume:/app/media
      - caddy_config:/caddy-config
      - ./install.sh:/app/install.sh:ro
      - ./:/platform-src:ro
      - /opt/smsly-cache:/opt/smsly-cache
      - backups_data:/app/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    networks:
      - smsly-net
      - socket-proxy

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80" # Security: Bind to localhost only
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smsly-net

  # Docker Socket Proxy - Restricted access to Docker daemon
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      # Only allow specific Docker API calls (least privilege)
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      BUILD: 1
      # Required for provisioning/deployments (create/start containers, create networks/volumes, etc.)
      POST: 1
      PUT: 1
      DELETE: 1
      EXEC: 1
      # Deny dangerous operations
      SERVICES: 0
      SWARM: 0
      NODES: 0
      CONFIGS: 0
      SECRETS: 0
      COMMIT: 1  # Required for backup service to snapshot container state
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:2375/version || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - smsly-net
      - socket-proxy

  # Traefik - Dynamic reverse proxy for deployed containers
  # Reads Docker labels from deployed containers and routes traffic to them.
  # Caddy handles SSL and proxies *.cloud.smsly.cloud → Traefik:8081
  route-fallback:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/route-fallback/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/route-fallback/index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.route-fallback.rule=PathPrefix(`/`)"
      - "traefik.http.routers.route-fallback.entrypoints=web"
      - "traefik.http.routers.route-fallback.priority=1"
      - "traefik.http.services.route-fallback.loadbalancer.server.port=80"
    networks:
      - smsly-net

  traefik:
    image: traefik:v3.6 # v3.6.1+ required for Docker 29 API compatibility
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=smsly-net"
      # Read Docker metadata via restricted socket-proxy
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--entrypoints.web.address=:80"
      # Trust X-Forwarded-* headers from Caddy (localhost).
      # Without this, Traefik overrides X-Forwarded-Proto to 'http'
      # causing redirect loops in apps that check the proto header.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8"
      - "--log.level=WARN"
    ports:
      - "127.0.0.1:8081:80" # Deployed apps (Caddy proxies *.cloud.smsly.cloud here)
      - "127.0.0.1:8082:8080" # Traefik dashboard (optional debug)
    depends_on:
      socket-proxy:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - smsly-net
      - socket-proxy

  # FRP Tunnel Relay — exposes local dev servers via *.tunnel.{domain}
  frps:
    image: snowdreamtech/frps:latest
    restart: unless-stopped
    env_file: .env
    environment:
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:?FRP_AUTH_TOKEN must be set in .env}
      TUNNEL_DOMAIN: ${TUNNEL_DOMAIN:-tunnel.localhost}
    volumes:
      - ./infrastructure/frps/frps.toml:/etc/frp/frps.toml:ro
    ports:
      - "7000:7000"   # Client control connections
      - "127.0.0.1:7080:7080"  # vhost HTTP (Caddy → here)
      - "127.0.0.1:7500:7500"  # Admin dashboard (internal)
    command: ["-c", "/etc/frp/frps.toml"]
    entrypoint: ["frps"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smsly-net

networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  registry_data:
  static_volume:
  media_volume:
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smsly-hosting/caddy-config
  backups_data:
