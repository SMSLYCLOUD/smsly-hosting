      - ALL
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: smsly-crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      ENROLL_KEY: "${CROWDSEC_ENROLL_KEY:-}"
      ENROLL_INSTANCE_NAME: "${DOMAIN:-smsly-hosting}"
      BOUNCER_KEY_traefik_bouncer: "${CROWDSEC_BOUNCER_KEY:-}"
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ./infrastructure/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro,z
      - ./infrastructure/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro,z
      - ./infrastructure/crowdsec/whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/01-whitelists-acme.yaml:ro,z
      - ./infrastructure/crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro,z
      - traefik_logs:/var/log/traefik:ro
      - caddy_logs:/var/log/caddy:ro
      - node_logs:/var/log/crowdsec/nodes:ro
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "cscli version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - managed_by=smsly-hosting
    deploy:
      resources:
        limits:
          cpus: '${CROWDSEC_CPU_LIMIT:-0.50}'
          memory: ${CROWDSEC_MEMORY_LIMIT:-512M}

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    - apparmor:docker-default
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.docker.endpoint=tcp://traefik-socket-proxy:2375
    - --providers.docker.httpClientTimeout=30s
    - --entrypoints.web.address=:80
    - --entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http.tls=true
    - --entrypoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
    - --entrypoints.metrics.address=:8082
    # SECURITY: removed --api.insecure=true; the dashboard now requires auth
    # via a Traefik middleware (configure traefik.http.routers.api.middlewares
    # with a basicauth/forwardauth handler on a websecure entrypoint). The
    # :8082 port mapping below remains for Prometheus metrics, not the API.
    - --metrics.prometheus=true
    - --metrics.prometheus.entrypoint=metrics
    - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@${DOMAIN:-localhost}}
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    - --log.level=WARN
    - --ping=true
    - --accesslog=true
    - --accesslog.filepath=/var/log/traefik/access.log
    - --accesslog.format=json
    - --accesslog.fields.defaultMode=keep
    - --accesslog.fields.names.client.address=keep
    - --accesslog.fields.names.client.port=drop
    - --accesslog.fields.names.client.user=drop
    - --accesslog.fields.names.request.host=keep
    - --accesslog.fields.names.request.method=keep
    - --accesslog.fields.names.request.uri=keep
    - --accesslog.fields.names.request.port=drop
    - --accesslog.fields.names.downstream.status=keep
    - --accesslog.fields.names.user-agent=drop
    - --experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
    - --experimental.plugins.crowdsec-bouncer.version=v1.6.0
    ports:
    - "${TRAEFIK_HTTP_BIND:-127.0.0.1:8081}:80"
    - "${TRAEFIK_HTTPS_BIND:-127.0.0.1:8443}:443"
    - 127.0.0.1:8082:8082
    volumes:
    - letsencrypt_data:/letsencrypt
    - traefik_logs:/var/log/traefik
    depends_on:
      traefik-socket-proxy:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.enabled=true"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecMode=live"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiScheme=http"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiHost=crowdsec:8080"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiKey=${CROWDSEC_BOUNCER_KEY:-}"
    networks:
    - smsly-net
    - traefik-proxy-net
    deploy:
      resources:
        limits:
          cpus: '${TRAEFIK_CPU_LIMIT:-0.50}'
          memory: ${TRAEFIK_MEMORY_LIMIT:-512M}
  frps:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: snowdreamtech/frps:0.61.0
    restart: unless-stopped
    env_file: .env
    environment:
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:?FRP_AUTH_TOKEN must be set in .env}
      TUNNEL_DOMAIN: ${TUNNEL_DOMAIN:-tunnel.localhost}
    volumes:
    - ./infrastructure/frps/frps.toml:/etc/frp/frps.toml:ro,z
    ports:
    # SECURITY: bind the frps control port to loopback. NOTE: real tunnels
    # need a public ingress — terminate them on the host firewall / reverse
    # proxy and forward to this loopback port, or rebind to the public IP
    # explicitly (do NOT use 0.0.0.0).
    - 127.0.0.1:7000:7000
    - 127.0.0.1:7080:7080
    - 127.0.0.1:7500:7500
    command:
    - -c
    - /etc/frp/frps.toml
    entrypoint:
    - frps
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 7000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${FRPS_MEMORY_LIMIT:-256M}
  rabbitmq:
    security_opt:
      - apparmor:docker-default
    image: rabbitmq:3-management-alpine
    ports:
      # SECURITY: AMQP broker on loopback; producers/consumers talk to it
      # through the smsly-net overlay only.
      - "127.0.0.1:5672:5672"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smsly_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      RABBITMQ_MEMORY_WATERMARK: ${RABBITMQ_MEMORY_WATERMARK:-0.6}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    command: sh -c 'echo "vm_memory_high_watermark.relative = $${RABBITMQ_MEMORY_WATERMARK:-0.6}" > /etc/rabbitmq/conf.d/10-smsly.conf && exec docker-entrypoint.sh rabbitmq-server'
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${RABBITMQ_MEMORY_RESERVATION:-256M}
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-1G}
  caddy:
    security_opt:
      - apparmor:docker-default
    build:
      context: .
      dockerfile: infrastructure/caddy/Dockerfile
    restart: unless-stopped
    command: sh -c "umask 0022 && caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CADDY_ASK_SECRET=${CADDY_ASK_SECRET:-}
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./caddy-config:/etc/caddy:z
      - caddy_config:/config
      - caddy_data:/data
      - caddy_logs:/var/log/caddy
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-512M}
          cpus: "1.0"

  # ── Observability Stack ─────────────────────────────────────────────
  # Loki + Promtail + Grafana + Prometheus + cAdvisor + Node Exporter
  # Previously in infrastructure/docker/docker-compose.observability.yml
  # Inlined here so a single `docker compose up -d` starts everything.

  loki:
    image: grafana/loki:2.9.3
    container_name: smsly-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
      - ./infrastructure/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${LOKI_CPU_LIMIT:-0.5}'
          memory: ${LOKI_MEMORY_LIMIT:-512M}
    labels:
      - managed_by=smsly-hosting

  promtail:
    image: grafana/promtail:2.9.3
    container_name: smsly-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/status > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${PROMTAIL_MEMORY_LIMIT:-512M}
    labels:
      - managed_by=smsly-hosting
    depends_on:
      - loki

  # Loki → file bridge for CrowdSec node log analysis
  # Queries Loki for node Caddy access logs and writes them to
  # /var/log/crowdsec/nodes/ for CrowdSec to watch.
  loki-log-bridge:
    build:
      context: ./infrastructure/monitoring
      dockerfile: Dockerfile.log-bridge
    container_name: smsly-loki-log-bridge
    restart: unless-stopped
    environment:
      LOKI_URL: http://smsly-loki:3100
      CROWDSEC_LOG_DIR: /var/log/crowdsec/nodes
      POLL_INTERVAL: "10"
      LOOKBACK: "5m"
    volumes:
      - node_logs:/var/log/crowdsec/nodes
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://smsly-loki:3100/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - managed_by=smsly-hosting
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: smsly-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/rules/:/etc/prometheus/rules/:ro
      - prometheus-data:/prometheus
      - /opt/smsly-hosting/prometheus-targets:/etc/prometheus/docker-labels-targets:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${PROMETHEUS_CPU_LIMIT:-0.5}'
          memory: ${PROMETHEUS_MEMORY_LIMIT:-512M}
    labels:
      - managed_by=smsly-hosting

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: smsly-alertmanager
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    command:
      - --storage.path=/alertmanager
    environment:
      - ALERT_SLACK_WEBHOOK_URL=${ALERT_SLACK_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-http://127.0.0.1:5001/alerts}
      - ALERT_SMTP_HOST=${ALERT_SMTP_HOST:-}
      - ALERT_SMTP_PORT=${ALERT_SMTP_PORT:-}
      - ALERT_SMTP_FROM=${ALERT_SMTP_FROM:-}
      - ALERT_SMTP_USER=${ALERT_SMTP_USER:-}
      - ALERT_SMTP_PASS=${ALERT_SMTP_PASS:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_ENV=${ALERT_ENV:-smsly}
    volumes:
      - ./scripts/alertmanager-entrypoint.sh:/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${ALERTMANAGER_MEMORY_LIMIT:-256M}
    labels:
      - managed_by=smsly-hosting

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: smsly-cadvisor
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true, apparmor:docker-default]
    command:
      - --containerd=unix:///var/run/containerd/containerd.sock
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/containerd/containerd.sock:/var/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${CADVISOR_MEMORY_LIMIT:-256M}
    labels:
      - managed_by=smsly-hosting

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: smsly-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${NODE_EXPORTER_MEMORY_LIMIT:-128M}
    labels:
      - managed_by=smsly-hosting

  docker-labels:
    image: python:3.12-alpine
    container_name: smsly-docker-labels
    restart: unless-stopped
    command: python3 -u /app/exporter.py
    environment:
      - NODE_NAME=local
      - REFRESH_INTERVAL=60
      - STATS_TIMEOUT=50
      - MAX_WORKERS=8
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - ./infrastructure/monitoring/docker-labels-exporter.py:/app/exporter.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9234/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: ${DOCKER_LABELS_MEMORY_LIMIT:-256M}
    labels:
      - managed_by=smsly-hosting

  grafana:
    image: grafana/grafana:11.0.0
    container_name: smsly-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_SERVER_ROOT_URL:-https://${DOMAIN:-localhost}/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANON_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_NAME=${GRAFANA_ANON_ORG:-Main Org.}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GRAFANA_ANON_ROLE:-Viewer}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - smsly-net
      - smsly-proxy
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=smsly-proxy"
      - "managed_by=smsly-hosting"
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-1G}

  # ── Falco Runtime Security ──────────────────────────────────────────
  falco:
    image: falcosecurity/falco:0.39.2
    container_name: smsly-falco
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro,z
      - /var/run/docker.sock:/host/var/run/docker.sock:ro,z
      - /proc:/host/proc:ro,z
      - /etc:/host/etc:ro,z
      - ./infrastructure/config/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro,z
    environment:
      - HOST_ROOT=/host
    command: ["/usr/bin/falco", "-o", "json_output=true", "-o", "engine.kind=modern_ebpf"]
    networks:
      - smsly-net
    pid: host
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - managed_by=smsly-hosting

  # ── SPIRE mTLS Infrastructure ───────────────────────────────────────
  # Platform trust domain: platform.local
  # Ecosystem trust domain: ecosystem.local
  # Agents are started by spire-init after servers generate join tokens.

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.9.6
    container_name: smsly-spire-server
    hostname: spire-server
    restart: unless-stopped
    volumes:
      - spire-server-data:/opt/spire/data
      - ./infrastructure/spire/server.conf:/etc/spire/server.conf:ro,z
      - ./infrastructure/spire/registration_entries.json:/etc/spire/entries.json:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${SPIFFE_TRUST_DOMAIN:-platform.local}
    command: ["-config", "/etc/spire/server.conf"]
    networks:
      - smsly-net
    ports:
      - "127.0.0.1:8083:8081"
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${SPIRE_SERVER_MEMORY_LIMIT:-256M}
    labels:
      - managed_by=smsly-hosting

  spire-server-ecosystem:
    image: ghcr.io/spiffe/spire-server:1.9.6
    container_name: smsly-spire-server-ecosystem
    hostname: spire-server-ecosystem
    restart: unless-stopped
    volumes:
      - spire-ecosystem-server-data:/opt/spire/data
      - ./infrastructure/spire/server-ecosystem.conf:/etc/spire/server.conf:ro,z
      - ./infrastructure/spire/registration_entries_ecosystem.json:/etc/spire/entries.json:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${ECOSYSTEM_TRUST_DOMAIN:-ecosystem.local}
    command: ["-config", "/etc/spire/server.conf"]
    networks:
      - smsly-net
    ports:
      - "127.0.0.1:8091:8081"
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${SPIRE_SERVER_MEMORY_LIMIT:-256M}
    labels:
      - managed_by=smsly-hosting

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.9.6
    container_name: smsly-spire-agent
    hostname: spire-agent
    restart: unless-stopped
    volumes:
      - spire-agent-data:/opt/spire/data
      - spire-agent-socket:/opt/spire/run
      - spire-agent-svids:/opt/spire/svids
      - ./infrastructure/spire/agent.conf:/etc/spire/agent.conf:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${SPIFFE_TRUST_DOMAIN:-platform.local}
      DOCKER_HOST: tcp://traefik-socket-proxy:2375
    command: ["-config", "/etc/spire/agent.conf"]
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/opt/spire/run/agent.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${SPIRE_AGENT_MEMORY_LIMIT:-128M}
    labels:
      - managed_by=smsly-hosting

  spire-agent-ecosystem:
    image: ghcr.io/spiffe/spire-agent:1.9.6
    container_name: smsly-spire-agent-ecosystem
    hostname: spire-agent-ecosystem
    restart: unless-stopped
    volumes:
      - spire-ecosystem-agent-data:/opt/spire/data
      - spire-ecosystem-agent-socket:/opt/spire/run
      - spire-ecosystem-agent-svids:/opt/spire/svids
      - ./infrastructure/spire/agent-ecosystem.conf:/etc/spire/agent.conf:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${ECOSYSTEM_TRUST_DOMAIN:-ecosystem.local}
      DOCKER_HOST: tcp://traefik-socket-proxy:2375
    command: ["-config", "/etc/spire/agent.conf"]
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/opt/spire/run/agent.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${SPIRE_AGENT_MEMORY_LIMIT:-128M}
    labels:
      - managed_by=smsly-hosting

networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true
  traefik-proxy-net:
    driver: bridge
    internal: true
  smsly-proxy:
    external: true
volumes:
  postgres-primary-data:
  postgres-replica-data:
  postgres-archive:
  etcd-data:
  patroni1-data:
  patroni2-data:
  patroni3-data:
  patroni-wal:
  redis-primary-data:
  redis-replica-data:
  registry_data: null
  docker_mirror_data: null
  static_volume: null
  media_volume: null
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smsly-hosting/caddy-config
  caddy_data:
    driver: local
  backups_data: null
  rabbitmq_data: null
  letsencrypt_data: null
  apt_cache: null
  apt_log: null
  verdaccio_data: null

  traefik_logs: null
  caddy_logs: null
  node_logs: null
  crowdsec_data: null
  crowdsec_config: null
  
  # SPIRE mTLS volumes
  spire-server-data: null
  spire-agent-socket: null
  spire-agent-svids: null

  # Observability volumes
  loki-data: null
  prometheus-data: null
  grafana-data: null
  promtail-positions: null
  alertmanager-data: null

  # SPIRE mTLS volumes
  spire-ecosystem-server-data: null
  spire-agent-data: null
  spire-ecosystem-agent-data: null
  spire-ecosystem-agent-socket: null
  spire-ecosystem-agent-svids: null
