services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" pg_isready -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: -c max_connections=200
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${DB_MEMORY_RESERVATION:-1G}
        limits:
          memory: ${DB_MEMORY_LIMIT:-4G}
  pgcat:
    build:
      context: ./infrastructure/pgcat
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      PGCAT_ADMIN_PASSWORD: ${PGCAT_ADMIN_PASSWORD:?PGCAT_ADMIN_PASSWORD must be set in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}" -c "SELECT 1;" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    ports:
      - "10.100.0.1:5432:5432"
    networks:
    - smsly-net
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 400mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-256M}
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512M}
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
    - 5000:5000
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test:
      - CMD-SHELL
      - timeout 5 nc -z 127.0.0.1 5000 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
  docker-mirror:
    image: registry:2
    restart: unless-stopped
    ports:
      - 5001:5000
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - docker_mirror_data:/var/lib/registry
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:5000/v2/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --worker-class
      uvicorn.workers.UvicornWorker --timeout 600
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    env_file: .env
    environment:
      UVICORN_WS_PING_INTERVAL: 20
      UVICORN_WS_PING_TIMEOUT: 20
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-127.0.0.1:5000}
      DOCKER_HOST: tcp://socket-proxy:2375
      SMSLY_ENABLE_STARTUP_CADDY_SYNC: ${SMSLY_ENABLE_STARTUP_CADDY_SYNC:-true}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
    depends_on:
      pgcat:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - static_volume:/app/staticfiles
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - ./install.sh:/app/install.sh:ro
    - ./.env:/app/.env:rw
    - ./:/platform-src:ro
    - /opt/smsly-cache:/opt/smsly-cache
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets
    - backups_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
    - smsly-net
    deploy:
      update_config:
        order: start-first
      resources:
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-512M}
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
    labels:
    - traefik.enable=true
    - traefik.http.routers.backend.rule=PathPrefix(`/api/v1/`) || PathPrefix(`/admin/`) || PathPrefix(`/health/`) || PathPrefix(`/accounts/`) || PathPrefix(`/dj-rest-auth/`)
    - traefik.http.routers.backend.entrypoints=web
    - traefik.http.routers.backend.priority=10
    - traefik.http.services.backend.loadbalancer.server.port=8000
    - traefik.docker.network=smsly-net
    - managed_by=smsly-hosting
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=8 -Q celery
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-127.0.0.1:5000}
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - ./install.sh:/app/install.sh:ro
    - ./:/platform-src:ro
    - /opt/smsly-cache:/opt/smsly-cache
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets
    - backups_data:/app/backups
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    env_file: .env
    environment:
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 300s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NODE_BUILD_MEMORY_MB: ${FRONTEND_BUILD_MEMORY_MB:-2048}
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
    - smsly-net
    deploy:
      update_config:
        order: start-first
    labels:
    - traefik.enable=true
    - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) || Host(`${PUBLIC_IP}`) || Host(`localhost`) || Host(`127.0.0.1`)
    - traefik.http.routers.frontend.entrypoints=web
    - traefik.http.routers.frontend.priority=5
    - traefik.http.services.frontend.loadbalancer.server.port=3000
    - traefik.docker.network=smsly-net
    - managed_by=smsly-hosting
  celery-fast:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=8 -Q fast
    restart: always
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-127.0.0.1:5000}
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - ./install.sh:/app/install.sh:ro
    - ./:/platform-src:ro
    - /opt/smsly-cache:/opt/smsly-cache
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds
    - backups_data:/app/backups
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
  celery-deploy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=8 -Q deploy --hostname=deploy@%h
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-127.0.0.1:5000}
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - ./install.sh:/app/install.sh:ro
    - ./:/platform-src:ro
    - /opt/smsly-cache:/opt/smsly-cache
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds
    - backups_data:/app/backups
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A config inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      BUILD: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      COMMIT: 1
      EXEC: 1
      POST: 1
      DELETE: 0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2375/version || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
  route-fallback:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
    - ./infrastructure/route-fallback/Caddyfile:/etc/caddy/Caddyfile:ro
    - ./infrastructure/route-fallback/index.html:/srv/index.html:ro
    labels:
    - traefik.enable=true
    - traefik.http.routers.route-fallback.rule=PathPrefix(`/`)
    - traefik.http.routers.route-fallback.entrypoints=web
    - traefik.http.routers.route-fallback.priority=1
    - traefik.http.services.route-fallback.loadbalancer.server.port=80
    - managed_by=smsly-hosting
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:80/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - smsly-net
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.docker.network=smsly-net
    - --providers.docker.endpoint=tcp://socket-proxy:2375
    - --providers.docker.httpClientTimeout=300s
    - --entrypoints.web.address=:80
    - --entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http.tls=true
    - --entrypoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
    - --entrypoints.metrics.address=:8082
    - --api.insecure=true
    - --metrics.prometheus=true
    - --metrics.prometheus.entrypoint=metrics
    - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@${DOMAIN:-localhost}}
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    - --log.level=WARN
    - --ping=true
    ports:
    - "${TRAEFIK_HTTP_BIND:-127.0.0.1:8081}:80"
    - "${TRAEFIK_HTTPS_BIND:-127.0.0.1:8443}:443"
    - 127.0.0.1:8082:8082
    volumes:
    - letsencrypt_data:/letsencrypt
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
    - no-new-privileges:true
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  frps:
    image: snowdreamtech/frps:latest
    restart: unless-stopped
    env_file: .env
    environment:
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:?FRP_AUTH_TOKEN must be set in .env}
      TUNNEL_DOMAIN: ${TUNNEL_DOMAIN:-tunnel.localhost}
    volumes:
    - ./infrastructure/frps/frps.toml:/etc/frp/frps.toml:ro
    ports:
    - 7000:7000
    - 127.0.0.1:7080:7080
    - 127.0.0.1:7500:7500
    command:
    - -c
    - /etc/frp/frps.toml
    entrypoint:
    - frps
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 7000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: smsly_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: ${RABBITMQ_MEMORY_WATERMARK:-0.6}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${RABBITMQ_MEMORY_RESERVATION:-256M}
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-1G}
  caddy:
    build:
      context: .
      dockerfile: infrastructure/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./caddy-config:/etc/caddy
      - caddy_config:/config
      - caddy_data:/data
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true
  smsly-proxy:
    external: true
volumes:
  postgres_data: null
  redis_data: null
  registry_data: null
  docker_mirror_data: null
  static_volume: null
  media_volume: null
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smsly-hosting/caddy-config
  caddy_data:
    driver: local
  backups_data: null
  rabbitmq_data: null
  letsencrypt_data: null
