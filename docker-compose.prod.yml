# SMSLY Hosting Production Stack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      # SECURITY: No default password - must be set in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsly_admin -d smsly_hosting"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smsly-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smsly-net

  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - smsly-net

  # NOTE: backend-init removed - migrations run by install script
  # This avoids blocking issues with containers that don't exit properly

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: registry:5000
      DOCKER_HOST: tcp://socket-proxy:2375  # Connect via restricted proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # SECURITY: Use socket-proxy instead of direct socket mount
      # - /var/run/docker.sock:/var/run/docker.sock  # REMOVED - security risk
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=4
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_REGISTRY_URL: registry:5000
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      - db
      - redis
      - socket-proxy
    networks:
      - smsly-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - smsly-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    env_file: .env
    # Force Next.js to listen on all interfaces so nginx can connect
    command: ["sh", "-lc", "npm run start -- -H 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://0.0.0.0:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"  # Security: Bind to localhost only
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - smsly-net

  # Docker Socket Proxy - Restricted access to Docker daemon
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      # Only allow specific Docker API calls (least privilege)
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      BUILD: 1
      # Deny dangerous operations
      SERVICES: 0
      SWARM: 0
      NODES: 0
      CONFIGS: 0
      SECRETS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only mount
    networks:
      - smsly-net

networks:
  smsly-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  registry_data:
  static_volume:
  media_volume:
