  route-fallback:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
    - ./infrastructure/route-fallback/Caddyfile:/etc/caddy/Caddyfile:ro,z
    - ./infrastructure/route-fallback/index.html:/srv/index.html:ro,z
    labels:
    - traefik.enable=true
    - traefik.http.routers.route-fallback.rule=PathPrefix(`/`)
    - traefik.http.routers.route-fallback.entrypoints=web
    - traefik.http.routers.route-fallback.priority=1
    - traefik.http.services.route-fallback.loadbalancer.server.port=80
    - managed_by=smsly-hosting
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:80/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${ROUTE_FALLBACK_MEMORY_LIMIT:-128M}
  crowdsec:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: smsly-crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/prometheus"
      ENROLL_KEY: "${CROWDSEC_ENROLL_KEY:-}"
      ENROLL_INSTANCE_NAME: "${DOMAIN:-smsly-hosting}"
      BOUNCER_KEY_traefik_bouncer: "${CROWDSEC_BOUNCER_KEY:-}"
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ./infrastructure/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro,z
      - ./infrastructure/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro,z
      - ./infrastructure/crowdsec/whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/01-whitelists-acme.yaml:ro,z
      - ./infrastructure/crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro,z
      - traefik_logs:/var/log/traefik:ro
      - caddy_logs:/var/log/caddy:ro
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "cscli version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - managed_by=smsly-hosting
    deploy:
      resources:
        limits:
          cpus: '${CROWDSEC_CPU_LIMIT:-0.50}'
          memory: ${CROWDSEC_MEMORY_LIMIT:-512M}

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.docker.endpoint=tcp://traefik-socket-proxy:2375
    - --providers.docker.httpClientTimeout=30s
    - --entrypoints.web.address=:80
    - --entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http.tls=true
    - --entrypoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
    - --entrypoints.metrics.address=:8082
    # SECURITY: removed --api.insecure=true; the dashboard now requires auth
    # via a Traefik middleware (configure traefik.http.routers.api.middlewares
    # with a basicauth/forwardauth handler on a websecure entrypoint). The
    # :8082 port mapping below remains for Prometheus metrics, not the API.
    - --metrics.prometheus=true
    - --metrics.prometheus.entrypoint=metrics
    - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@${DOMAIN:-localhost}}
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    - --log.level=WARN
    - --ping=true
    - --accesslog=true
    - --accesslog.filepath=/var/log/traefik/access.log
    - --accesslog.format=json
    - --accesslog.fields.defaultMode=keep
    - --accesslog.fields.names.client.address=keep
    - --accesslog.fields.names.client.port=drop
    - --accesslog.fields.names.client.user=drop
    - --accesslog.fields.names.request.host=keep
    - --accesslog.fields.names.request.method=keep
    - --accesslog.fields.names.request.uri=keep
    - --accesslog.fields.names.request.port=drop
    - --accesslog.fields.names.downstream.status=keep
    - --accesslog.fields.names.user-agent=drop
    - --experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
    - --experimental.plugins.crowdsec-bouncer.version=v1.6.0
    ports:
    - "${TRAEFIK_HTTP_BIND:-127.0.0.1:8081}:80"
    - "${TRAEFIK_HTTPS_BIND:-127.0.0.1:8443}:443"
    - 127.0.0.1:8082:8082
    volumes:
    - letsencrypt_data:/letsencrypt
    - traefik_logs:/var/log/traefik
    depends_on:
      traefik-socket-proxy:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
    - no-new-privileges:true
    labels:
    - managed_by=smsly-hosting
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.enabled=true"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecMode=live"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiScheme=http"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiHost=crowdsec:8080"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiKey=${CROWDSEC_BOUNCER_KEY:-}"
    networks:
    - smsly-net
    - traefik-proxy-net
    deploy:
      resources:
        limits:
          cpus: '${TRAEFIK_CPU_LIMIT:-0.50}'
          memory: ${TRAEFIK_MEMORY_LIMIT:-512M}
  frps:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: snowdreamtech/frps:0.61.0
    restart: unless-stopped
    env_file: .env
    environment:
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:?FRP_AUTH_TOKEN must be set in .env}
      TUNNEL_DOMAIN: ${TUNNEL_DOMAIN:-tunnel.localhost}
    volumes:
    - ./infrastructure/frps/frps.toml:/etc/frp/frps.toml:ro,z
    ports:
    # SECURITY: bind the frps control port to loopback. NOTE: real tunnels
    # need a public ingress — terminate them on the host firewall / reverse
    # proxy and forward to this loopback port, or rebind to the public IP
    # explicitly (do NOT use 0.0.0.0).
    - 127.0.0.1:7000:7000
    - 127.0.0.1:7080:7080
    - 127.0.0.1:7500:7500
    command:
    - -c
    - /etc/frp/frps.toml
    entrypoint:
    - frps
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 7000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${FRPS_MEMORY_LIMIT:-256M}
  rabbitmq:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: rabbitmq:3-management-alpine
    ports:
      # SECURITY: AMQP broker on loopback; producers/consumers talk to it
      # through the smsly-net overlay only.
      - "127.0.0.1:5672:5672"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smsly_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      RABBITMQ_MEMORY_WATERMARK: ${RABBITMQ_MEMORY_WATERMARK:-0.6}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    command: sh -c 'echo "vm_memory_high_watermark.relative = $${RABBITMQ_MEMORY_WATERMARK:-0.6}" > /etc/rabbitmq/conf.d/10-smsly.conf && exec docker-entrypoint.sh rabbitmq-server'
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${RABBITMQ_MEMORY_RESERVATION:-256M}
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-1G}
  caddy:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: .
      dockerfile: infrastructure/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./caddy-config:/etc/caddy:z
      - caddy_config:/config
      - caddy_data:/data
      - caddy_logs:/var/log/caddy
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-512M}
networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
