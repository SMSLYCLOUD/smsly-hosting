          memory: ${CELERY_DEPLOY_MEMORY_LIMIT:-2G}
  socket-proxy:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: tecnativa/docker-socket-proxy:0.1.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      BUILD: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      COMMIT: 1
      EXEC: 1
      POST: 1
      AUTH: 1
      PUT: 1
      DELETE: 1
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro,z
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2375/version || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    - socket-proxy
    deploy:
      resources:
        limits:
          memory: ${SOCKET_PROXY_MEMORY_LIMIT:-256M}
  traefik-socket-proxy:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: tecnativa/docker-socket-proxy:0.1.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      AUTH: 1
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
    - traefik-proxy-net
    deploy:
      resources:
        limits:
