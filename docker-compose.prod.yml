services:
  # ── PostgreSQL HA (primary + replica) ──────────────────────────────────
  postgres-primary:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: postgres:16-alpine
    container_name: smsly-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD must be set in .env}
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - postgres-archive:/var/lib/postgresql/archive
      - ./infrastructure/docker/postgres/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_log_hints=on
      -c hot_standby=on
      -c wal_keep_size=1GB
      -c max_slot_wal_keep_size=${PG_MAX_SLOT_WAL_KEEP_SIZE:-5GB}
      -c wal_sender_timeout=60s
      -c synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}
      -c synchronous_standby_names=${PG_SYNCHRONOUS_STANDBY_NAMES:-'*'}
      -c archive_mode=on
      -c archive_command='mkdir -p /var/lib/postgresql/archive && cp %p /var/lib/postgresql/archive/%f'
      -c max_connections=${DB_MAX_CONNECTIONS:-200}
      -c shared_buffers=${DB_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" pg_isready -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${DB_PRIMARY_RESERVATION:-2G}
        limits:
          memory: ${DB_PRIMARY_LIMIT:-8G}

  postgres-replica:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: postgres:16-alpine
    container_name: smsly-postgres-replica
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      PGUSER: replicator
      PGPASSWORD: ${REPLICATION_PASSWORD:-}
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - postgres-archive:/var/lib/postgresql/archive
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Initializing replica from primary..."
          pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -Fp -Xs -P -R
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on -c max_connections=300
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" pg_isready -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${DB_REPLICA_RESERVATION:-1G}
        limits:
          memory: ${DB_REPLICA_LIMIT:-4G}
  pgcat:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: ./infrastructure/pgcat
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres-primary
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      PGCAT_ADMIN_PASSWORD: ${PGCAT_ADMIN_PASSWORD:?PGCAT_ADMIN_PASSWORD must be set in .env}
      DB_REPLICA_HOSTS: ${DB_REPLICA_HOSTS:-postgres-replica:5432}
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER:-smsly_admin}" -d "$${POSTGRES_DB:-smsly_hosting}" -c "SELECT 1;" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
    - managed_by=smsly-hosting
    ports:
      - "10.100.0.1:5432:5432"
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${PGCAT_MEMORY_LIMIT:-256M}
  # ── Redis HA (primary + replica + 3 sentinels) ─────────────────────────
  redis-primary:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: redis:7-alpine
    container_name: smsly-redis-primary
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --maxmemory ${REDIS_MAXMEMORY:-400mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --repl-backlog-size 64mb
      --repl-backlog-ttl 3600
      --min-replicas-to-write ${REDIS_MIN_REPLICAS_TO_WRITE:-0}
      --min-replicas-max-lag ${REDIS_MIN_REPLICAS_MAX_LAG:-10}
    volumes:
      - redis-primary-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${REDIS_PRIMARY_RESERVATION:-256M}
        limits:
          memory: ${REDIS_PRIMARY_LIMIT:-1G}

  redis-replica:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: redis:7-alpine
    container_name: smsly-redis-replica
    restart: unless-stopped
    command: >
      redis-server
      --replicaof redis-primary 6379
      --masterauth ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-400mb}
      --maxmemory-policy allkeys-lru
      --replica-read-only yes
      --repl-diskless-sync yes
      --repl-diskless-sync-delay 5
      --repl-ping-replica-period 5
    volumes:
      - redis-replica-data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        reservations:
          memory: ${REDIS_REPLICA_RESERVATION:-128M}
        limits:
          memory: ${REDIS_REPLICA_LIMIT:-512M}

  redis-sentinel-1:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-1
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD}
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          "sentinel monitor mymaster redis-primary 6379 2" \
          "sentinel auth-pass mymaster $${REDIS_PASSWORD}" \
          "sentinel down-after-milliseconds mymaster 5000" \
          "sentinel failover-timeout mymaster 15000" \
          "sentinel parallel-syncs mymaster 1" \
          "sentinel resolve-hostnames yes" \
          "sentinel announce-hostnames yes" \
          > /tmp/sentinel.conf
        if [ -n "$$SENTINEL_PASSWORD" ]; then
          echo "sentinel sentinel-user default" >> /tmp/sentinel.conf
          echo "sentinel sentinel-password $$SENTINEL_PASSWORD" >> /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-primary:
        condition: service_started
      redis-replica:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${SENTINEL_MEMORY_LIMIT:-32M}

  redis-sentinel-2:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-2
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD}
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          "sentinel monitor mymaster redis-primary 6379 2" \
          "sentinel auth-pass mymaster $${REDIS_PASSWORD}" \
          "sentinel down-after-milliseconds mymaster 5000" \
          "sentinel failover-timeout mymaster 15000" \
          "sentinel parallel-syncs mymaster 1" \
          "sentinel resolve-hostnames yes" \
          "sentinel announce-hostnames yes" \
          > /tmp/sentinel.conf
        if [ -n "$$SENTINEL_PASSWORD" ]; then
          echo "sentinel sentinel-user default" >> /tmp/sentinel.conf
          echo "sentinel sentinel-password $$SENTINEL_PASSWORD" >> /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-primary:
        condition: service_started
      redis-replica:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${SENTINEL_MEMORY_LIMIT:-32M}

  redis-sentinel-3:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-3
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD}
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          "sentinel monitor mymaster redis-primary 6379 2" \
          "sentinel auth-pass mymaster $${REDIS_PASSWORD}" \
          "sentinel down-after-milliseconds mymaster 5000" \
          "sentinel failover-timeout mymaster 15000" \
          "sentinel parallel-syncs mymaster 1" \
          "sentinel resolve-hostnames yes" \
          "sentinel announce-hostnames yes" \
          > /tmp/sentinel.conf
        if [ -n "$$SENTINEL_PASSWORD" ]; then
          echo "sentinel sentinel-user default" >> /tmp/sentinel.conf
          echo "sentinel sentinel-password $$SENTINEL_PASSWORD" >> /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-primary:
        condition: service_started
      redis-replica:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
    - managed_by=smsly-hosting
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${SENTINEL_MEMORY_LIMIT:-32M}
  registry:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: registry:2.8.3
    restart: unless-stopped
    ports:
    # Localhost by default; set REGISTRY_BIND_IP=0.0.0.0 or 10.100.0.1 in .env for multi-node mesh
    - "${REGISTRY_BIND_IP:-127.0.0.1}:5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: ":5000"
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-}
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
      REGISTRY_AUTH_HTPASSWD_REALM: registry-realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry_data:/var/lib/registry
      - ./certs:/certs:ro,z
      - ./auth:/auth:ro,z
    healthcheck:
      # registry:2.8.3 is scratch-based (no shell, no curl/wget).
      # The Docker restart policy handles crash recovery.
      # For active health monitoring, run the registry-health.sh script
      # from the host or use an external monitoring container.
      test: ["NONE"]
      disable: true
    labels:
    - managed_by=smsly-hosting
    # SECURITY: No public Traefik route — registry is accessed via
    # Docker DNS (registry:5000) for inter-container communication
    # inside smsly-net, or via WireGuard mesh IP (10.100.0.1:5000)
    # for remote nodes. The public domain (registry.smsly.cloud)
    # should be routed through Caddy's reverse proxy with TLS
    # termination, not Traefik, to avoid leaking the registry port.
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${REGISTRY_MEMORY_LIMIT:-1G}
  docker-mirror:
    profiles:
      - build-cache
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - docker_mirror_data:/var/lib/registry
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:5000/v2/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
    - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${DOCKER_MIRROR_MEMORY_LIMIT:-512M}
  apt-cacher:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: sameersbn/apt-cacher-ng:latest
    container_name: smsly-apt-cacher
    restart: unless-stopped
    volumes:
      - apt_cache:/var/cache/apt-cacher-ng
      - apt_log:/var/log/apt-cacher-ng
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3142/acng-report.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${APT_CACHE_MEMORY_LIMIT:-256M}

  verdaccio:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: verdaccio/verdaccio:5.31 # TODO: pin to digest via dependabot/renovate
    container_name: smsly-verdaccio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - verdaccio_data:/verdaccio
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4873/-/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    deploy:
      resources:
        limits:
          memory: ${VERDACCIO_MEMORY_LIMIT:-256M}

  backend:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smsly-hosting-backend:latest
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --worker-class
      uvicorn.workers.UvicornWorker --timeout ${GUNICORN_TIMEOUT:-600}
    restart: unless-stopped
    # SECURITY: NET_ADMIN was used for iptables in dev; in prod the host should
    # manage firewall rules, not the app container. Re-enable only if a
    # specific feature requires it and document why.
    env_file: .env
    environment:
      REDIS_HOST: redis-primary
      UVICORN_WS_PING_INTERVAL: 20
      UVICORN_WS_PING_TIMEOUT: 20
      MASTER_MESH_IP: ${MASTER_MESH_IP:-}
      # SECURITY: Use Docker DNS (registry:5000) for inter-container
      # communication. 127.0.0.1:5000 resolves to the container's OWN
      # loopback, not the host's registry. The Docker daemon push goes
      # through socket-proxy which resolves registry:5000 on the smsly-net
      # overlay to the registry container.
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-registry:5000}
      DOCKER_HOST: tcp://socket-proxy:2375

      SMSLY_ENABLE_STARTUP_CADDY_SYNC: ${SMSLY_ENABLE_STARTUP_CADDY_SYNC:-true}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
      APT_CACHE_HOST: http://apt-cacher:3142
      NPM_REGISTRY_URL: http://verdaccio:4873
    depends_on:
      pgcat:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      registry:
        condition: service_started
    volumes:
    - static_volume:/app/staticfiles
    - media_volume:/app/media
    - caddy_config:/caddy-config
    # SECURITY: install.sh is baked into the Docker image. The host bind
    # mount was overriding it with a stale copy, causing provisioning
    # failures (acquire_install_lock not found) until the host pulled.
    # SECURITY: mount .env read-only. The backend's platform-config sync
    # (`apps.deployments.signals.sync_infrastructure_on_config_change`) writes
    # to /app/.env, but the existing PermissionError handler already logs a
    # warning and continues; the new value persists in DB and is re-applied
    # at process restart. For full read-write sync, switch to a writable
    # volume (e.g. `caddy_env:/app/.env`) instead of a host-file bind.
    - ./.env:/app/.env:ro,z
    # SECURITY: removed `./:/platform-src:ro` bind mount. Mounting the full
    # repo into the backend container leaks the entire host source tree to
    # every backend process and the deploy worker. The two files actually
    # used from that tree (install.sh, infrastructure/.../docker-labels-
    # exporter.py) are now accessed via the explicit single-file install.sh
    # mount above, and via /app/infrastructure/... when the backend image
    # bundles it (the prometheus_targets loader has a fallback chain).
    - /opt/smsly-cache:/opt/smsly-cache:z
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds:z
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets:z
    - /opt/smsly-hosting/cosign-keys:/opt/smsly-hosting/cosign-keys:z
    - backups_data:/app/backups
    # Mount auth directory so the signal can sync htpasswd when registry
    # credentials change via the Settings UI. The entrypoint chowns this
    # to UID 1000 (smsly) so the Django process can write htpasswd.
    - ./auth:/auth:rw,z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
    - smsly-net
    deploy:
      update_config:
        order: start-first
      resources:
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-512M}
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
    labels:
    - traefik.enable=true
    - traefik.http.routers.backend.rule=PathPrefix(`/api/v1/`) || PathPrefix(`/admin/`) || PathPrefix(`/health/`) || PathPrefix(`/accounts/`) || PathPrefix(`/dj-rest-auth/`)
    - traefik.http.routers.backend.entrypoints=web
    - traefik.http.routers.backend.priority=10
    - traefik.http.routers.backend.middlewares=api-ratelimit,backend-cb
    - traefik.http.middlewares.api-ratelimit.ratelimit.average=200
    - traefik.http.middlewares.api-ratelimit.ratelimit.period=1s
    - traefik.http.middlewares.api-ratelimit.ratelimit.burst=50
    - traefik.http.middlewares.backend-cb.circuitbreaker.expression=ResponseCodeRatio(500, 600, 0, 600) > 0.30
    - traefik.http.middlewares.backend-cb.circuitbreaker.checkperiod=10s
    - traefik.http.middlewares.backend-cb.circuitbreaker.fallbackduration=30s
    - traefik.http.services.backend.loadbalancer.server.port=8000
    - traefik.docker.network=smsly-net
    - managed_by=smsly-hosting
  celery:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smsly-hosting-backend:latest
    command: celery -A config worker -l info --autoscale=${CELERY_AUTOSCALE:-12,4} -Q ${CELERY_QUEUES:-celery}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis-primary
      MASTER_MESH_IP: ${MASTER_MESH_IP:-}
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL:-registry:5000}
      DOCKER_HOST: tcp://socket-proxy:2375

      DOCKER_NETWORK: smsly-net
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SMSLY_BUILDS_DIR: /opt/smsly-hosting/builds
      APT_CACHE_HOST: http://apt-cacher:3142
      NPM_REGISTRY_URL: http://verdaccio:4873
    depends_on:
      pgcat:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
      socket-proxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      registry:
        condition: service_started
    volumes:
    - media_volume:/app/media
    - caddy_config:/caddy-config
    - /opt/smsly-cache:/opt/smsly-cache:z
    - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds:z
    - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets:z
    - backups_data:/app/backups
