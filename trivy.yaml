# Trivy configuration for SMSLY Hosting
# Filters noise, sets reasonable defaults

scan:
  skip-dirs:
    - "**/.venv"
    - "**/node_modules"
    - "**/__pycache__"
    - "**/.git"
    - "**/archive"
    - "**/K8native"
    - "**/SMSLYCLOUD"
    - "**/backend/.venv"
    - "**/scratch"
    - "**/research"

severity:
  - CRITICAL
  - HIGH

pkg:
  types:
    - os
    - library

vulnerability:
  ignore-unfixed: false

misconfiguration:
  include-non-failures: false

secret:
  enable-rule:
    - "aws-access-key-id"
    - "aws-secret-access-key"
    - "private-key"
    - "jwt"
    - "generic-api-key"
    - "github-token"
