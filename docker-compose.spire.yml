# =============================================================================
# SPIRE mTLS Infrastructure for smsly-hosting PaaS
# =============================================================================
# Run: docker compose -f docker-compose.spire.yml up -d
# =============================================================================

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.9.6
    container_name: ${SPIRE_SERVER_CONTAINER:-smsly-spire-server}
    hostname: spire-server
    restart: unless-stopped
    volumes:
      - spire-server-data:/opt/spire/data
      - ./infrastructure/spire/server.conf:/etc/spire/server.conf:ro,z
      - ./infrastructure/spire/registration_entries.json:/etc/spire/entries.json:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${SPIFFE_TRUST_DOMAIN:-platform.local}
    command: ["-config", "/etc/spire/server.conf"]
    networks:
      - smsly-net
    ports:
      - "127.0.0.1:8083:8081"
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - managed_by=smsly-hosting
    deploy:
      resources:
        limits:
          memory: ${SPIRE_SERVER_MEMORY_LIMIT:-256M}

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.9.6
    container_name: ${SPIRE_AGENT_CONTAINER:-smsly-spire-agent}
    hostname: spire-agent
    restart: "no"
    profiles: ["manual"]
    volumes:
      - spire-agent-data:/opt/spire/data
      - spire-agent-socket:/opt/spire/run
      - spire-agent-svids:/opt/spire/svids
      - ./infrastructure/spire/agent.conf:/etc/spire/agent.conf:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${SPIFFE_TRUST_DOMAIN:-platform.local}
      DOCKER_HOST: tcp://traefik-socket-proxy:2375
    command: ["-config", "/etc/spire/agent.conf"]
    networks:
      - smsly-net
    depends_on:
      spire-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/opt/spire/run/agent.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - managed_by=smsly-hosting
    deploy:
      resources:
        limits:
          memory: ${SPIRE_AGENT_MEMORY_LIMIT:-128M}

  spire-server-ecosystem:
    image: ghcr.io/spiffe/spire-server:1.9.6
    container_name: smsly-spire-server-ecosystem
    hostname: spire-server-ecosystem
    restart: unless-stopped
    volumes:
      - spire-ecosystem-server-data:/opt/spire/data
      - ./infrastructure/spire/server-ecosystem.conf:/etc/spire/server.conf:ro,z
      - ./infrastructure/spire/registration_entries_ecosystem.json:/etc/spire/entries.json:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${ECOSYSTEM_TRUST_DOMAIN:-ecosystem.local}
    command: ["-config", "/etc/spire/server.conf"]
    networks:
      - smsly-net
    ports:
      - "127.0.0.1:8091:8081"
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - managed_by=smsly-hosting
    deploy:
      resources:
        limits:
          memory: ${SPIRE_SERVER_MEMORY_LIMIT:-256M}

  spire-agent-ecosystem:
    image: ghcr.io/spiffe/spire-agent:1.9.6
    container_name: smsly-spire-agent-ecosystem
    hostname: spire-agent-ecosystem
    restart: "no"
    profiles: ["manual"]
    volumes:
      - spire-ecosystem-agent-data:/opt/spire/data
      - spire-ecosystem-agent-socket:/opt/spire/run
      - spire-ecosystem-agent-svids:/opt/spire/svids
      - ./infrastructure/spire/agent-ecosystem.conf:/etc/spire/agent.conf:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${ECOSYSTEM_TRUST_DOMAIN:-ecosystem.local}
      DOCKER_HOST: tcp://traefik-socket-proxy:2375
    command: ["-config", "/etc/spire/agent.conf"]
    networks:
      - smsly-net
    depends_on:
      spire-server-ecosystem:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/opt/spire/run/agent.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - managed_by=smsly-hosting
    deploy:
      resources:
        limits:
          memory: ${SPIRE_AGENT_MEMORY_LIMIT:-128M}

  spire-init:
    image: alpine:3.20
    container_name: ${SPIRE_INIT_CONTAINER:-smsly-spire-init}
    volumes:
      - spire-server-data:/opt/spire/data
      - spire-ecosystem-server-data:/opt/spire-ecosystem/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/spire/registration_entries.json:/etc/spire/entries.json:ro,z
      - ./infrastructure/spire/registration_entries_ecosystem.json:/etc/spire/entries-ecosystem.json:ro,z
    environment:
      SPIFFE_TRUST_DOMAIN: ${SPIFFE_TRUST_DOMAIN:-platform.local}
      ECOSYSTEM_TRUST_DOMAIN: ${ECOSYSTEM_TRUST_DOMAIN:-ecosystem.local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache docker-cli > /dev/null 2>&1 || true
        TD="$${SPIFFE_TRUST_DOMAIN}"
        ETD="$${ECOSYSTEM_TRUST_DOMAIN}"

        echo "=== Initializing Platform SPIRE Server ==="
        until docker exec smsly-spire-server /opt/spire/bin/spire-server healthcheck -socketPath /tmp/spire-server/private/api.sock 2>/dev/null; do
          sleep 2
        done
        echo "Platform server ready. Loading registration entries..."
        for SVC in gateway identity backend platform audit policy rate-limit chain email; do
          docker exec smsly-spire-server /opt/spire/bin/spire-server entry create \
            -socketPath /tmp/spire-server/private/api.sock \
            -spiffeID "spiffe://$${TD}/service/$${SVC}" \
            -parentID "spiffe://$${TD}/spire-server" \
            -selector "docker:label:com.paas.service:$${SVC}" \
            -ttl 3600 \
            -dns "$${SVC}" \
            -dns "$${SVC}.paas.svc" 2>&1 || true
        done
        echo "Platform registration entries loaded."

        echo "=== Initializing Ecosystem SPIRE Server ==="
        until docker exec smsly-spire-server-ecosystem /opt/spire/bin/spire-server healthcheck -socketPath /tmp/spire-server/private/api.sock 2>/dev/null; do
          sleep 2
        done
        echo "Ecosystem server ready. No static entries (populated by Celery sync task)."

        echo "=== Generating Join Tokens ==="
        PLATFORM_TOKEN=$$(docker exec smsly-spire-server /opt/spire/bin/spire-server token generate -socketPath /tmp/spire-server/private/api.sock 2>&1 | grep 'Token:' | awk '{print $$2}')
        ECOSYSTEM_TOKEN=$$(docker exec smsly-spire-server-ecosystem /opt/spire/bin/spire-server token generate -socketPath /tmp/spire-server/private/api.sock 2>&1 | grep 'Token:' | awk '{print $$2}')
        echo "Platform token: $${PLATFORM_TOKEN}"
        echo "Ecosystem token: $${ECOSYSTEM_TOKEN}"

        echo "=== Starting Platform Agent ==="
        docker rm -f smsly-spire-agent 2>/dev/null || true
        docker run -d \
          --name smsly-spire-agent \
          --hostname spire-agent \
          --restart unless-stopped \
          --network smsly-net \
          -e SPIFFE_TRUST_DOMAIN=$${SPIFFE_TRUST_DOMAIN} \
          -e DOCKER_HOST=tcp://traefik-socket-proxy:2375 \
          -v smsly-hosting_spire-agent-data:/opt/spire/data \
          -v smsly-hosting_spire-agent-socket:/opt/spire/run \
          -v smsly-hosting_spire-agent-svids:/opt/spire/svids \
          -v /opt/smsly-hosting/infrastructure/spire/agent.conf:/etc/spire/agent.conf:ro \
          --security-opt no-new-privileges:true \
          --cap-drop ALL \
          --memory 128m \
          ghcr.io/spiffe/spire-agent:1.9.6 \
          -config /etc/spire/agent.conf \
          -joinToken "$${PLATFORM_TOKEN}"

        echo "=== Starting Ecosystem Agent ==="
        docker rm -f smsly-spire-agent-ecosystem 2>/dev/null || true
        docker run -d \
          --name smsly-spire-agent-ecosystem \
          --hostname spire-agent-ecosystem \
          --restart unless-stopped \
          --network smsly-net \
          -e SPIFFE_TRUST_DOMAIN=$${ECOSYSTEM_TRUST_DOMAIN} \
          -e DOCKER_HOST=tcp://traefik-socket-proxy:2375 \
          -v smsly-hosting_spire-ecosystem-agent-data:/opt/spire/data \
          -v smsly-hosting_spire-ecosystem-agent-socket:/opt/spire/run \
          -v smsly-hosting_spire-ecosystem-agent-svids:/opt/spire/svids \
          -v /opt/smsly-hosting/infrastructure/spire/agent-ecosystem.conf:/etc/spire/agent.conf:ro \
          --security-opt no-new-privileges:true \
          --cap-drop ALL \
          --memory 128m \
          ghcr.io/spiffe/spire-agent:1.9.6 \
          -config /etc/spire/agent.conf \
          -joinToken "$${ECOSYSTEM_TOKEN}"

        echo "=== SPIRE Initialization Complete ==="
    networks:
      - smsly-net
    depends_on:
      spire-server:
        condition: service_healthy
      spire-server-ecosystem:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      - managed_by=smsly-hosting

volumes:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  spire-agent-svids:
  spire-ecosystem-server-data:
  spire-ecosystem-agent-data:
  spire-ecosystem-agent-socket:
  spire-ecosystem-agent-svids:

networks:
  smsly-net:
    external: true
    name: smsly-net
