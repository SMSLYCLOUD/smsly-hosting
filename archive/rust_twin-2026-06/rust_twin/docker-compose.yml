# docker-compose.yml for the rust_twin.
# This is for local development only; production uses the parent project's
# docker-compose.prod.yml (which doesn't include the rust_twin).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: rust_twin-api:dev
    container_name: rust_twin-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://smsly_admin:smsly_password@db:5432/rust_twin
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rust_twin-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: rust_twin-worker:dev
    container_name: rust_twin-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://smsly_admin:smsly_password@db:5432/rust_twin
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rust_twin-net

  db:
    image: postgres:16-alpine
    container_name: rust_twin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smsly_admin
      POSTGRES_PASSWORD: smsly_password
      POSTGRES_DB: rust_twin
    volumes:
      - rust_twin-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsly_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rust_twin-net

  redis:
    image: redis:7-alpine
    container_name: rust_twin-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - rust_twin-redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rust_twin-net

volumes:
  rust_twin-db:
  rust_twin-redis:

networks:
  rust_twin-net:
    driver: bridge
