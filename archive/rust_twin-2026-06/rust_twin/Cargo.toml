[workspace]
members = [
    "crates/core",
    "crates/api",
    "crates/worker",
    "crates/cli",
    "crates/infrastructure",
    "crates/frontend",
    "crates/intelligence",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json"] }
sea-orm = { version = "1.0", features = [ "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono" ] }
sea-orm-migration = "1.1.19"
dotenvy = "0.15"
uuid = { version = "1.0", features = ["v4", "serde"] }
pbkdf2 = { version = "0.12", features = ["simple"] }
password-hash = { version = "0.5", features = ["std", "rand_core"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
bcrypt = "0.15"
thiserror = "1.0"
# P-batch additions
hmac = "0.12"
subtle = "2.6"
url = "2.5"
urlencoding = "2.1"
async-trait = "0.1.80"