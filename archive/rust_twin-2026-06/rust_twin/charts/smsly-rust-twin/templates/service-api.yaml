apiVersion: v1
kind: Service
metadata:
  name: {{ include "smsly-rust-twin.fullname" . }}-api
  labels:
    {{- include "smsly-rust-twin.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "smsly-rust-twin.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
