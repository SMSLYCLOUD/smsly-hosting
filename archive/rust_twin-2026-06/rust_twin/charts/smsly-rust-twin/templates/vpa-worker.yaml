{{- if .Values.autoscaling.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "smsly-rust-twin.fullname" . }}-worker
  labels:
    {{- include "smsly-rust-twin.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "smsly-rust-twin.fullname" . }}-worker
  updatePolicy:
    updateMode: {{ .Values.autoscaling.vpa.updateMode | default "Auto" }}
  resourcePolicy:
    containerPolicies:
      - containerName: worker
        minAllowed:
          cpu: 100m
          memory: 128Mi
        maxAllowed:
          cpu: 2
          memory: 2Gi
{{- end }}
