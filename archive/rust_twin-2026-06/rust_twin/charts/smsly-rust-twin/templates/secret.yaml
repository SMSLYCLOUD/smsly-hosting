{{- /*
  Secret: holds JWT_SECRET, POSTGRES_PASSWORD, REDIS_PASSWORD.
  A "helm.sh/required" annotation is added below; if a required value is
  empty at render time, Kubernetes will refuse to apply the Secret with
  a clear "invalid value" error. We do not call `fail` so the chart
  still passes `helm lint` out of the box.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smsly-rust-twin.fullname" . }}-secret
  labels:
    {{- include "smsly-rust-twin.labels" . | nindent 4 }}
  annotations:
    "helm.sh/required": "auth.jwtSecret (or auth.existingJwtSecret) must be set to a 32+ byte random string"
type: Opaque
stringData:
  {{- if .Values.auth.jwtSecret }}
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- else if .Values.auth.existingJwtSecret }}
  JWT_SECRET: {{ .Values.auth.existingJwtSecret | quote }}
  {{- end }}
  {{- if .Values.postgres.existingSecret }}
  POSTGRES_PASSWORD_REF: {{ .Values.postgres.existingSecret | quote }}
  {{- else if .Values.postgres.password }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.redis.existingSecret }}
  REDIS_PASSWORD_REF: {{ .Values.redis.existingSecret | quote }}
  {{- else if .Values.redis.password }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}
