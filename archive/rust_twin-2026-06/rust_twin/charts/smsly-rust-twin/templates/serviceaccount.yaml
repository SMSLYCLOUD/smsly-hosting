apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smsly-rust-twin.serviceAccountName" . }}
  labels:
    {{- include "smsly-rust-twin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
