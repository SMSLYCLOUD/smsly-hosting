apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smsly-rust-twin.fullname" . }}-worker
  labels:
    {{- include "smsly-rust-twin.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "smsly-rust-twin.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smsly-rust-twin.componentLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smsly-rust-twin.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "smsly-rust-twin.securityContext" . | nindent 8 }}
      # The worker writes build artifacts to /tmp during container image
      # builds. With readOnlyRootFilesystem: true on the container, the
      # rootfs is immutable, so we mount a tmpfs-backed emptyDir at /tmp.
      # This is the only writable path inside the worker container.
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      containers:
        - name: worker
          image: {{ include "smsly-rust-twin.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "smsly-rust-twin.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - /usr/local/bin/worker
          envFrom:
            - configMapRef:
                name: {{ include "smsly-rust-twin.fullname" . }}-config
            - secretRef:
                name: {{ include "smsly-rust-twin.fullname" . }}-secret
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
