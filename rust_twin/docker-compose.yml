version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
    volumes:
      - rust_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smsly_admin} -d ${POSTGRES_DB:-smsly_hosting}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-admin123}
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        BIN: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smsly_admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-smsly_hosting}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-admin123}
      RUST_LOG: info,api=debug,core=debug

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        BIN: worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Mount Docker socket so the worker infrastructure can orchestrate containers/builds
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smsly_admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-smsly_hosting}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-admin123}
      RUST_LOG: info,worker=debug,core=debug,infrastructure=debug

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  rust_db_data: