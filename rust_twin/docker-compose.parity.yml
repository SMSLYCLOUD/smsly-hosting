version: '3.8'

# This compose file spins up BOTH the legacy Python backend and the new Rust twin
# simultaneously against the same database for strict parity testing.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smsly_admin
      POSTGRES_PASSWORD: admin123_parity_test
      POSTGRES_DB: smsly_hosting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsly_admin -d smsly_hosting"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass admin123_parity_test

  # The Legacy Python Backend (Listening on 8001)
  python_legacy:
    build:
      context: ../
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DEBUG=True
      - SECRET_KEY=parity_test_secret_legacy_system_12345
      - FIELD_ENCRYPTION_KEY=N0JMTkZLV2FwZVVVdkR3aWd6VnJNSGxSbnB3bEtXMEE=
      - DATABASE_URL=postgres://smsly_admin:admin123_parity_test@db:5432/smsly_hosting
      - REDIS_HOST=redis
      - REDIS_PASSWORD=admin123_parity_test

  # The New Rust Twin Backend (Listening on 8002)
  rust_twin:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        BIN: api
    restart: unless-stopped
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DEBUG=true
      - SECRET_KEY=parity_test_secret_legacy_system_12345
      - FIELD_ENCRYPTION_KEY=N0JMTkZLV2FwZVVVdkR3aWd6VnJNSGxSbnB3bEtXMEE=
      - DATABASE_URL=postgres://smsly_admin:admin123_parity_test@db:5432/smsly_hosting
      - REDIS_HOST=redis
      - REDIS_PASSWORD=admin123_parity_test
      - RUST_LOG=info,api=debug,core=debug