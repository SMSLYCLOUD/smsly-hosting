[workspace]
members = [
    "crates/core",
    "crates/api",
    "crates/worker",
    "crates/cli",
    "crates/infrastructure",
    "crates/frontend",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json"] }
sea-orm = { version = "1.0", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono" ] }
dotenvy = "0.15"