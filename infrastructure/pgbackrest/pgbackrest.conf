[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
process-max=2
log-level-console=info
log-level-file=detail
start-fast=y
delta=y

# Tenant shared instance (logical tenant DBs live here).
# Files read from the read-only data mount; control connection over
# TCP with the pgbackrest role (PGPASSWORD env). No PITR until
# archive_command ships WAL — scheduled full/diff sets the RPO.
[shared]
pg1-path=/mnt/pgdata-shared
pg1-host=smsly-shared-postgres
pg1-port=5432
pg1-user=pgbackrest
pg1-database=postgres

# Platform control-plane instance.
[platform]
pg1-path=/mnt/pgdata-platform
pg1-host=smsly-postgres-primary
pg1-port=5432
pg1-user=pgbackrest
pg1-database=postgres
