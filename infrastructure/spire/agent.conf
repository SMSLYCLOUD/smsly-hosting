agent {
  trust_domain = "TRUST_DOMAIN_PLACEHOLDER"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/opt/spire/run/agent.sock"
  log_level = "INFO"
  # WARNING: Set to false in production after distributing the trust bundle
  insecure_bootstrap = true
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "disk" {
    plugin_data {
      directory = "/opt/spire/data"
    }
  }

  WorkloadAttestor "unix" {
    plugin_data {
      discover_workload_path = true
    }
  }

  WorkloadAttestor "docker" {
    plugin_data {
      docker_host = "tcp://traefik-socket-proxy:2375"
    }
  }
}

health_checks {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8082"
  live_path = "/live"
  ready_path = "/ready"
}
