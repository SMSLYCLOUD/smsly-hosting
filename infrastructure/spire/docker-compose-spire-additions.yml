#     interval: 30s
#     timeout: 5s
#     retries: 3
#     start_period: 10s
#   deploy:
#     restart_policy:
#       condition: on-failure
#       delay: 5s
#       max_attempts: 5
#   security_opt:
#     - no-new-privileges:true

