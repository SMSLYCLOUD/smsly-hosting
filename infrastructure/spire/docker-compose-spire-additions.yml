# =============================================================================
# SPIRE mTLS Infrastructure — Add to docker-compose.prod.yml
# =============================================================================
# This file defines SPIRE server and agent services for the PaaS platform.
# Copy these service definitions into your docker-compose.prod.yml.
#
# SPIRE provides automatic mTLS for all tenant services deployed on the platform.
# Each service gets a SPIFFE identity (X.509 certificate) via Docker label attestation.
#
# Configuration:
#   - SPIFFE_TRUST_DOMAIN: Trust domain for SPIFFE IDs (default: platform.local)
#   - SPIFFE_SVID_TTL: Certificate lifetime (default: 1h)
#
# Usage:
#   1. Add these services to docker-compose.prod.yml
#   2. Run: docker compose up -d spire-server spire-agent spire-init
#   3. Deploy tenant services with com.paas.service=<name> label
#   4. Services automatically get mTLS certificates via SPIRE agent
# =============================================================================

# Volumes (add to top-level volumes: section)
# spire-server-data:
# spire-agent-socket:
# spire-agent-svids:

# Networks (add to top-level networks: section)
# Ensure spire services join the same network as tenant containers

# =============================================================================
# SPIRE Server — Central trust authority
# =============================================================================
# Issues SVIDs (SPIFFE Verifiable Identity Documents) to workloads.
# Runs as a stateful service with persistent CA key storage.

# Add to services: section in docker-compose.prod.yml
#
# spire-server:
#   image: ghcr.io/spiffe/spire-server:1.9.6
#   container_name: ${SPIRE_SERVER_CONTAINER:-smsly-spire-server}
#   hostname: spire-server
#   volumes:
#     - spire-server-data:/opt/spire/data
#     - ./infrastructure/spire/server.conf:/etc/spire/server.conf:ro,z
#     - ./infrastructure/spire/registration_entries.json:/etc/spire/entries.json:ro,z
#   environment:
#     - SPIFFE_TRUST_DOMAIN=${SPIFFE_TRUST_DOMAIN:-platform.local}
#   command: ["-config", "/etc/spire/server.conf"]
#   networks:
#     - smsly-net
#   ports:
#     - "127.0.0.1:8081:8081"  # Registration API (localhost only)
#     - "127.0.0.1:8080:8080"  # Health check
#   healthcheck:
#     test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/opt/spire/data/server.sock"]
#     interval: 30s
#     timeout: 5s
#     retries: 3
#     start_period: 10s
#   deploy:
#     restart_policy:
#       condition: on-failure
#       delay: 5s
#       max_attempts: 5
#   security_opt:
#     - no-new-privileges:true

