server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://${MASTER_MESH_IP:-10.100.0.1}:3100/loki/api/v1/push

scrape_configs:
  # Caddy access logs (JSON format)
  - job_name: caddy-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy-access
          node_id: ${SMSLY_NODE_ID:-unknown}
          __path__: /var/log/caddy/access.log
    pipeline_stages:
      - json:
          expressions:
            request_host: request.host
            request_method: request.method
            request_uri: request.uri
            request_remote_addr: request.remoteAddr
            status: status
            resp_status: resp.status
      - labels:
          method:
          status:
          host:
      - metrics:
          http_requests_total:
            type: Counter
            description: "Total HTTP requests from node Caddy access log"
            source: status
            config:
              action: inc
