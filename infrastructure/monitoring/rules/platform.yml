groups:
  - name: platform
    interval: 30s
    rules:
      - alert: BackendDown
        expr: probe_success{job="smsly-backend"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Backend API is unreachable"
          description: "Backend has not responded for 30s"

      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Disk usage > 80%"
          description: "Host disk is {{ $value | humanizePercentage }} full"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Memory usage > 90%"
          description: "Host memory is {{ $value | humanizePercentage }} used"

      - alert: CertExpiringSoon
        expr: (cert_expiry_days < 30)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "SSL certificate expiring in {{ $value }} days"

      - alert: ContainerRestartLoop
        expr: rate(container_last_seen{name=~".+"}[5m]) > 0.5
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"

      - alert: NodeOffline
        expr: node_health_status == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Managed node {{ $labels.node }} is offline"
          description: "Node has not reported health for 5 minutes"
