groups:
  - name: platform
    interval: 30s
    rules:
      - alert: BackendDown
        expr: probe_success{job="smsly-backend"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Backend API is unreachable"
          description: "Backend has not responded for 30s"

      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Disk usage > 80%"
          description: "Host disk is {{ $value | humanizePercentage }} full"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Memory usage > 90%"
          description: "Host memory is {{ $value | humanizePercentage }} used"

      - alert: CertExpiringSoon
        expr: (cert_expiry_days < 30)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "SSL certificate expiring in {{ $value }} days"

      - alert: ContainerRestartLoop
        expr: rate(container_last_seen{name=~".+"}[5m]) > 0.5
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"

      - alert: NodeOffline
        expr: smsly_node_health_status == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Managed node {{ $labels.node }} is offline"
          description: "Node has not reported health for 5 minutes"

      - alert: CrowdsecBanRateHigh
        expr: rate(crowdsec_active_decisions[15m]) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "CrowdSec has {{ $value }} ban decisions in 15 minutes"
          description: "High rate of IP bans indicates potential ongoing attack"

      - alert: DeploymentFailureRate
        # The counter increments on EVERY Deployment.status transition, so
        # both sides filter to terminal outcomes — this measures the failure
        # share of FINISHED deployments. Label values mirror the Django
        # enum (uppercase).
        expr: |
          rate(smsly_deployments_total{status=~"FAILED|BUILD_FAILED|MIGRATION_FAILED|BACKUP_FAILED|HEALTH_CHECK_FAILED"}[30m])
          /
          rate(smsly_deployments_total{status=~"ACTIVE|FAILED|BUILD_FAILED|MIGRATION_FAILED|BACKUP_FAILED|HEALTH_CHECK_FAILED"}[30m]) > 0.3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Deployment failure rate > 30% in 30 minutes"
          description: "{{ $value | humanizePercentage }} of finished deployments are failing — check backend logs"

      - alert: FalcoThreatDetected
        expr: increase(falco_events_total{priority="Critical"}[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Falco detected {{ $value }} critical threat(s) in 5 minutes"
          description: "Runtime security threat detected — check Falco logs immediately"

      - alert: Fail2banJailFull
        expr: fail2ban_currently_banned > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Fail2ban has {{ $value }} currently banned IPs"
          description: "High ban count indicates sustained attack — verify SSH/HTTP logs"

      - alert: SecurityToolDown
        expr: up{job=~"(crowdsec|falco|fail2ban)"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Security tool {{ $labels.job }} is down"
          description: "A security component is not responding — investigate immediately"

      # ── PostgreSQL / PgCat HA ────────────────────────────────────────────
      # Container liveness via cAdvisor (container_last_seen freezes when a
      # container stops). Patroni/HAProxy alerts are inert on profiles where
      # those containers don't run (absent series never fire).
      - alert: PgcatDown
        expr: time() - max(container_last_seen{name=~".*pgcat.*"}) > 60
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PgCat connection pooler is down"
          description: "pgcat container not seen for over 60s — all pooled DB traffic fails"

      # NOTE: no PgcatScrapeFailed rule — the pgcat binary ships no
      # Prometheus exporter, so there is no pgcat scrape job. Pooler
      # outages are caught by PgcatDown above.

      - alert: PostgresPrimaryDown
        expr: time() - max(container_last_seen{name=~".*postgres-primary.*"}) > 60
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL primary container is down"
          description: "Writes fail unless Patroni/HAProxy has already promoted a replica"

      - alert: PostgresReplicaDown
        expr: time() - max(container_last_seen{name=~".*postgres-replica.*"}) > 120
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL replica container is down"
          description: "No failover target — HA safety net degraded. Reads fall back to primary."

      - alert: PatroniDcsDown
        expr: time() - max(container_last_seen{name=~"smsly-etcd"}) > 60
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "etcd DCS container is down"
          description: "Patroni leader election is impaired without quorum — check etcd cluster"

      - alert: HaproxyDown
        expr: time() - max(container_last_seen{name=~"smsly-haproxy"}) > 60
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "HAProxy (Patroni routing) is down"
          description: "DB traffic routed via HAProxy :5000/:5001 has no healthy target"

      # NOTE (2026-09-04): PgcatBackendBanned / PgcatPoolSaturation removed —
      # they queried pgcat_* exporter metrics, but the levkk/pgcat binary
      # ships no exporter, so the series can never exist and the rules
      # would be permanently inert. Restore them if upstream adds the
      # exporter (and re-add the pgcat scrape job in prometheus.yml).
      # Pool-level signals from PgCat's exporter. __name__ regex covers both
      # metric naming generations (levkk/pgcat unprefixed vs postgresml fork
      # pools_/servers_ prefixes).
