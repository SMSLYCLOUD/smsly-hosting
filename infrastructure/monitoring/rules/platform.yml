groups:
  - name: platform
    interval: 30s
    rules:
      - alert: BackendDown
        expr: probe_success{job="smsly-backend"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Backend API is unreachable"
          description: "Backend has not responded for 30s"

      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Disk usage > 80%"
          description: "Host disk is {{ $value | humanizePercentage }} full"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Memory usage > 90%"
          description: "Host memory is {{ $value | humanizePercentage }} used"

      - alert: CertExpiringSoon
        expr: (cert_expiry_days < 30)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "SSL certificate expiring in {{ $value }} days"

      - alert: ContainerRestartLoop
        expr: rate(container_last_seen{name=~".+"}[5m]) > 0.5
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"

      - alert: NodeOffline
        expr: node_health_status == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Managed node {{ $labels.node }} is offline"
          description: "Node has not reported health for 5 minutes"

      - alert: CrowdsecBanRateHigh
        expr: rate(crowdsec_active_decisions[15m]) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "CrowdSec has {{ $value }} ban decisions in 15 minutes"
          description: "High rate of IP bans indicates potential ongoing attack"

      - alert: DeploymentFailureRate
        expr: rate(smsly_deployment_total{status="failed"}[30m]) / rate(smsly_deployment_total[30m]) > 0.3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Deployment failure rate > 30% in 30 minutes"
          description: "{{ $value | humanizePercentage }} of deployments are failing — check backend logs"

      - alert: FalcoThreatDetected
        expr: increase(falco_events_total{priority="Critical"}[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Falco detected {{ $value }} critical threat(s) in 5 minutes"
          description: "Runtime security threat detected — check Falco logs immediately"

      - alert: Fail2banJailFull
        expr: fail2ban_currently_banned > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Fail2ban has {{ $value }} currently banned IPs"
          description: "High ban count indicates sustained attack — verify SSH/HTTP logs"

      - alert: SecurityToolDown
        expr: up{job=~"(crowdsec|falco|fail2ban)"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Security tool {{ $labels.job }} is down"
          description: "A security component is not responding — investigate immediately"
