server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs via direct file glob (avoids docker_sd edge cases)
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/**/*-json.log
    pipeline_stages:
      # Extract container ID from path: /var/lib/docker/containers/<id>/<id>-json.log
      - regex:
          expression: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]{64})/'
      - labels:
          container:
      # Parse Docker json-file log driver format
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - labels:
          stream:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output
