server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs via docker_sd (provides compose labels)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only containers on the smsly-net network
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '.+'
        action: keep
      # Extract compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      # Extract compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      # Extract container name (strip leading /)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      # Use container ID as fallback container label
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container'
    pipeline_stages:
      # Parse Docker json-file log driver format
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - labels:
          stream:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output
      # Drop entries with no container label (shouldn't happen with docker_sd)
      - match:
          selector: '{container=""}'
          action: drop
