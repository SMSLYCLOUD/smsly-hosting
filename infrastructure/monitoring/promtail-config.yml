server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://smsly-loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs via docker_sd (provides compose labels)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep SMSLY-managed containers (compose-deployed = has compose_project
      # OR deployed via platform = has managed_by label)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project', '__meta_docker_container_label_managed_by']
        separator: ';'
        regex: '.+;.*|;smsly-hosting'
        action: keep
      # Extract compose service name (from Docker Compose auto-injected label)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      # Fallback: for non-compose (SINGLE mode) containers, use canonical_name.
      # The regex ensures only non-empty values are applied, preventing
      # empty-label overwrite of compose_service on compose containers.
      - source_labels: ['__meta_docker_container_label_smsly_blue_green_canonical_name']
        target_label: 'compose_service'
        regex: '(.+)'
      # Extract compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      # Extract container name (strip leading /)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      # Use container ID as fallback container label
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container'
    pipeline_stages:
      # Parse Docker json-file log driver format
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - labels:
          stream:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output
      # Drop entries with no container label (shouldn't happen with docker_sd)
      - match:
          selector: '{container=""}'
          action: drop

  # Traefik access log collection (JSON format)
  - job_name: traefik-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: traefik-access
          __path__: /var/log/traefik/access.log
    pipeline_stages:
      - json:
          expressions:
            client_host: ClientHost
            request_host: RequestHost
            method: RequestMethod
            status: DownstreamStatus
      - labels:
          method:
          status:
      - metrics:
          http_requests_total:
            type: Counter
            description: "Total HTTP requests from Traefik access log"
            source: status
            config:
              action: inc
