# Prometheus Configuration for SMSLY Hosting
# Scrapes metrics from services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'smsly-hosting'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configuration.
# User-application metrics are collected via cAdvisor (container-level CPU/mem/network/disk)
# and the docker-labels exporter (container metadata). Per-application /metrics
# scraping is not yet implemented — when added, create a writer for a new
# file_sd_configs directory and add the corresponding scrape job here.
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SMSLY Backend (Django)
  - job_name: 'smsly-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  # PgCat connection pooler (built-in Prometheus exporter, see
  # render_pgcat_config.py — enable_prometheus_exporter).
  - job_name: 'pgcat'
    static_configs:
      - targets: ['pgcat:9930']
    metrics_path: /metrics
    scrape_interval: 15s

  # System container metrics via cAdvisor (local + remote nodes)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          node: local
    file_sd_configs:
      - files:
          - '/etc/prometheus/docker-labels-targets/cadvisor-remote.json'
        refresh_interval: 60s

  # Docker container labels (docker_id -> service_name mapping)
  - job_name: 'docker-labels'
    file_sd_configs:
      - files:
          - '/etc/prometheus/docker-labels-targets/docker-labels*.json'
        refresh_interval: 60s
    scrape_interval: 30s

  # Node metrics (local + remote nodes)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: local
    file_sd_configs:
      - files:
          - '/etc/prometheus/docker-labels-targets/node-exporter-remote.json'
        refresh_interval: 60s

  # CrowdSec (security WAF metrics)
  - job_name: 'crowdsec'
    static_configs:
      - targets: ['crowdsec:6060']
    metrics_path: /metrics
    scrape_interval: 30s

  # Traefik (internal Prometheus metrics endpoint)
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
    scrape_interval: 30s

  # Loki (process metrics)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics
    scrape_interval: 30s

  # Promtail (process metrics)
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    metrics_path: /metrics
    scrape_interval: 30s


