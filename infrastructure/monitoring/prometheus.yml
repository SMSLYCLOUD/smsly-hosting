# Prometheus Configuration for SMSLY Hosting
# Scrapes metrics from services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'smsly-hosting'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files: []
  # - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SMSLY Backend (Django)
  - job_name: 'smsly-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  # Docker containers using cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Node metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']


