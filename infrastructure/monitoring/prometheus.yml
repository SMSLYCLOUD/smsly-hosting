# Prometheus Configuration for SMSLY Hosting
# Scrapes metrics from services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'smsly-hosting'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files: []
  # - /etc/prometheus/rules/*.yml

# Scrape configuration.
# The 'paas-services' job relies on the backend writing JSON target files
# to /etc/prometheus/paas-targets/ for dynamically deployed PaaS services.
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SMSLY Backend (Django)
  - job_name: 'smsly-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  # Docker containers using cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Node metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Traefik (internal Prometheus metrics endpoint)
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
    scrape_interval: 30s

  # Loki (process metrics)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics
    scrape_interval: 30s

  # Promtail (process metrics)
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    metrics_path: /metrics
    scrape_interval: 30s

  # PaaS User Services - dynamically discovered
  # Backend writes target files to /etc/prometheus/paas-targets/
  - job_name: 'paas-services'
    file_sd_configs:
      - files:
          - '/etc/prometheus/paas-targets/*.json'
        refresh_interval: 60s
    metrics_path: /metrics
    scrape_interval: 30s


