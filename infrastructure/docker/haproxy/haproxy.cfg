# HAProxy config for Patroni-based PostgreSQL HA
# Routing is driven by Patroni REST API health checks:
#   /primary returns 200 only on the current leader
#   /replica returns 200 only on streaming standbys
#
# NOTE: all Patroni containers expose their REST API on container port 8008
# (each has its own IP on the docker network, so no host-port remapping).
#
# Read-fallback note: when no replica is healthy, reads via :5001 fail.
# PgCat (primary_reads_enabled=true) covers that window by serving reads
# from its primary entry (haproxy:5000).

global
    maxconn 1000
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    retries 3

# ── Write port (primary only) ─────────────────────────────────────────────
listen postgres_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# ── Read port (replicas only) ──────────────────────────────────────────────
listen postgres_read
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# ── Stats page ─────────────────────────────────────────────────────────────
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 10s
