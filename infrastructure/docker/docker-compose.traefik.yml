# Traefik Reverse Proxy (behind Caddy)
# SMSly Hosting Infrastructure Layer
#
# Caddy handles SSL termination and forwards HTTP to Traefik:80.
# Traefik does NOT have a websecure entrypoint in this setup.
#
# Usage:
#   docker compose -f docker-compose.traefik.yml up -d

services:
  traefik-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    container_name: smsly-traefik-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      POST: 0
      PUT: 0
      DELETE: 0
      EXEC: 0
      BUILD: 0
      VOLUMES: 0
      IMAGES: 0
      COMMIT: 0
      SECRETS: 0
      SWARM: 0
      PLUGINS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2375"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  traefik:
    image: traefik:v3.6
    container_name: smsly-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      traefik-socket-proxy:
        condition: service_healthy
    command:
      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      
      # Docker provider (via restricted socket proxy)
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://traefik-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      
      # Entrypoints (Caddy handles SSL, forwards to traefik:80)
      - "--entrypoints.web.address=:80"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      - "--accesslog.fields.defaultMode=keep"
      - "--accesslog.fields.names.client.address=keep"
      - "--accesslog.fields.names.client.port=drop"
      - "--accesslog.fields.names.client.user=drop"
      - "--accesslog.fields.names.request.host=keep"
      - "--accesslog.fields.names.request.method=keep"
      - "--accesslog.fields.names.request.uri=keep"
      - "--accesslog.fields.names.request.port=drop"
      - "--accesslog.fields.names.downstream.status=keep"
      - "--accesslog.fields.names.user-agent=drop"
      
      # Metrics for Prometheus (no per-tenant labels: edge joins scoped
      # bridges, so any tenant could otherwise enumerate service names).
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=false"
      - "--metrics.prometheus.addServicesLabels=false"
      - "--entrypoints.metrics.address=:8082"
    
    ports:
      - "127.0.0.1:8082:8082"  # Prometheus metrics (loopback-only)
    
    volumes:
      - "traefik_logs:/var/log/traefik"
    
    networks:
      - smsly-proxy
      - traefik-proxy-net
    
    labels:
      # Dashboard (Caddy routes traefik.${DOMAIN} here)
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:?DOMAIN must be set}`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:?TRAEFIK_DASHBOARD_AUTH must be set}"
      
      # Security headers middleware
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.secure-headers.headers.forceSTSHeader=true"

volumes:
  traefik_logs:
    driver: local

networks:
  smsly-proxy:
    external: true
    name: smsly-proxy
  traefik-proxy-net:
    driver: bridge
    internal: true
