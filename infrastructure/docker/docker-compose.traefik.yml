# Traefik Reverse Proxy with Auto-SSL
# SMSly Hosting Infrastructure Layer
#
# Provides:
# - Automatic SSL via Let's Encrypt
# - Dynamic service discovery for deployed apps
# - Dashboard for monitoring routes
#
# Usage:
#   docker-compose -f docker-compose.traefik.yml up -d

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2 # TODO: pin to digest via dependabot/renovate
    container_name: smsly-traefik-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      POST: 0
      PUT: 0
      DELETE: 0
      EXEC: 0
      SERVICES: 0
      SWARM: 0
      NODES: 0
      SECRETS: 0
    networks:
      - smsly-proxy

  traefik:
    image: traefik:v3.0
    container_name: smsly-traefik
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    command:
      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=smsly-proxy"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      
      # Entrypoints (Caddy handles SSL, forwards to traefik:80)
      - "--entrypoints.web.address=:80"
      
      # SSL with Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      - "--accesslog.fields.defaultMode=keep"
      - "--accesslog.fields.names.client.address=keep"
      - "--accesslog.fields.names.client.port=drop"
      - "--accesslog.fields.names.client.user=drop"
      - "--accesslog.fields.names.request.host=keep"
      - "--accesslog.fields.names.request.method=keep"
      - "--accesslog.fields.names.request.uri=keep"
      - "--accesslog.fields.names.request.port=drop"
      - "--accesslog.fields.names.downstream.status=keep"
      - "--accesslog.fields.names.user-agent=drop"
      
      # Metrics for Prometheus
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    
    ports:
      - "8082:8082"  # Prometheus metrics
    
    volumes:
      - "letsencrypt:/letsencrypt"
      - "traefik_logs:/var/log/traefik"
    
    networks:
      - smsly-proxy
    
    labels:
      # Dashboard
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:?DOMAIN must be set}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      
      # Basic auth for dashboard (generate with: htpasswd -nb admin password)
      - "traefik.http.routers.traefik.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$xyz$$hash}"
      
      # Global redirect HTTP -> HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      - "traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      
      # Security headers middleware
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.secure-headers.headers.forceSTSHeader=true"

volumes:
  letsencrypt:
    driver: local
  traefik_logs:
    driver: local

networks:
  smsly-proxy:
    external: true
    name: smsly-proxy
