# SMSLY Hosting High-Availability Redis Stack
# Primary-Replica with 3 Sentinel instances for auto-failover.
#
# Usage:  docker compose -f docker-compose.ha-redis.yml up -d
# Requires: REDIS_PASSWORD in .env
#
# Sentinel auto-promotes replica → primary on failure.
# Clients query Sentinel at redis-sentinel:26379 to discover the current primary.
# Quorum: 2 of 3 Sentinels must agree to trigger failover.

services:
  # Primary Redis (write)
  redis-primary:
    image: redis:7-alpine
    container_name: smsly-redis-primary
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory ${REDIS_MAXMEMORY:-400mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --repl-backlog-size 64mb
      --repl-backlog-ttl 3600
      --min-replicas-to-write 1
      --min-replicas-max-lag 10
    volumes:
      - redis-primary-data:/data
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          memory: ${REDIS_PRIMARY_RESERVATION:-256M}
        limits:
          memory: ${REDIS_PRIMARY_LIMIT:-1G}
    labels:
      - managed_by=smsly-hosting

  # Replica Redis (read-only)
  redis-replica:
    image: redis:7-alpine
    container_name: smsly-redis-replica
    restart: unless-stopped
    command: >
      redis-server
      --replicaof redis-primary 6379
      --masterauth ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-400mb}
      --maxmemory-policy allkeys-lru
      --replica-read-only yes
      --repl-diskless-sync yes
      --repl-diskless-sync-delay 5
      --repl-ping-replica-period 5
    volumes:
      - redis-replica-data:/data
    networks:
      - smsly-net
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          memory: ${REDIS_REPLICA_RESERVATION:-128M}
        limits:
          memory: ${REDIS_REPLICA_LIMIT:-512M}
    labels:
      - managed_by=smsly-hosting

  # ── Redis Sentinel (3 instances for quorum=2) ──────────────────────

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-1
    restart: unless-stopped
    command: >
      sh -c '
      printf "sentinel monitor mymaster redis-primary 6379 2\nsentinel auth-pass mymaster $${REDIS_PASSWORD}\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 15000\nsentinel parallel-syncs mymaster 1\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\n" > /tmp/sentinel.conf
      && redis-sentinel /tmp/sentinel.conf'
    networks:
      - smsly-net
    depends_on:
      - redis-primary
      - redis-replica
    deploy:
      resources:
        limits:
          memory: 32M
    labels:
      - managed_by=smsly-hosting

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-2
    restart: unless-stopped
    command: >
      sh -c '
      printf "sentinel monitor mymaster redis-primary 6379 2\nsentinel auth-pass mymaster $${REDIS_PASSWORD}\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 15000\nsentinel parallel-syncs mymaster 1\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\n" > /tmp/sentinel.conf
      && redis-sentinel /tmp/sentinel.conf'
    networks:
      - smsly-net
    depends_on:
      - redis-primary
      - redis-replica
    deploy:
      resources:
        limits:
          memory: 32M
    labels:
      - managed_by=smsly-hosting

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: smsly-redis-sentinel-3
    restart: unless-stopped
    command: >
      sh -c '
      printf "sentinel monitor mymaster redis-primary 6379 2\nsentinel auth-pass mymaster $${REDIS_PASSWORD}\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 15000\nsentinel parallel-syncs mymaster 1\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\n" > /tmp/sentinel.conf
      && redis-sentinel /tmp/sentinel.conf'
    networks:
      - smsly-net
    depends_on:
      - redis-primary
      - redis-replica
    deploy:
      resources:
        limits:
          memory: 32M
    labels:
      - managed_by=smsly-hosting

volumes:
  redis-primary-data:
  redis-replica-data:

networks:
  smsly-net:
    external: true
