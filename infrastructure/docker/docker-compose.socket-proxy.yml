# Docker Socket Proxy for SMSLY Hosting
# Restricts container access to Docker socket for improved security
#
# This service acts as a filter between containers and the Docker socket,
# only allowing specific, safe API calls.

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2 # TODO: pin to digest via dependabot/renovate
    container_name: smsly-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Read-only operations
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      
      # Write operations (needed for deployment)
      BUILD: 1
      POST: 1
      PUT: 1
      DELETE: 1
      
      # Required for docker login / private image pulls
      AUTH: 1
      
      # Disabled for security
      SECRETS: 0
      SWARM: 0
      EXEC: 1  # Required for container terminal access and database administration
      PLUGINS: 0
    networks:
      - smsly-net
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp

networks:
  smsly-net:
    external: true

# Usage in docker-compose.prod.yml:
# Replace:
#   volumes:
#     - /var/run/docker.sock:/var/run/docker.sock
# With:
#   environment:
#     DOCKER_HOST: tcp://socket-proxy:2375
#   depends_on:
#     - socket-proxy
