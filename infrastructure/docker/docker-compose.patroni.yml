version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    command: etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd:2379 --listen-peer-urls http://0.0.0.0:2380
    ports:
      - "127.0.0.1:2379:2379"
    networks:
      - patroni-net

  patroni1:
    image: registry:5000/smsly/spilo:16
    build:
      context: ../spilo
      dockerfile: Dockerfile
    hostname: patroni1
    environment:
      SCOPE: smsly-cluster
      ETCD3_HOST: "etcd:2379"
      PATRONI_NAME: patroni1
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${PATRONI_SUPERUSER_PASSWORD:?must be set}
      PGUSER_ADMIN: smsly_admin
      PGPASSWORD_ADMIN: ${PATRONI_ADMIN_PASSWORD:?must be set}
      PGPASSWORD_STANDBY: ${REPLICATION_PASSWORD:-}
      PG_HMAC: sha256
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:8008:8008"
    networks:
      - patroni-net
    depends_on:
      - etcd

  patroni2:
    image: registry:5000/smsly/spilo:16
    build:
      context: ../spilo
      dockerfile: Dockerfile
    hostname: patroni2
    environment:
      SCOPE: smsly-cluster
      ETCD3_HOST: "etcd:2379"
      PATRONI_NAME: patroni2
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${PATRONI_SUPERUSER_PASSWORD:?must be set}
      PGUSER_ADMIN: smsly_admin
      PGPASSWORD_ADMIN: ${PATRONI_ADMIN_PASSWORD:?must be set}
      PGPASSWORD_STANDBY: ${REPLICATION_PASSWORD:-}
      PG_HMAC: sha256
    ports:
      - "127.0.0.1:5433:5432"
      - "127.0.0.1:8009:8008"
    networks:
      - patroni-net
    depends_on:
      - etcd

  patroni3:
    image: registry:5000/smsly/spilo:16
    build:
      context: ../spilo
      dockerfile: Dockerfile
    hostname: patroni3
    environment:
      SCOPE: smsly-cluster
      ETCD3_HOST: "etcd:2379"
      PATRONI_NAME: patroni3
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${PATRONI_SUPERUSER_PASSWORD:?must be set}
      PGUSER_ADMIN: smsly_admin
      PGPASSWORD_ADMIN: ${PATRONI_ADMIN_PASSWORD:?must be set}
      PGPASSWORD_STANDBY: ${REPLICATION_PASSWORD:-}
      PG_HMAC: sha256
    ports:
      - "127.0.0.1:5434:5432"
      - "127.0.0.1:8010:8008"
    networks:
      - patroni-net
    depends_on:
      - etcd

  haproxy:
    image: haproxy:2.8
    ports:
      - "127.0.0.1:5000:5000" # Master
      - "127.0.0.1:5001:5001" # Replicas
      - "127.0.0.1:7000:7000" # Stats
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - patroni-net
    depends_on:
      - patroni1
      - patroni2
      - patroni3

networks:
  patroni-net:
