# SMSLY Hosting — Falco Runtime Security (modern_ebpf driver)
#
# Falco monitors syscalls at the kernel level to detect runtime threats:
#   - Unauthorized process execution inside containers
#   - Shell spawned in a running container
#   - Sensitive file access (/etc/shadow, .env, secrets/*)
#   - Reverse shell / unexpected network connections
#   - Privilege escalation inside containers
#
# Uses the modern_ebpf driver (CO-RE, no kernel headers needed):
#   - Requires kernel >= 5.8 with BTF (/sys/kernel/btf/vmlinux)
#   - No driver installation needed — probe is bundled in the Falco binary
#   - Requires tracefs mount for BPF program loading

services:
  falco:
    image: falcosecurity/falco:0.39.2
    container_name: smsly-falco
    restart: unless-stopped
    # Modern eBPF least-privileged mode (per falco.org/docs/setup/container/)
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
    volumes:
      # Required for modern_ebpf: tracefs (BPF program loading)
      - /sys/kernel/tracing:/sys/kernel/tracing:ro,z
      # Required for container enrichment
      - /var/run/docker.sock:/host/var/run/docker.sock:ro,z
      - /proc:/host/proc:ro,z
      - /etc:/host/etc:ro,z
    environment:
      - HOST_ROOT=/host
    command: ["/usr/bin/falco", "-o", "json_output=true", "-o", "engine.kind=modern_ebpf"]
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    pid: host
    # Healthcheck: confirm Falco is producing events
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  smsly-net:
    external: true
