# SMSLY Hosting — Falco Runtime Security (modern_ebpf driver)
#
# Falco monitors syscalls at the kernel level to detect runtime threats:
#   - Unauthorized process execution inside containers
#   - Shell spawned in a running container
#   - Sensitive file access (/etc/shadow, .env, secrets/*)
#   - Reverse shell / unexpected network connections
#   - Privilege escalation inside containers
#
# Uses the modern_ebpf driver (CO-RE, no kernel headers needed):
#   - Requires kernel >= 5.8 with BTF (/sys/kernel/btf/vmlinux)
#   - No driver installation needed — probe is bundled in the Falco binary
#   - Requires tracefs mount for BPF program loading
# Version is pinned via FALCO_VERSION (never float): the bundled probe
# must match the host kernel generation — 0.39.2 predates kernel 7.x
# and dies in scap_init in a restart loop (2026-09-15, 400+ restarts).

services:
  falco:
    image: falcosecurity/falco:${FALCO_VERSION:-0.44.1}
    container_name: smsly-falco
    restart: unless-stopped
    # Modern eBPF least-privileged mode (per falco.org/docs/setup/container/)
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
    volumes:
      # Required for modern_ebpf: tracefs (BPF program loading)
      - /sys/kernel/tracing:/sys/kernel/tracing:ro,z
      # Required for container enrichment
      - /var/run/docker.sock:/host/var/run/docker.sock:ro,z
      - /proc:/host/proc:ro,z
      - /etc:/host/etc:ro,z
      # Custom rules to silence gVisor/systemd noise
      - ../config/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro,z
    environment:
      - HOST_ROOT=/host
    command: ["/usr/bin/falco", "-o", "json_output=true", "-o", "engine.kind=modern_ebpf"]
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    pid: host
    # Healthcheck must NOT pass while Falco crash-loops: scap_init
    # failure kills PID 1 ~15s after start, so a short start_period
    # reports "healthy" inside every crash window (2026-09-15: 400+
    # restarts, Events detected: 0, status healthy). Container restarts
    # reset health state, so a 150s start period means only a Falco
    # that actually survives capture init ever leaves "starting".
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 150s

networks:
  smsly-net:
    external: true
