# SMSLY Hosting High-Availability PostgreSQL Stack
# Primary-Replica setup with PgBouncer connection pooling.
#
# Usage:  docker compose -f docker-compose.ha-postgres.yml up -d
# Requires: REPLICATION_PASSWORD in .env or environment

services:
  # Primary PostgreSQL
  postgres-primary:
    image: postgres:16-alpine
    container_name: smsly-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-smsly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Must match the replica's PGPASSWORD default below. The default
      # 'repl_change_me' is the safety fallback for dev/test only —
      # production deployments MUST set REPLICATION_PASSWORD in .env.
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_change_me}
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_log_hints=on
      -c hot_standby=on
      -c wal_keep_size=1GB
      -c wal_sender_timeout=60s
      -c archive_mode=on
      -c archive_command='mkdir -p /var/lib/postgresql/archive && cp %p /var/lib/postgresql/archive/%f'
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    networks:
      smsly-net:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} pg_isready -U ${POSTGRES_USER:-smsly_admin} -d ${POSTGRES_DB:-smsly_hosting}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          memory: ${DB_REPL_PRIMARY_RESERVATION:-2G}
        limits:
          memory: ${DB_REPL_PRIMARY_LIMIT:-8G}
    labels:
      - managed_by=smsly-hosting

  # Read Replica
  postgres-replica:
    image: postgres:16-alpine
    container_name: smsly-postgres-replica
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The replicator user's password is created by the primary's
      # init-primary.sh using the same REPLICATION_PASSWORD. The default
      # below must match the primary's default (repl_change_me) so the
      # replica can authenticate when REPLICATION_PASSWORD is unset.
      PGUSER: replicator
      PGPASSWORD: ${REPLICATION_PASSWORD:-repl_change_me}
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Initializing replica from primary..."
          pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -Fp -Xs -P -R
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on -c max_connections=300
    networks:
      - smsly-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} pg_isready -U ${POSTGRES_USER:-smsly_admin} -d ${POSTGRES_DB:-smsly_hosting}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          memory: ${DB_REPL_REPLICA_RESERVATION:-1G}
        limits:
          memory: ${DB_REPL_REPLICA_LIMIT:-4G}
    labels:
      - managed_by=smsly-hosting

  # PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    container_name: smsly-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smsly_admin}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB:-smsly_hosting}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-50}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL:-10}
      RESERVE_POOL_SIZE: 25
      RESERVE_POOL_TIMEOUT: 5
      MAX_DB_CONNECTIONS: 100
      MAX_USER_CONNECTIONS: 100
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    networks:
      - smsly-net
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_MEMORY_LIMIT:-256M}
    labels:
      - managed_by=smsly-hosting

  # Read-only PgBouncer for replicas
  pgbouncer-readonly:
    image: edoburu/pgbouncer:1.21.0
    container_name: smsly-pgbouncer-ro
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smsly_admin}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB:-smsly_hosting}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: ${PGBOUNCER_RO_POOL_SIZE:-25}
      AUTH_TYPE: scram-sha-256
    ports:
      - "6433:6432"
    networks:
      - smsly-net
    depends_on:
      - postgres-replica
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_RO_MEMORY_LIMIT:-128M}
    labels:
      - managed_by=smsly-hosting

volumes:
  postgres-primary-data:
  postgres-replica-data:

networks:
  smsly-net:
    external: true
