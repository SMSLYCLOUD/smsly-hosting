name: smsly-hosting

services:
  # ============================================================
  # Docker Socket Proxy (Secure Docker access for the agent)
  # ============================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2 # TODO: pin to digest via dependabot/renovate
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      EVENTS: 1
      AUTH: 1
      POST: 1
      BUILD: 1
      EXEC: 1
      COMMIT: 1
      PUT: 1
      DELETE: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2375"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================
  # Redis (Local cache & throttling for the agent)
  # ============================================================
  redis:
    image: redis:7-alpine
    env_file: ../../.env
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server;
      fi'
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smsly-net

  # ============================================================
  # RabbitMQ (Local message broker for Celery workers)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    env_file: ../../.env
    environment:
      RABBITMQ_DEFAULT_USER: smsly_user
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smsly-net

  # ============================================================
  # Agent Core (Backend API for Master Orchestration)
  # ============================================================
  backend:
    image: ${SMSLY_IMAGE_BACKEND:-smsly-hosting-backend}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class uvicorn.workers.UvicornWorker --timeout 600
    env_file: ../../.env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOCKER_NETWORK=smsly-net
      - SMSLY_BUILDS_DIR=/opt/smsly-hosting/builds
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      # Node identity + master endpoints. The registrar (and any
      # inter-node code that needs the master's URL) reads these.
      # MASTER_API_URL is the WireGuard mesh IP (fast, encrypted,
      # always reachable inside the VPN). MASTER_API_URL_FALLBACK
      # is the public IP — used only during the bootstrap window
      # before WireGuard is up, or if the mesh interface drops.
      - MASTER_API_URL=http://${MASTER_MESH_IP:-10.100.0.1}
      - MASTER_API_URL_FALLBACK=http://${MASTER_IP:?MASTER_IP must be set in .env}
    depends_on:
      socket-proxy:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      # Deploy/build paths mirrored from prod: builders write here and
      # staticfiles/media must persist across recreates.
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /opt/smsly-cache:/opt/smsly-cache:z
      - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds:z
      # backups_data: shared with the master so backup encryption keys
      # downloaded via /api/v1/servers/{id}/download-key/ are persisted
      # locally and the node can restore without re-prompting.
      - backups_data:/app/backups
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent-api.rule=PathPrefix(`/api`) || PathPrefix(`/health`)
      - traefik.http.routers.agent-api.entrypoints=web
      - traefik.http.routers.agent-api.priority=1000
      - traefik.http.services.agent-api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smsly-net
      - socket-proxy

  # ============================================================
  # Agent Worker (Executes deployments on this node)
  # ============================================================
  celery-worker:
    image: ${SMSLY_IMAGE_BACKEND:-smsly-hosting-backend}
    restart: unless-stopped
    command: sh -c 'celery -A config worker --loglevel=info -Q "$${SMSLY_NODE_QUEUE:-deploy},deploy,fast,celery" --hostname="$${SMSLY_NODE_ID:-agent}@%h" --concurrency=4'
    env_file: ../../.env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOCKER_NETWORK=smsly-net
      - SMSLY_BUILDS_DIR=/opt/smsly-hosting/builds
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      - MASTER_API_URL=http://${MASTER_MESH_IP:-10.100.0.1}
      - MASTER_API_URL_FALLBACK=http://${MASTER_IP:?MASTER_IP must be set in .env}
    depends_on:
      backend:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /opt/smsly-cache:/opt/smsly-cache:z
      - /opt/smsly-hosting/builds:/opt/smsly-hosting/builds:z
      - backups_data:/app/backups
    networks:
      - smsly-net
      - socket-proxy

  # ============================================================
  # Agent Registrar — self-registration + heartbeats to master
  # ============================================================
  # A small long-running service whose only job is to make this
  # agent's boot state visible to the master. On startup it
  # POSTs /api/v1/servers/{id}/agent-ready/ (HMAC-authenticated
  # with the per-server gateway_secret). It then sends a
  # heartbeat every 30s with the agent's runtime snapshot
  # (docker version, image tags, host uptime, disk/mem).
  #
  # If the master is unreachable (e.g. WireGuard is still coming
  # up), the registrar retries with exponential backoff and
  # never gives up. The master's check_agent_heartbeats_task
  # flips the node's status to OFFLINE if no heartbeat has been
  # received in >120s, so a stuck registrar is visible in the
  # dashboard.
  agent-registrar:
    image: python:3.12-alpine
    restart: unless-stopped
    command: >
      sh -c '
        apk add --no-cache docker-cli curl tzdata >/dev/null 2>&1 || true;
        pip install --no-cache-dir requests >/dev/null 2>&1 || true;
        python /usr/local/bin/agent_registrar.py
      '
    env_file: ../../.env
    environment:
      - MASTER_API_URL=http://${MASTER_MESH_IP:-10.100.0.1}
      - MASTER_API_URL_FALLBACK=http://${MASTER_IP:?MASTER_IP must be set in .env}
      - SERVER_ID=${SMSLY_NODE_ID:?SMSLY_NODE_ID must be set in .env}
      - GATEWAY_SECRET=${GATEWAY_SECRET:?GATEWAY_SECRET must be set in .env}
      - HEARTBEAT_INTERVAL=${AGENT_HEARTBEAT_INTERVAL:-30}
      - REGISTER_ON_START=true
      - LOG_LEVEL=${AGENT_REGISTRAR_LOG_LEVEL:-INFO}
      - TZ=${TZ:-UTC}
    volumes:
      - ../../scripts/agent_registrar.py:/usr/local/bin/agent_registrar.py:ro
      # Mount the docker socket read-only so the registrar can
      # read docker version / image list for its runtime snapshot.
      # This is a *read-only* mount — the registrar cannot start
      # or stop containers. The socket-proxy (above) is the
      # privileged path for container management.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Freshness marker maintained by the registrar itself
      # (scripts/agent_registrar.py) — pgrep is not guaranteed in this
      # image (only docker-cli/curl/tzdata installed).
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/registrar.last_heartbeat 2>/dev/null || echo 0) )) -lt 120 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smsly-net

  # ============================================================
  # Traefik (Edge router for local apps)
  # ============================================================
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.network=smsly-net
      - --entrypoints.web.address=:80
      - --ping=true
      - --log.level=WARN
      # JSON access log shipped to master Loki for centralized edge
      # analysis (CrowdSec). File lives on the traefik_logs volume
      # shared with promtail below.
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.format=json
    ports:
      - "80:80"
    volumes:
      - traefik_logs:/var/log/traefik
    depends_on:
      socket-proxy:
        condition: service_healthy
    networks:
      - smsly-net
      - socket-proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Promtail (Log Shipping to Master — security path, always on)
  # Ships Traefik access logs to master's Loki for CrowdSec analysis.
  # Edge analysis is centralized on the master; this agent keeps no
  # local WAF. Lightweight (~MBs) by design.
  # ============================================================
  promtail:
    image: grafana/promtail:2.9.3
    restart: unless-stopped
    environment:
      - MASTER_MESH_IP=${MASTER_MESH_IP:-10.100.0.1}
      - SMSLY_NODE_ID=${SMSLY_NODE_ID:-unknown}
    volumes:
      - traefik_logs:/var/log/traefik:ro
      - ../monitoring/promtail-agent-lite-config.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    depends_on:
      traefik:
        condition: service_started
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/status > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${PROMTAIL_MEMORY_LIMIT:-256M}

volumes:
  redis_data:
  backups_data:
  static_volume:
  media_volume:
  traefik_logs:
  promtail-positions:

networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true
