name: smsly-hosting

services:
  # ============================================================
  # Docker Socket Proxy (Secure Docker access for the agent)
  # ============================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      BUILD: 1
      EXEC: 1
      COMMIT: 1
      PUT: 1
      DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp

  # ============================================================
  # Redis (Local cache & throttling for the agent)
  # ============================================================
  redis:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smsly-net

  # ============================================================
  # RabbitMQ (Local message broker for Celery workers)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: smsly_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smsly-net

  # ============================================================
  # Agent Core (Backend API for Master Orchestration)
  # ============================================================
  backend:
    image: ${SMSLY_IMAGE_BACKEND:-smsly-hosting-backend}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class uvicorn.workers.UvicornWorker --timeout 600
    env_file: ../../.env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      socket-proxy:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent-api.rule=PathPrefix(`/api`) || PathPrefix(`/health`)
      - traefik.http.routers.agent-api.entrypoints=web
      - traefik.http.routers.agent-api.priority=1000
      - traefik.http.services.agent-api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smsly-net
      - socket-proxy

  # ============================================================
  # Agent Worker (Executes deployments on this node)
  # ============================================================
  celery-worker:
    image: ${SMSLY_IMAGE_BACKEND:-smsly-hosting-backend}
    restart: unless-stopped
    command: sh -c 'celery -A config worker --loglevel=info -Q "$${SMSLY_NODE_QUEUE:-deploy},fast,celery" --hostname="$${SMSLY_NODE_ID:-agent}@%h" --concurrency=4'
    env_file: ../../.env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOCKER_NETWORK=smsly-net
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      socket-proxy:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smsly-net
      - socket-proxy

  # ============================================================
  # Traefik (Edge router for local apps)
  # ============================================================
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=smsly-net
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --entrypoints.web.address=:80
      - --log.level=WARN
    ports:
      - "80:80"
    depends_on:
      - socket-proxy
    networks:
      - smsly-net
      - socket-proxy

volumes:
  redis_data:

networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true

