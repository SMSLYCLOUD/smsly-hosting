# ============================================================
# Infisical — Encrypted secret management for the SMSLY PaaS
# ============================================================
# Adds: secret versioning, RBAC, audit logs, auto-reload
# for user-deployed containers.
#
# Secrets are auto-generated on first boot by the install
# scripts (update.sh / fresh.sh) and written to /data/infisical.env.
# The env_file directive loads them into the container.
# ============================================================

services:
  infisical:
    image: infisical/infisical:v0.162.2
    restart: unless-stopped
    env_file:
      # Set by the installer (lib/update_rebuild.sh, lib/fresh_deploy.sh),
      # which extracts the generated secrets from the infisical_data volume
      # to a host file. Compose cannot read env_file from inside a volume,
      # so a bare /data/infisical.env path here fails — the variable is
      # mandatory on purpose (loud failure beats silent misconfiguration).
      - ${INFISICAL_ENV_FILE:?INFISICAL_ENV_FILE must be set, e.g. /opt/smsly-hosting/.infisical.env}
    environment:
      # Database — uses existing Postgres
      DB_CONNECTION_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@smsly-postgres-primary:5432/infisical
      REDIS_URL: redis://smsly-redis-primary:6379
      # App config
      SITE_URL: ${INFISICAL_SITE_URL:-https://secrets.${DOMAIN:-localhost}}
      SMTP_HOST: ${INFISICAL_SMTP_HOST:-}
      SMTP_PORT: ${INFISICAL_SMTP_PORT:-587}
      SMTP_USERNAME: ${INFISICAL_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${INFISICAL_SMTP_PASSWORD:-}
      SMTP_SECURE: ${INFISICAL_SMTP_SECURE:-false}
      SMTP_FROM_ADDRESS: ${INFISICAL_SMTP_FROM_ADDRESS:-}
      INVITE_ONLY_SIGNUP: ${INFISICAL_INVITE_ONLY:-true}
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - infisical_data:/data
    labels:
      - managed_by=smsly-hosting
      - traefik.enable=true
      - traefik.http.routers.infisical.rule=Host(`secrets.${DOMAIN:-grid.smsly.cloud}`)
      - traefik.http.routers.infisical.entrypoints=websecure
      - traefik.http.routers.infisical.tls=true
      - traefik.http.services.infisical.loadbalancer.server.port=8080
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:8080/api/status\",r=>{process.exit(r.statusCode===200?0:1)})'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  # External + fixed name: the installer pre-populates this EXACT volume
  # (docker volume create infisical_data) with generated secrets. A
  # project-scoped volume would silently use a different, empty volume.
  infisical_data:
    external: true
    name: infisical_data

networks:
  smsly-net:
    external: true
    name: smsly-net
