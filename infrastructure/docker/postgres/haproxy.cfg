# Sample HAProxy configuration for Patroni-managed PostgreSQL.
#
# This file is a TEMPLATE — actual deployments should use the
# dynamically generated config from
# ``apps.deployments.services.replication_service.ReplicationService.generate_haproxy_compose``
# which writes the file from an environment variable and binds to the
# WireGuard interface IP of the local peer.
#
# The file is committed so that operators inspecting
# ``infrastructure/docker/docker-compose.patroni.yml`` find a real
# configuration on disk (otherwise the volume mount below fails with
# "source path does not exist").
#
# Replace the server addresses with the actual WireGuard IPs of the
# peers in your mesh before running this compose file directly.

defaults
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend master
    bind *:5000
    default_backend master

backend master
    option httpchk GET /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 10.100.0.1:55432 maxconn 100 check port 8008
    server patroni2 10.100.0.2:55432 maxconn 100 check port 8008
    server patroni3 10.100.0.3:55432 maxconn 100 check port 8008

frontend replicas
    bind *:5001
    default_backend replicas

backend replicas
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 10.100.0.1:55432 maxconn 100 check port 8008
    server patroni2 10.100.0.2:55432 maxconn 100 check port 8008
    server patroni3 10.100.0.3:55432 maxconn 100 check port 8008

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
