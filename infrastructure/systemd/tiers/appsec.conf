# AppSec (WAF) tier — the largest single memory block on the master.
#
#   appsec-agent            2G    appsec-shared-storage   512M
#   appsec-envoy            512M  appsec-smartsync         1G
#   appsec-tuning-svc       1G    appsec-db               (postgres)
#                          ─────
#                          ~5G of limits
#
# ── READ THIS BEFORE SLEEPING IT ──────────────────────────────────────────
# appsec-envoy is INLINE on the request path whenever OPENAPPSEC_ENABLED=1
# (lib/harden_openappsec.sh seeds policy and waits for the shadow port only
# when that flag is set). Stopping this tier while Envoy is in the data path
# is a security-posture change that can take the WAF off traffic — it is not
# a memory saving. If you are unsure whether Envoy is in the path, leave this
# tier awake.
#
# MANUAL ONLY (AUTOWAKE=0): a WAF that boots after the traffic it protects is
# a window of unprotected traffic. Never schedule this.
SMSLY_TIER_DESCRIPTION="AppSec WAF stack (manual — Envoy may be inline)"
SMSLY_TIER_COMPOSE_FILE="docker-compose.prod.yml"
SMSLY_TIER_PROFILES="full"
SMSLY_TIER_SERVICES="appsec-agent appsec-envoy appsec-shared-storage appsec-smartsync appsec-tuning-svc appsec-db"
SMSLY_TIER_RECREATE=0
SMSLY_TIER_AUTOWAKE=0