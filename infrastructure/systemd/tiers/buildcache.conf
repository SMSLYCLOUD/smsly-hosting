# Build cache tier — pure caches, no runtime dependency on anything.
# Safe to sleep and auto-woken: a cold build cache only costs a slow build.
SMSLY_TIER_DESCRIPTION="Build cache (verdaccio, apt-cacher, docker-mirror)"
SMSLY_TIER_COMPOSE_FILE="docker-compose.prod.yml"
# docker-mirror is gated behind `build-cache`; the other two behind `full`.
SMSLY_TIER_PROFILES="build-cache full"
SMSLY_TIER_SERVICES="docker-mirror apt-cacher verdaccio"
# 0 = wake with --no-recreate (no image swap mid-flight).
SMSLY_TIER_RECREATE=0
# 1 = safe to enable smsly-tier-autowake@buildcache.timer.
SMSLY_TIER_AUTOWAKE=1
# Napd idle-sleep: a cold build cache only costs a slow build, and builds
# cooperatively wake this tier (builder.py) before starting. Sleep after
# 2h awake. Duration-based, not activity-based — see napd/main.go.
SMSLY_TIER_AUTOSLEEP=1
SMSLY_TIER_IDLE_SECS=7200