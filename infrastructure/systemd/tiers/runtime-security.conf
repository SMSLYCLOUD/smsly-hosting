# Runtime security tier — Falco only.
#
# MANUAL ONLY (AUTOWAKE=0). While this tier sleeps, runtime threat detection
# is OFF for the whole host. That is a security-postgres change, not a
# resource optimization — enable the autowake timer only if you accept
# detection gaps, or keep it stopped and wake it for incident response.
#
# Safe to stop/start mechanically: restart is `unless-stopped` and the eBPF
# probe is version-pinned to the host kernel (FALCO_VERSION is never floated),
# so a cold start re-attaches the same probe rather than guessing one.
#
# spire-server / spire-server-ecosystem are deliberately NOT here: agents
# cannot complete attestation while the server sleeps.
SMSLY_TIER_DESCRIPTION="Falco runtime security (manual — detection off while asleep)"
SMSLY_TIER_COMPOSE_FILE="docker-compose.prod.yml"
SMSLY_TIER_PROFILES="full"
SMSLY_TIER_SERVICES="falco"
SMSLY_TIER_RECREATE=0
SMSLY_TIER_AUTOWAKE=0