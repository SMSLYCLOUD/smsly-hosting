# Metrics scraping tier — Prometheus + host/container exporters.
#
# alertmanager is NOT in this tier: its silences persist
# (--storage.path=/alertmanager on a volume) but alert *delivery* during
# downtime is lost, because Prometheus's notifier queue drops. If you sleep
# this tier you are accepting gaps in alerting — do that deliberately.
#
# AUTOWAKE=0: scraping history develops gaps each cycle. Keep it manual,
# or raise OnUnitInactiveSec in a timer drop-in if gaps don't matter.
SMSLY_TIER_DESCRIPTION="Prometheus + exporters (no alertmanager)"
SMSLY_TIER_COMPOSE_FILE="docker-compose.prod.yml"
SMSLY_TIER_PROFILES="medium full"
SMSLY_TIER_SERVICES="prometheus cadvisor node-exporter docker-labels"
SMSLY_TIER_RECREATE=0
SMSLY_TIER_AUTOWAKE=0