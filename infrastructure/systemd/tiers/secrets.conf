# Secrets-manager tier — Infisical (+ its DB lives in the platform Postgres).
#
# Wake-on-request ONLY (AUTOSLEEP=0, AUTOWAKE=0): the secrets manager is
# read on the deploy path (build_compose injects service secrets) and by
# the daily ensure-token task. Sleeping it automatically would turn every
# cold deploy into a wake-race, so v1 only sleeps it on explicit operator
# action (`smsly-tier.sh down secrets` or napd /sleep?force=1) and wakes it
# cooperatively from get_infisical_client() before any API call.
#
# Separate compose project (not docker-compose.prod.yml): tier up/down
# targets the infisical project file. The infisical service has no
# non-default profile gate in its own file, so `up -d` is sufficient —
# and the resleep rule does not apply (nothing else touches this project).
SMSLY_TIER_DESCRIPTION="Infisical secrets manager (wake-on-request only)"
SMSLY_TIER_COMPOSE_FILE="infrastructure/docker/docker-compose.infisical.yml"
SMSLY_TIER_PROJECT="smsly-infisical"
SMSLY_TIER_PROFILES=""
SMSLY_TIER_SERVICES="infisical"
SMSLY_TIER_RECREATE=0
SMSLY_TIER_AUTOWAKE=0
SMSLY_TIER_AUTOSLEEP=0
SMSLY_TIER_IDLE_SECS=0
