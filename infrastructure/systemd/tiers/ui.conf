# Dashboards tier — Grafana UI only. Read-only; nothing depends on it.
# Grafana is the single largest memory reservation in the observability
# block (GRAFANA_MEMORY_LIMIT defaults to 1G), so it is the cheapest
# win on the master. Auto-wake is safe: nothing breaks while it is away.
SMSLY_TIER_DESCRIPTION="Grafana UI"
SMSLY_TIER_COMPOSE_FILE="docker-compose.prod.yml"
SMSLY_TIER_PROFILES="medium full"
SMSLY_TIER_SERVICES="grafana"
SMSLY_TIER_RECREATE=0
SMSLY_TIER_AUTOWAKE=1
# Napd idle-sleep: Grafana is read-only UI, safe to sleep after 30min
# awake. Wake is manual (`systemctl start smsly-tier@ui`) or via the
# autowake timer — no backend hook wakes it (nothing depends on it).
SMSLY_TIER_AUTOSLEEP=1
SMSLY_TIER_IDLE_SECS=1800