# =============================================================================
# Traefik mTLS Configuration
# =============================================================================
# Add this to your Traefik dynamic configuration to enable mTLS at the ingress level.
#
# This is OPTIONAL — services can also verify mTLS themselves using the
# spiffe_mtls Python library or any SPIFFE-compatible library.
#
# When enabled, Traefik will:
# 1. Verify client certificates signed by the SPIRE CA
# 2. Extract the SPIFFE ID from the client cert SAN
# 3. Pass the SPIFFE ID to backend services via X-SPIFFE-ID header
# =============================================================================

