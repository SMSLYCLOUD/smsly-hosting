# coturn TURN Server — SMSLY Media Node Configuration
# Templated vars: ${PUBLIC_IP}, ${PRIVATE_IP}, ${TURN_SECRET}, ${DOMAIN}

listening-port=3478
tls-listening-port=5349
alt-tls-listening-port=5350

listening-ip=${PRIVATE_IP}
relay-ip=${PRIVATE_IP}
external-ip=${PUBLIC_IP}/${PRIVATE_IP}

min-port=30000
max-port=31000

fingerprint
lt-cred-mech

use-auth-secret
static-auth-secret=${TURN_SECRET}

realm=${DOMAIN}
server-name=${DOMAIN}

total-quota=100
stale-nonce=600
max-bps=0

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
no-dtls

verbose
simple-log
log-file=/var/log/coturn/turnserver.log

proc-user=turnserver
proc-group=turnserver
