# LiveKit Server — SMSLY Media Node Configuration
# Templated vars: ${LIVEKIT_API_KEY}, ${LIVEKIT_API_SECRET}, ${PUBLIC_IP}, ${PRIVATE_IP}, ${TURN_SECRET}, ${MASTER_API_URL}

port: 7880
rtc:
  port_range_start: 30000
  port_range_end: 31000
  tcp_port: 7881
  use_external_ip: true
  allow_tcp_fallback: false
  enable_ice_lite: true
  ice_lite_timeout: 30s

bind_addresses:
  - ${PRIVATE_IP}

redis:
  address: 127.0.0.1:6379
  password: ${REDIS_PASSWORD}
  db: 0

turn:
  enabled: true
  domain: ${DOMAIN}
  tls_port: 3478
  cert_file: /etc/ssl/certs/ssl-cert-snakeoil.pem
  key_file: /etc/ssl/private/ssl-cert-snakeoil.key
  ttl: 0s
  ct:
    enabled: true
  external_tls_port: 5349

keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

logging:
  level: info
  json: false
  pion_level: info
  enable_event_logger: false

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 20
  enable_media_packet_trace: false

webhook:
  enabled: true
  api_key: ${LIVEKIT_API_KEY}
  urls:
    - ${MASTER_API_URL}/v1/media/livekit-webhook/

node:
  labels:
    region: media-node
    node-id: ${NODE_ID}
