# RTPEngine — SMSLY Media Node Configuration
# Templated vars: ${PUBLIC_IP}, ${PRIVATE_IP}, ${DOMAIN}

[config]
interface = private
interface = public/${PUBLIC_IP}
listen-ng = 127.0.0.1:22222
listen-tcp = 127.0.0.1:22223
port-min = 30000
port-max = 31000
ttl = 3600
log-level = 6
log-facility = local0
pidfile = /run/rtpengine.pid
foreground = no
daemonize = yes

[port-min]
port-min = 30000

[port-max]
port-max = 31000

[tos]
tos = 0xb8

[tables]
# IPv4
table = 0
table = 1

[interfaces]
interface = private {
    address = ${PRIVATE_IP}
    advertise-address = ${PUBLIC_IP}
    port-min = 30000
    port-max = 31000
}

[endpoint-learning]
endpoint-learning = 1

[jitter-buffer]
jitter-buffer-size = 0

[transcoding]
transcoding = pcmu
transcoding = pcma
transcoding = opus

[recording]
recording-dir = /var/lib/rtpengine-recording
recording-method = disk
recording-format = wav
