# RTPEngine — SMSLY Media Node Configuration
# Flat command-line syntax (no INI sections)
# Templated vars: ${PUBLIC_IP}, ${PRIVATE_IP}

interface = private
interface = public/${PUBLIC_IP}
listen-ng = 127.0.0.1:22222
listen-tcp = 127.0.0.1:22223
port-min = 40000
port-max = 41000
ttl = 3600
log-level = 6
log-facility = local0
pidfile = /run/rtpengine.pid
foreground = no
daemonize = yes
tos = 0xb8
table = 0
table = 1
endpoint-learning = 1
jitter-buffer-size = 0
transcoding = pcmu
transcoding = pcma
transcoding = opus
recording-dir = /var/lib/rtpengine-recording
recording-method = disk
recording-format = wav
