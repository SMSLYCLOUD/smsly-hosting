; Asterisk dialplan — SMSLY Media Node
; Calls arrive from Kamailio (5xx range) into [from-trunk].

[from-trunk]
exten => _5XX,1,NoOp(Incoming from Kamailio: ${EXTEN})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

[default]
exten => 500,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
