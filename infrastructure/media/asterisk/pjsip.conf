; Asterisk PJSIP — SMSLY Media Node
; Kamailio (public :5060) relays the 5xx range here on loopback :5080.
; This box never exposes Asterisk directly.

[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5080

[kamailio-trunk]
type = endpoint
context = from-trunk
disallow = all
allow = ulaw,alaw,opus
aors = kamailio-trunk
direct_media = no
trust_id_inbound = yes

[kamailio-trunk]
type = aor
contact = sip:${PRIVATE_IP}:5060

; Trust Kamailio: match inbound INVITEs to the trunk endpoint so Asterisk
; does not challenge them with 401. Kamailio relays from its bound address
; (PRIVATE_IP), which may differ from loopback, so match both.
[kamailio-trunk]
type = identify
endpoint = kamailio-trunk
match = 127.0.0.1,${PRIVATE_IP}
