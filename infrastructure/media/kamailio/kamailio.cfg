# Kamailio SIP Router — SMSLY Media Node Configuration
# Minimal: registrar + proxy + WebSocket + RTP engine integration
# Templated vars: ${PUBLIC_IP}, ${PRIVATE_IP}, ${DOMAIN}

####### Global Parameters #########
debug=3
log_stderror=yes
log_facility=LOG_LOCAL0
memdbg=5
memlog=5
children=2
port=5060
listen=udp:${PRIVATE_IP}:5060
listen=tcp:${PRIVATE_IP}:5060
listen=tls:${PRIVATE_IP}:5061
listen=ws:${PRIVATE_IP}:8443

####### Modules Section #########
loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "rtpproxy.so"
loadmodule "websocket.so"
loadmodule "tls.so"

# ----- nathelper params -----
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "received_param", "received")

# ----- rtpproxy params -----
modparam("rtpproxy", "rtpproxy_sock", "udp:127.0.0.1:22222")

# ----- registrar params -----
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "gruu_enabled", 1)

# ----- usrloc params -----
modparam("usrloc", "db_mode", 0)

# ----- tls params -----
modparam("tls", "config", "/etc/kamailio/tls.cfg")

####### Routing Logic #########
request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("Malformed SIP message from $si:$sp\n");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "Keepalive");
        exit;
    }

    if (is_method("REGISTER")) {
        if (isflagset(1)) {
            setbflag(6);
        }
        if (isflagset(2)) {
            setbflag(7);
        }
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    if (!is_method("ACK|CANCEL|BYE")) {
        if (loose_route()) {
            if (is_hf_present("Route")) {
                if (route[1]) {
                    route[1];
                }
            }
            exit;
        }
    }

    if (is_method("BYE")) {
        xlog("L_INFO", "BYE from $fU to $rU\n");
        exit;
    }

    if (is_method("INVITE")) {
        record_route();
    }

    route[1] {
        if (is_method("INVITE")) {
            if (has_totag()) {
                if (loose_route()) {
                    if (check_route_param("nat=yes")) {
                        setbflag(6);
                    }
                    route(REPLY);
                    exit;
                }
                if (isflagset(5)) {
                    if (check_source_ip("0")) {
                        setbflag(6);
                    }
                }
            }
        }

        if (isflagset(5) || isbflagset(6) || isbflagset(7)) {
            route(NATMANAGE);
        }

        if ($rU == $null) {
            sl_send_reply("404", "Not Found");
            exit;
        }

        lookup("location");
        route(REPLY);
    }

    route[NATMANAGE] {
        if (is_request()) {
            if (has_totag()) {
                if (check_route_param("nat=yes")) {
                    setbflag(6);
                }
            }
        }

        if (isbflagset(6)) {
            if (isflagset(5)) {
                fix_nated_sdp("10");
            }
            if (is_method("INVITE")) {
                fix_nated_sdp("3");
            }
            if (is_method("REGISTER")) {
                fix_nated_register();
            }
            rtpproxy_manage("co");
        }

        if (isbflagset(7)) {
            rtpproxy_manage("ci");
        }
    }

    route[REPLY] {
        if (isbflagset(6) && status =~ "^(180|183|2[0-9][0-9])") {
            fix_nated_sdp("2");
        }
        exit;
    }
}
