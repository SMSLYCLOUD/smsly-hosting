# SMSLY custom whitelist — prevents ACME challenge blocking
# Placed in parsers/s02-enrich so ACME requests are filtered before
# reaching scenarios, saving CPU and preventing false bans.
name: smsly/whitelists-acme
description: "Whitelist ACME challenge requests"
filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log']"
whitelist:
  reason: "ACME challenge request"
  expression:
    - evt.Meta.http_path startsWith '/.well-known/acme-challenge/'
