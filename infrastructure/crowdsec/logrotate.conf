# Logrotate configuration for Traefik + Caddy access logs
# Applied daily at 03:30 via cron inside the CrowdSec container to
# prevent a DDoS from filling the shared log volume.
/var/log/traefik/access.log {
    daily
    rotate 7
    maxsize 100M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}
/var/log/caddy/access.log {
    daily
    rotate 7
    maxsize 100M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}
