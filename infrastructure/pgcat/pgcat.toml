# ═══════════════════════════════════════════════════════════════════════════════
# PgCat — Production Connection Pooler for Grid
# ═══════════════════════════════════════════════════════════════════════════════
# Multi-threaded Rust-based PostgreSQL proxy with:
#   • Transaction-mode pooling (Django-compatible)
#   • Read/write query splitting (when DB_REPLICA_HOSTS is set; see
#     render_pgcat_config.py)
#   • Prometheus metrics on :9930
#   • Automatic health checks and backend banning
#
# NOTE: This file is a fallback / reference. The actual running config
# is generated at container start by render_pgcat_config.py from the
# env vars DB_HOST / DB_PORT / DB_REPLICA_HOSTS. The generator writes
# the final pgcat.toml into the container, so the only sections that
# actually matter at runtime are the pool/user/stanza shapes below.
# ═══════════════════════════════════════════════════════════════════════════════

[general]
# Bind address — 0.0.0.0 inside Docker, external access controlled by compose
host = "0.0.0.0"
port = 5432

# ── Connection Limits ──────────────────────────────────────────────────────────
# Right-sized for a single-primary PostgreSQL 16 instance.
# PgBouncer had MAX_CLIENT_CONN=10000 which was wildly inflated.
connect_timeout = 5000          # ms — fail fast if DB is unreachable
idle_timeout = 1800000          # ms — 30 min idle before server conn is closed
server_lifetime = 86400000      # ms — 24h max server connection lifetime
shutdown_timeout = 60000        # ms — graceful drain on SIGTERM

# ── Query Parser (Read/Write Splitting) ───────────────────────────────────────
# PgCat inspects queries to route SELECTs to replicas and writes to primary.
# When no replicas are configured, all traffic goes to primary.
query_parser_enabled = true
query_parser_read_write_splitting = true
primary_reads_enabled = true    # Primary also serves reads (single-node safe)

# ── Health Checks ─────────────────────────────────────────────────────────────
healthcheck_timeout = 5000      # ms
healthcheck_delay = 30000       # ms — interval between health checks

# ── Banning ───────────────────────────────────────────────────────────────────
# Auto-ban unhealthy backends to prevent cascading failures
ban_time = 60                   # seconds — ban period after health check failure

# ── Admin Interface ───────────────────────────────────────────────────────────
admin_username = "pgcat_admin"
admin_password = "pgcat_admin"  # Internal only — not exposed outside Docker

# ── Prometheus Metrics ────────────────────────────────────────────────────────
# Exposed on port 9930 for Grafana/Prometheus scraping
prometheus_exporter_port = 9930

# ── Worker Threads ────────────────────────────────────────────────────────────
# Multi-threaded: use all available cores (0 = auto-detect)
worker_threads = 0

# ── Logging ───────────────────────────────────────────────────────────────────
log_client_connections = false
log_client_disconnections = false

# ═══════════════════════════════════════════════════════════════════════════════
# Pool: smsly_hosting (primary database)
# ═══════════════════════════════════════════════════════════════════════════════
[pools.smsly_hosting]
pool_mode = "transaction"

# ── Server Definitions ────────────────────────────────────────────────────────
# Format: [host, port, role]
# Role: "primary" or "replica"
#
# To enable read replicas, set DB_REPLICA_HOSTS in the environment as a
# comma-separated list of "host:port" entries. The generator appends
# them to the shards.0.servers list with role="replica".
# PgCat then routes SELECTs to the replica pool and writes to the
# primary. With primary_reads_enabled=true (below) the primary also
# serves reads when the replica pool is empty.
# When a Patroni-managed cluster promotes a new primary, SIGHUP pgcat
# after updating this list to reload the routing.
[pools.smsly_hosting.shards.0]
servers = [
    ["db", 5432, "primary"],
]
database = "smsly_hosting"

[pools.smsly_hosting.users.0]
username = "smsly_admin"
# Password is injected via environment variable substitution at runtime.
# PgCat reads PGCAT_PASSWORD_0 or we template it in the entrypoint.
password = "${POSTGRES_PASSWORD}"
pool_size = 100
min_pool_size = 20
# NOTE: Node agent user pools are generated dynamically by render_pgcat_config.py
# at container startup. It queries the DB for all lite-agent rows and builds
# pool entries for each. After provisioning a new node, PgCat is restarted
# automatically by the provisioner to pick up the new user.
