# Egress mirror for CDN-blocked networks.
#
# Some provider networks cannot reach dl-cdn.alpinelinux.org (persistent
# TCP timeouts while Hub/GitHub/PyPI work). Nixpacks app builds run
# `apk add` against it with no mirror flag, so every Alpine-based app
# build fails there. This shim transparently serves those requests from
# independent vendor mirrors.
#
# Design constraints (do not weaken without review):
# - nginx listens on 127.0.0.1:8888 + the docker0 gateway (container
#   builds reach it; nothing routable from the internet).
# - ONLY dl-cdn.alpinelinux.org is rewritten (server_name match). All
#   other plain-HTTP egress passes through untouched (transparent
#   default server) so host apt and diagnostics keep working.
# - Fallback is a CHAIN (@m1 -> @m2 -> @m3), one fully-correct hop at a
#   time: each hop sets the Host header matching the mirror it talks
#   to (verified: wrong-Host requests 404 on these farms). A single
#   upstream block cannot do per-peer Host headers.
# - NEVER listen on 80/443 here — those belong to the edge proxy.
# - Upstream choices were verified payload-identical (equal APKINDEX
#   sizes) before adding; re-verify before adding more.

server {
    listen 127.0.0.1:8888;
    listen 172.17.0.1:8888;
    server_name dl-cdn.alpinelinux.org;

    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_intercept_errors on;

    location / {
        proxy_pass http://mirror.leaseweb.com;
        proxy_set_header Host mirror.leaseweb.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        error_page 404 500 502 503 504 = @apk_m2;
    }

    location @apk_m2 {
        proxy_pass http://mirrors.edge.kernel.org;
        proxy_set_header Host mirrors.edge.kernel.org;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        error_page 404 500 502 503 504 = @apk_m3;
    }

    location @apk_m3 {
        proxy_pass http://mirror.netcologne.de;
        proxy_set_header Host mirror.netcologne.de;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# Transparent default: every OTHER plain-HTTP request passes through
# byte-identical (preserving Host). Without this, the iptables REDIRECT
# that steers port 80 here would break host apt and diagnostics.
server {
    listen 127.0.0.1:8888 default_server;
    listen 172.17.0.1:8888 default_server;

    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location / {
        resolver 127.0.0.53 1.1.1.1 valid=60s;
        proxy_pass http://$host$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
