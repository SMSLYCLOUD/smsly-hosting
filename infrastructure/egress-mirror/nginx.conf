# Egress mirror for CDN-blocked networks.
#
# Some provider networks cannot reach dl-cdn.alpinelinux.org (persistent
# TCP timeouts while Hub/GitHub/PyPI work). Nixpacks app builds run
# `apk add` against it with no mirror flag, so every Alpine-based app
# build fails there. This shim transparently serves those requests from
# independent vendor mirrors.
#
# Design constraints (do not weaken without review):
# - nginx listens on 127.0.0.1:8888 + the docker0 gateway (container
#   builds reach it; nothing routable from the internet).
# - ONLY dl-cdn.alpinelinux.org is rewritten (server_name match). All
#   other plain-HTTP egress passes through untouched (transparent
#   default server) so host apt and diagnostics keep working.
# - Fallback is a CHAIN (@m1 -> @m2 -> @m3), one fully-correct hop at a
#   time: each hop sets the Host header matching the mirror it talks
#   to (verified: wrong-Host requests 404 on these farms). A single
#   upstream block cannot do per-peer Host headers.
# - NEVER listen on 80/443 here — those belong to the edge proxy.
# - Upstream choices were verified payload-identical (equal APKINDEX
#   sizes) before adding; re-verify before adding more.

# __GATEWAY_IP__ and __HOST_PUBLIC_IP__ are rendered by
# lib/egress_mirror.sh at install time (plain addresses, no DNS):
# builds reach the shim through the docker0 gateway, host-local tools
# through loopback (which keeps their PUBLIC source IP after REDIRECT,
# so it must be allowlisted explicitly).
#
server {
    listen 127.0.0.1:8888;
    listen __GATEWAY_IP__:8888;
    server_name dl-cdn.alpinelinux.org;

    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow __HOST_PUBLIC_IP__;
    deny all;

    # No IPv6 egress on these hosts (no default v6 route): resolving
    # AAAA first stalls every fetch on connect timeouts until the pool
    # fills (768 worker_connections exhaustion incident). Force v4.
    # proxy_pass MUST use a variable (not a static upstream block) so
    # this resolver directive applies; per-hop Host headers stay exact.
    resolver 127.0.0.53 1.1.1.1 valid=30s ipv6=off;

    proxy_intercept_errors on;

    location / {
        set $apk_mirror mirror.leaseweb.com;
        proxy_pass http://$apk_mirror;
        proxy_set_header Host $apk_mirror;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
        error_page 403 404 429 500 502 503 504 = @apk_m2;
    }

    location @apk_m2 {
        set $apk_mirror mirrors.edge.kernel.org;
        proxy_pass http://$apk_mirror;
        proxy_set_header Host $apk_mirror;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
        error_page 403 404 429 500 502 503 504 = @apk_m3;
    }

    location @apk_m3 {
        set $apk_mirror mirror.netcologne.de;
        proxy_pass http://$apk_mirror;
        proxy_set_header Host $apk_mirror;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
    }
}

# Transparent default: every OTHER plain-HTTP request passes through
# byte-identical (preserving Host), except empty/IP/internal Hosts which
# are rejected to prevent SSRF via the mirror port.
server {
    listen 127.0.0.1:8888 default_server;
    listen __GATEWAY_IP__:8888 default_server;

    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow __HOST_PUBLIC_IP__;
    deny all;

    resolver 127.0.0.53 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    location / {
        if ($host = "") {
            return 403;
        }
        # Block dotted numeric IPv4 literals (decimal, octal 0177.0.0.1, hex 0x7f.0.0.1,
        # 2/3/4-part forms like 127.1, etc.) while allowing public FQDNs such as
        # 0.pool.ntp.org or 10.example.com whose labels contain letters/hyphens.
        if ($host ~* "^((0x[0-9a-f]+|[0-9]+)\.)+(0x[0-9a-f]+|[0-9]+)\.?(:[0-9]+)?$") {
            return 403;
        }
        # Block single-label decimal / octal / hex IPv4 bypass forms (e.g. 2130706433, 0x7f000001)
        if ($host ~* "^(0x[0-9a-f]+|[0-9]+)\.?(:[0-9]+)?$") {
            return 403;
        }
        # Explicitly block numeric private/loopback/link-local/CGNAT/unspecified IPv4 forms
        if ($host ~* "^(127\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|192\.168\.|169\.254\.|100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.|0\.)((0x[0-9a-f]+|[0-9]+)\.)*(0x[0-9a-f]+|[0-9]+)\.?(:[0-9]+)?$") {
            return 403;
        }
        # Block IPv6 literals including ::1, fc00::/7 (fc00:/fd..:), fe80::/10
        if ($host ~* "^\[?(::1|fc[0-9a-f]{2}:|fd[0-9a-f]{2}:|fe80:|[0-9a-f:]*:[0-9a-f:]+)\]?(:[0-9]+)?$") {
            return 403;
        }
        # Block loopback/internal/metadata hostnames
        if ($host ~* "^(.+\.)?(localhost|local|internal|lan|home\.arpa|metadata\.google\.internal|metadata\.aws)(:[0-9]+)?$") {
            return 403;
        }
        proxy_pass http://$host:80$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
