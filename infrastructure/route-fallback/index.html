<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid | Service Waking Up</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080c18;
      --panel: #0d1322;
      --border: #1a2438;
      --border-hover: #2a3a58;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --dim: #6b7280;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-text: #05060d;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px, 96px 96px, 96px 96px;
      display: grid;
      place-items: center;
      padding: 22px;
    }
    .panel {
      width: min(760px, 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }
    .bar {
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      background-size: 200% 100%;
      animation: flow 2.8s linear infinite;
    }
    @keyframes flow {
      0% { background-position: -100% 0; }
      100% { background-position: 200% 0; }
    }
    .content {
      padding: 26px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #111827;
      padding: 6px 12px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 4vw, 35px);
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #fff;
      font-weight: 800;
    }
    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
    }
    .host {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #3b82f6;
      background: #111827;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
      font-size: 14px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button, a.btn {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    button:hover, a.btn:hover {
      border-color: var(--border-hover);
      background: #162032;
    }
    .primary {
      background: var(--primary);
      border: 1px solid var(--primary);
      color: var(--primary-text);
    }
    .primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .ghost {
      background: #111827;
      color: var(--text);
    }
    .status {
      margin-top: 14px;
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .status[data-tone="ok"] { color: var(--primary); }
    .status[data-tone="warn"] { color: var(--warn); }
    .status[data-tone="err"] { color: var(--err); }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: var(--dim);
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="bar"></div>
    <section class="content">
      <div class="badge">Grid Routing</div>
      <h1>Service is waking up</h1>
      <p>
        This route is currently unavailable while health checks are retried.
        Grid will automatically reconnect traffic when the service returns healthy.
      </p>
      <div class="host" id="host">loading...</div>

      <div class="actions">
        <button class="primary" id="recheck-btn" type="button">Recheck Now</button>
        <a class="btn ghost" id="dashboard-link" href="#" rel="noopener noreferrer">Open Dashboard</a>
      </div>

      <div class="status" id="status"></div>
      <div class="hint">
        If this page persists, inspect the service Health tab and latest deployment runtime logs.
      </div>
    </section>
  </main>

  <script>
    const host = window.location.host || "unknown-host";
    const hostEl = document.getElementById("host");
    const statusEl = document.getElementById("status");
    const btnEl = document.getElementById("recheck-btn");
    const dashboardLink = document.getElementById("dashboard-link");

    hostEl.textContent = host;

    function setStatus(message, tone) {
      statusEl.textContent = message;
      statusEl.dataset.tone = tone || "";
    }

    function guessControlPlaneUrl() {
      const labels = (window.location.hostname || "").split(".").filter(Boolean);
      if (labels.length >= 3) {
        return "https://" + labels.slice(-3).join(".");
      }
      return "https://" + (window.location.hostname || "");
    }

    const guessedControlPlane = guessControlPlaneUrl();
    dashboardLink.href = guessedControlPlane + "/services";

    async function triggerRecheck() {
      btnEl.disabled = true;
      setStatus("Requesting health recheck...", "");
      try {
        const response = await fetch(
          "/api/v1/system/route-recheck/?host=" + encodeURIComponent(host),
          { method: "GET", cache: "no-store" }
        );

        let payload = {};
        try { payload = await response.json(); } catch (_) { payload = {}; }

        if (response.ok) {
          setStatus("Recheck queued. Retrying this page in 5 seconds...", "ok");
          window.setTimeout(() => window.location.reload(), 5000);
          return;
        }

        if (response.status === 429) {
          setStatus(
            payload.error || "Recheck already requested. Retrying in 10 seconds...",
            "warn"
          );
          window.setTimeout(() => window.location.reload(), 10000);
          return;
        }

        setStatus(payload.error || "Recheck failed. Open dashboard for diagnostics.", "err");
      } catch (_) {
        setStatus("Unable to contact control plane API from fallback route.", "err");
      } finally {
        window.setTimeout(() => { btnEl.disabled = false; }, 2000);
      }
    }

    btnEl.addEventListener("click", triggerRecheck);
  </script>
</body>
</html>
