# FRP Server Configuration
# CloudNeuron Tunnel Relay

bindPort = 7000
vhostHTTPPort = 7080

# Authentication - all clients must use this token
auth.method = "token"
auth.token = "{{ FRP_AUTH_TOKEN }}"

# Dashboard (internal only)
webServer.addr = "0.0.0.0"
webServer.port = 7500

# Logging
log.to = "console"
log.level = "info"

# Limits
transport.maxPoolCount = 50
transport.tcpMux = true

# Subdomain host - set dynamically by install.sh
subDomainHost = "{{ TUNNEL_DOMAIN }}"
