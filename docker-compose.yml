services:
  # ============================================================
  # Docker Socket Proxy (CRITICAL: Never expose raw Docker socket)
  # ============================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      BUILD: 1
      EXEC: 1
      COMMIT: 1  # Required for backup service to snapshot container state
      # Deny dangerous operations
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PUT: 1
      DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp

  # Fast worker (Heartbeats, Metrics) - Low latency, high frequency
  celery-fast:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./backend:/app
      - ./caddy-config:/caddy-config

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q fast --concurrency=8
    restart: always
    networks:
      - smsly-net
      - socket-proxy

  # Deploy worker (Builds, Cleanup) - High latency, low frequency
  celery-deploy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./backend:/app
      - ./install.sh:/app/install.sh:ro
      - ./:/platform-src:ro
      - ./caddy-config:/caddy-config
      - backups_data:/app/backups

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q deploy --concurrency=8
    restart: always
    networks:
      - smsly-net
      - socket-proxy

  # Default worker (Everything else)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./backend:/app
      - ./caddy-config:/caddy-config

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q celery --concurrency=8
    restart: always
    networks:
      - smsly-net
      - socket-proxy

  # ============================================================
  # Database
  # ============================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200
    ports:
      - "5432:5432" # Required for Lite Agents
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smsly-net

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smsly-net

  # ============================================================
  # RabbitMQ (Message broker for Celery workers)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: smsly_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smsly-net

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./install.sh:/app/install.sh:ro
      - ./:/platform-src:ro
      - backups_data:/app/backups

      - ./caddy-config:/caddy-config
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smsly_hosting}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_HOST=tcp://socket-proxy:2375
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - smsly-net
      - socket-proxy


  # ============================================================
  # Celery Beat (Scheduler)
  # ============================================================
  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app

    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smsly_hosting}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp
    networks:
      - smsly-net

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    init: true  # Fix: Next.js spawns child workers that become zombies without a proper init
    build:
      context: ./frontend
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Base URL only (Next rewrites append /api/* and /accounts/* paths)
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - smsly-net

  # ============================================================
  # Docker Registry
  # ============================================================
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - smsly-net

  # ============================================================
  # Prometheus (Metrics collection for the metrics adapter)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - smsly-net

networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  registry_data:
  prometheus_data:
  rabbitmq_data:
  backups_data:
