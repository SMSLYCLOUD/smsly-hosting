services:
  # ============================================================
  # Docker Socket Proxy (CRITICAL: Never expose raw Docker socket)
  # ============================================================
  socket-proxy:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: tecnativa/docker-socket-proxy:0.1.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      BUILD: 1
      EXEC: 1
      COMMIT: 1  # Required for backup service to snapshot container state
      AUTH: 1  # Required for `docker login` + `docker pull` of private images
      # Deny dangerous operations
      SECRETS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PUT: 1
      DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
    networks:
      - socket-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2375/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================
  # Language Ecosystem Caches
  # ============================================================

  # APT package cache (Debian/Ubuntu)
  apt-cacher:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: sameersbn/apt-cacher-ng:3.1-20240122 # TODO: pin to digest via dependabot/renovate
    container_name: smsly-apt-cacher
    restart: unless-stopped
    volumes:
      - apt_cache:/var/cache/apt-cacher-ng
      - apt_log:/var/log/apt-cacher-ng
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3142/acng-report.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting

  # npm registry cache
  verdaccio:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: verdaccio/verdaccio:5.31 # TODO: pin to digest via dependabot/renovate
    container_name: smsly-verdaccio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - verdaccio_data:/verdaccio
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4873/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting

  # Fast worker (Heartbeats, Metrics) - Low latency, high frequency
  celery-fast:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./backend:/app:z
      - ./caddy-config:/caddy-config:z
      - backups_data:/app/backups

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q fast --concurrency=8
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smsly-net
      - socket-proxy

  # Deploy worker (Builds, Cleanup) - High latency, low frequency
  celery-deploy:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - APT_CACHE_HOST=http://apt-cacher:3142
      - NPM_REGISTRY_URL=http://verdaccio:4873
    # SECURITY: removed `./:/platform-src:ro` bind mount. The full host repo
    # exposed every source file, secret, and build artefact to the deploy
    # worker. install.sh is now mounted as a single file; all other paths
    # the deploy worker used under /platform-src must be packaged into the
    # backend image or referenced through explicit, scoped mounts.
    volumes:
      - ./backend:/app:z
      - ./install.sh:/app/install.sh:ro,z
      - ./caddy-config:/caddy-config:z
      - backups_data:/app/backups

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q deploy --concurrency=8
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smsly-net
      - socket-proxy

  # Default worker (Everything else)
  celery:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./backend:/app:z
      - ./caddy-config:/caddy-config:z
      - backups_data:/app/backups

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q celery --concurrency=8
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smsly-net
      - socket-proxy

  # ============================================================
  # Database
  # ============================================================
  db:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200
    ports:
      # SECURITY: bind to loopback so postgres is only reachable on the host
      # itself (use SSH tunnel or local lite-agent socket-proxy for access).
      - "127.0.0.1:5432:5432" # Required for Lite Agents
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smsly-net

  # ============================================================
  # Redis
  # ============================================================
  redis:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smsly-net

  # ============================================================
  # RabbitMQ (Message broker for Celery workers)
  # ============================================================
  rabbitmq:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      # SECURITY: AMQP broker on loopback only; producers/consumers reach it
      # through the smsly-net overlay, never the host interface.
      - "127.0.0.1:5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: smsly_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smsly-net

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app:z
      - ./install.sh:/app/install.sh:ro,z
      - backups_data:/app/backups

      - ./caddy-config:/caddy-config:z
      # Backend writes Prometheus file_sd targets here (see
      # apps/deployments/services/prometheus_targets.py). The `prometheus`
      # service below mounts the same host directory read-only at its own
      # /etc/prometheus/docker-labels-targets path and reloads on change.
      - /opt/smsly-hosting/prometheus-targets:/opt/smsly-hosting/prometheus-targets:z
    # SECURITY: removed `./:/platform-src:ro` — see celery-deploy comment above.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smsly_hosting}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_HOST=tcp://socket-proxy:2375
      - APT_CACHE_HOST=http://apt-cacher:3142
      - NPM_REGISTRY_URL=http://verdaccio:4873
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O- http://localhost:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 180s
    networks:
      - smsly-net
      - socket-proxy


  # ============================================================
  # Celery Beat (Scheduler)
  # ============================================================
  celery-beat:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app:z

    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smsly_hosting}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # CELERY_ prefix is required for celery-redbeat to pick it up
      # (see backend/config/settings.py: CELERY_REDBEAT_REDIS_URL)
      - CELERY_REDBEAT_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/3
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp
    healthcheck:
      # celery-beat is a scheduler, not a worker, so it has no HTTP/AMQP
      # endpoint to ping. Verify it is alive via its pidfile + the
      # /proc entry for that pid. This avoids the previous fragile
      # `ps aux | grep celery.beat` check that intermittently returned
      # non-zero even when the scheduler was actively dispatching tasks
      # (causing the container to be marked unhealthy despite working).
      test:
        - CMD-SHELL
        - '[ -s /tmp/celerybeat.pid ] && [ -e "/proc/$(cat /tmp/celerybeat.pid)" ] || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - smsly-net

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    init: true  # Fix: Next.js spawns child workers that become zombies without a proper init
    build:
      context: ./frontend
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Base URL only (Next rewrites append /api/* and /accounts/* paths)
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - smsly-net

  # ============================================================
  # Docker Registry
  # ============================================================
  # SECURITY MODEL: all nodes (master + workers + lite agents) reach
  # the master via the WireGuard VPN (see wg_address on ManagedServer).
  # The VPN is the security boundary — port 5000 is bound to localhost
  # and wireguard mesh only.  The only routable path from any node is via wg0.
  #
  # HTPasswd auth is configured so an accidental 0.0.0.0 exposure is
  # still protected.  Nodes authenticate with the shared smsly-registry
  # credential from .env.
  # ============================================================
  registry:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      # Localhost by default; set REGISTRY_BIND_IP=0.0.0.0 or 10.100.0.1 in .env for multi-node mesh
      # For multi-node: set REGISTRY_BIND_IP=0.0.0.0 and CONTAINER_REGISTRY_URL=<master_mesh_ip>:5000
      - "${REGISTRY_BIND_IP:-127.0.0.1}:5000:5000"
    environment:
      REGISTRY_AUTH_HTPASSWD_REALM: registry-realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
      # Storage settings
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-}
    volumes:
      - registry_data:/var/lib/registry
      - ./certs:/certs:ro,z
      - ./auth:/auth:ro,z
    healthcheck:
      # registry:2.8.3 is scratch-based (no shell, no curl/wget).
      # The Docker restart policy handles crash recovery.
      # For active health monitoring, run the registry-health.sh script
      # from the host or use an external monitoring container.
      test: ["NONE"]
      disable: true
    # Traefik labels for the public registry.<DOMAIN> route.
    # Inside the VPN, nodes can use either:
    #   - https://registry.<DOMAIN>/v2/... (via Traefik, same LE cert)
    #   - https://<master_vpn_ip>:5000/v2/... (direct, registry's own cert)
    # Both work with --insecure-registry or after trusting the cert.
    #
    # SECURITY NOTE: tls=true (without certresolver=) makes Traefik serve
    # a self-signed certificate on the public route. The compose file's
    # static traefik config does NOT declare a `letsencrypt` certificate
    # resolver (Traefik here is internal-only behind Caddy which holds
    # the public LE cert), so the previous `certresolver=letsencrypt`
    # label made Traefik emit "Router uses a nonexistent certificate
    # resolver" on every docker-provider rescan and rippled through the
    # socket-proxy chain into the watchdog restart loop. Operators who
    # need a real LE cert here should add a certificatesResolvers entry
    # in the static traefik config and switch this back.
    labels:
      - traefik.enable=true
      - traefik.docker.network=smsly-net
      - traefik.http.routers.registry.rule=Host(`registry.${DOMAIN:-grid.smsly.cloud}`)
      - traefik.http.routers.registry.entrypoints=websecure
      - traefik.http.routers.registry.tls=true
      - traefik.http.routers.registry.priority=200
      - traefik.http.services.registry.loadbalancer.server.port=5000
      - traefik.http.services.registry.loadbalancer.server.scheme=https
      - managed_by=smsly-hosting
    networks:
      - smsly-net
      - smsly-proxy

  # ============================================================
  # Observability Stack
  # ============================================================

  # Loki - Log aggregation system
  loki:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: grafana/loki:2.9.3
    container_name: smsly-loki
    restart: unless-stopped
    ports:
      # SECURITY: log ingestion API on loopback only.
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ./infrastructure/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro,z
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting

  # Promtail - Log collector
  promtail:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: grafana/promtail:2.9.3
    container_name: smsly-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - ./infrastructure/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro,z
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9080/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - managed_by=smsly-hosting
    depends_on:
      - loki

  # Prometheus - Metrics collection
  prometheus:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: prom/prometheus:v2.48.0
    container_name: smsly-prometheus
    restart: unless-stopped
    ports:
      # SECURITY: prometheus UI on loopback only; expose externally only via
      # an authenticated reverse proxy.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
      - /opt/smsly-hosting/prometheus-targets:/etc/prometheus/docker-labels-targets:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting

  # cAdvisor - Container metrics collector
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: smsly-cadvisor
    restart: unless-stopped
    # SECURITY: privileged:true was dropped in favour of the minimal capability
    # set cAdvisor actually needs (process inspection, network/cgroup access).
    # no-new-privileges blocks any setuid binary inside the image from gaining
    # extra rights, so this is materially less powerful than full privileged
    # mode while still allowing cAdvisor to read container/host metrics.
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    command:
      - --containerd=unix:///var/run/containerd/containerd.sock
    volumes:
      - /:/rootfs:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - /var/run/containerd/containerd.sock:/var/run/containerd/containerd.sock:ro,z
      - /sys:/sys:ro,z
      - /var/lib/docker/:/var/lib/docker:ro,z
      - /dev/disk/:/dev/disk:ro,z
      - /sys/fs/cgroup:/sys/fs/cgroup:ro,z
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - Host system metrics
  node-exporter:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: prom/node-exporter:v1.6.1
    container_name: smsly-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro,z
      - /sys:/host/sys:ro,z
      - /:/rootfs:ro,z
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker Labels Exporter - maps container IDs to service names for Prometheus
  docker-labels:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: python:3.12-slim
    container_name: smsly-docker-labels
    restart: unless-stopped
    command: python3 -u /app/exporter.py
    environment:
      - NODE_NAME=local
    volumes:
      - ./infrastructure/monitoring/docker-labels-exporter.py:/app/exporter.py:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9234/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Grafana - Dashboards and visualization
  grafana:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: grafana/grafana:11.0.0
    container_name: smsly-grafana
    restart: unless-stopped
    ports:
      # SECURITY: grafana on loopback; public access goes through Caddy/Traefik
      # with auth at the /grafana path prefix.
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-localhost}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # SECURITY: anonymous access disabled; embedding off; strict same-site
      # cookies. Re-enable embedding/anon only behind a trusted SSO proxy.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SECURITY_COOKIE_SAMESITE=strict
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - smsly-net
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # CrowdSec (WAF & IPS)
  # ============================================================
  crowdsec:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: crowdsecurity/crowdsec:1.6.4 # TODO: pin to digest via dependabot/renovate
    container_name: smsly-crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      BOUNCER_KEY_traefik_bouncer: "${CROWDSEC_BOUNCER_KEY:-}"
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ./infrastructure/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro,z
      - ./infrastructure/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro,z
      - traefik_logs:/var/log/traefik:ro
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "cscli version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - managed_by=smsly-hosting

  # ============================================================
  # Traefik (reverse proxy for wildcard subdomains)
  # Routes *.grid.smsly.cloud to deployed service containers via
  # Docker labels. Reads Docker API through the socket-proxy.
  # Required by the Caddyfile's wildcard block (reverse_proxy traefik:80).
  # ============================================================
  traefik:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    image: traefik:v3.6
    restart: unless-stopped
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.docker.network=smsly-net
    - --providers.docker.endpoint=tcp://socket-proxy:2375
    - --providers.docker.httpClientTimeout=600s
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http.tls=true
    - --entrypoints.metrics.address=:8082
    # Enable the API (serves /ping on :8080) so the `traefik
    # healthcheck --ping` Docker healthcheck below has a real
    # endpoint to hit. Port 8080 is NOT published in `ports:` so
    # this is only reachable from inside the container / smsly-net.
    # Without this flag the healthcheck fails 5x in a row, Docker
    # marks the container unhealthy, and `restart: unless-stopped`
    # cycles it every ~2 minutes (seen as the WRN about encoded
    # characters being re-emitted on every cold start).
    - --api.insecure=true
    - --log.level=WARN
    - --ping=true
    - --accesslog=true
    - --accesslog.filepath=/var/log/traefik/access.log
    - --providers.docker.allowEmptyServices=true
    - --experimental.plugins.crowdsec-bouncer.modulename=github.com/maxmcd/traefik-crowdsec-bouncer
    - --experimental.plugins.crowdsec-bouncer.version=v1.3.3
    ports:
    - "127.0.0.1:8081:80"
    - "127.0.0.1:8443:443"
    - 127.0.0.1:8082:8082
    volumes:
    - letsencrypt_data:/letsencrypt
    - traefik_logs:/var/log/traefik
    depends_on:
      socket-proxy:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - smsly-net
    - socket-proxy
    - smsly-proxy
    labels:
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.enabled=true"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.CrowdsecMode=live"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.CrowdsecLapiScheme=http"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.CrowdsecLapiHost=crowdsec:8080"
    - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.CrowdsecLapiKey=$${CROWDSEC_BOUNCER_KEY:-}"

  # ============================================================
  # Caddy (TLS termination + main routing)
  # Uses the auto-generated Caddyfile at /etc/caddy/Caddyfile
  # that the backend regenerates whenever services change.
  # ============================================================
  caddy:
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    build:
      context: .
      dockerfile: infrastructure/caddy/Dockerfile
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    environment:
    - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    - DOMAIN=${DOMAIN}
    volumes:
    # Caddyfile — written by the backend into the bind-mounted
    # ./caddy-config/Caddyfile at runtime, plus the safety seed
    # written by the installer.
    - ./caddy-config:/etc/caddy:z
    # Cert storage. Previously this was a separate `caddy_config`
    # named volume, which created a path mismatch: the backend wrote
    # the IP self-signed cert to /caddy-config/certs/ip.crt (bind
    # mount), but caddy read /config/certs/ip.crt (named volume),
    # so caddy crash-looped on startup with:
    #   Error: loading initial config: ... open /config/certs/ip.crt:
    #         no such file or directory
    # Mounting the same host dir at /config fixes the path mismatch
    # — both sides now share storage transparently.
    - ./caddy-config:/config:z
    - caddy_data:/data
    - static_volume:/app/staticfiles:ro
    - media_volume:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      traefik:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-512M}

networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true
  smsly-proxy:
    external: true
    name: smsly-proxy

volumes:
  postgres_data:
  registry_data:
  prometheus_data:
  rabbitmq_data:
  backups_data:
  loki_data:
  promtail_positions:
  grafana_data:
  apt_cache:
  apt_log:
  verdaccio_data:
  caddy_data:
    external: true
    name: smsly-hosting_caddy_data
  letsencrypt_data:
  static_volume:
  media_volume:
  traefik_logs:
  crowdsec_data:
  crowdsec_config:
