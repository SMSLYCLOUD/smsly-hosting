services:
  # ============================================================
  # Docker Socket Proxy (CRITICAL: Never expose raw Docker socket)
  # ============================================================
  socket-proxy:
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: tecnativa/docker-socket-proxy:0.1.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      BUILD: 1
      EXEC: 1
      COMMIT: 1  # Required for backup service to snapshot container state
      # Deny dangerous operations
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PUT: 1
      DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2375/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================
  # Language Ecosystem Caches
  # ============================================================

  # APT package cache (Debian/Ubuntu)
  apt-cacher:
    image: sameersbn/apt-cacher-ng:latest
    container_name: smsly-apt-cacher
    restart: unless-stopped
    volumes:
      - apt_cache:/var/cache/apt-cacher-ng
      - apt_log:/var/log/apt-cacher-ng
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3142/acng-report.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting

  # npm registry cache
  verdaccio:
    image: verdaccio/verdaccio:latest
    container_name: smsly-verdaccio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - verdaccio_data:/verdaccio
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4873/-/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting

  # Fast worker (Heartbeats, Metrics) - Low latency, high frequency
  celery-fast:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./backend:/app
      - ./caddy-config:/caddy-config

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q fast --concurrency=8
    restart: always
    networks:
      - smsly-net
      - socket-proxy

  # Deploy worker (Builds, Cleanup) - High latency, low frequency
  celery-deploy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - APT_CACHE_HOST=http://apt-cacher:3142
      - NPM_REGISTRY_URL=http://verdaccio:4873
    # SECURITY: removed `./:/platform-src:ro` bind mount. The full host repo
    # exposed every source file, secret, and build artefact to the deploy
    # worker. install.sh is now mounted as a single file; all other paths
    # the deploy worker used under /platform-src must be packaged into the
    # backend image or referenced through explicit, scoped mounts.
    volumes:
      - ./backend:/app
      - ./install.sh:/app/install.sh:ro
      - ./caddy-config:/caddy-config
      - backups_data:/app/backups

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q deploy --concurrency=8
    restart: always
    networks:
      - smsly-net
      - socket-proxy

  # Default worker (Everything else)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./backend:/app
      - ./caddy-config:/caddy-config

    depends_on:
      - redis
      - db
      - rabbitmq
      - socket-proxy
    command: celery -A config worker --loglevel=info -Q celery --concurrency=8
    restart: always
    networks:
      - smsly-net
      - socket-proxy

  # ============================================================
  # Database
  # ============================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200
    ports:
      # SECURITY: bind to loopback so postgres is only reachable on the host
      # itself (use SSH tunnel or local lite-agent socket-proxy for access).
      - "127.0.0.1:5432:5432" # Required for Lite Agents
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smsly_hosting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smsly-net

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smsly-net

  # ============================================================
  # RabbitMQ (Message broker for Celery workers)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      # SECURITY: AMQP broker on loopback only; producers/consumers reach it
      # through the smsly-net overlay, never the host interface.
      - "127.0.0.1:5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: smsly_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smsly-net

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./install.sh:/app/install.sh:ro
      - backups_data:/app/backups

      - ./caddy-config:/caddy-config
    # SECURITY: removed `./:/platform-src:ro` — see celery-deploy comment above.
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smsly_hosting}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_HOST=tcp://socket-proxy:2375
      - APT_CACHE_HOST=http://apt-cacher:3142
      - NPM_REGISTRY_URL=http://verdaccio:4873
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - smsly-net
      - socket-proxy


  # ============================================================
  # Celery Beat (Scheduler)
  # ============================================================
  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app

    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smsly_hosting}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # CELERY_ prefix is required for celery-redbeat to pick it up
      # (see backend/config/settings.py: CELERY_REDBEAT_REDIS_URL)
      - CELERY_REDBEAT_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/3
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp
    networks:
      - smsly-net

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    init: true  # Fix: Next.js spawns child workers that become zombies without a proper init
    build:
      context: ./frontend
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Base URL only (Next rewrites append /api/* and /accounts/* paths)
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - smsly-net

  # ============================================================
  # Docker Registry
  # ============================================================
  registry:
    # TODO: pin to digest via dependabot/renovate (Renovate: digest-update).
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      # SECURITY: registry only exposed on loopback; remote nodes pull through
      # an SSH tunnel or via the public Traefik route configured in prod.
      - "127.0.0.1:5000:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: SMSLY Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
    volumes:
      - registry_data:/var/lib/registry
      - ./auth:/auth:ro
      - ./certs:/certs:ro
    networks:
      - smsly-net

  # ============================================================
  # Observability Stack
  # ============================================================

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:2.9.3
    container_name: smsly-loki
    restart: unless-stopped
    ports:
      # SECURITY: log ingestion API on loopback only.
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ./infrastructure/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting

  # Promtail - Log collector
  promtail:
    image: grafana/promtail:2.9.3
    container_name: smsly-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9080 && echo -e 'GET /ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - managed_by=smsly-hosting
    depends_on:
      - loki

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: smsly-prometheus
    restart: unless-stopped
    ports:
      # SECURITY: prometheus UI on loopback only; expose externally only via
      # an authenticated reverse proxy.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - /opt/smsly-hosting/prometheus-targets:/etc/prometheus/docker-labels-targets:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - managed_by=smsly-hosting

  # cAdvisor - Container metrics collector
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: smsly-cadvisor
    restart: unless-stopped
    # SECURITY: privileged:true was dropped in favour of the minimal capability
    # set cAdvisor actually needs (process inspection, network/cgroup access).
    # no-new-privileges blocks any setuid binary inside the image from gaining
    # extra rights, so this is materially less powerful than full privileged
    # mode while still allowing cAdvisor to read container/host metrics.
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    command:
      - --containerd=unix:///var/run/containerd/containerd.sock
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/containerd/containerd.sock:/var/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - Host system metrics
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: smsly-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker Labels Exporter - maps container IDs to service names for Prometheus
  docker-labels:
    image: python:3.12-alpine
    container_name: smsly-docker-labels
    restart: unless-stopped
    command: python3 -u /app/exporter.py
    environment:
      - NODE_NAME=local
    volumes:
      - ./infrastructure/monitoring/docker-labels-exporter.py:/app/exporter.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - managed_by=smsly-hosting
    networks:
      - smsly-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9234"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Grafana - Dashboards and visualization
  grafana:
    image: grafana/grafana:11.0.0
    container_name: smsly-grafana
    restart: unless-stopped
    ports:
      # SECURITY: grafana on loopback; public access goes through Caddy/Traefik
      # with auth at the /grafana path prefix.
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-localhost}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # SECURITY: anonymous access disabled; embedding off; strict same-site
      # cookies. Re-enable embedding/anon only behind a trusted SSO proxy.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SECURITY_COOKIE_SAMESITE=strict
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - smsly-net
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Traefik (reverse proxy for wildcard subdomains)
  # Routes *.grid.smsly.cloud to deployed service containers via
  # Docker labels. Reads Docker API through the socket-proxy.
  # Required by the Caddyfile's wildcard block (reverse_proxy traefik:80).
  # ============================================================
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.docker.network=smsly-net
    - --providers.docker.endpoint=tcp://socket-proxy:2375
    - --providers.docker.httpClientTimeout=300s
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http.tls=true
    - --entrypoints.metrics.address=:8082
    - --log.level=WARN
    - --ping=true
    ports:
    - "127.0.0.1:8081:80"
    - "127.0.0.1:8443:443"
    - 127.0.0.1:8082:8082
    volumes:
    - letsencrypt_data:/letsencrypt
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - smsly-net
    - socket-proxy
    - smsly-proxy

  # ============================================================
  # Caddy (TLS termination + main routing)
  # Uses the auto-generated Caddyfile at /etc/caddy/Caddyfile
  # that the backend regenerates whenever services change.
  # ============================================================
  caddy:
    build:
      context: .
      dockerfile: infrastructure/caddy/Dockerfile
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    environment:
    - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    - DOMAIN=${DOMAIN}
    volumes:
    - ./caddy-config:/etc/caddy
    - caddy_config:/config
    - caddy_data:/data
    - static_volume:/app/staticfiles:ro
    - media_volume:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      traefik:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
    - smsly-net
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-512M}

networks:
  smsly-net:
    external: true
    name: smsly-net
  socket-proxy:
    driver: bridge
    internal: true
  smsly-proxy:
    external: true
    name: smsly-proxy

volumes:
  postgres_data:
  registry_data:
  prometheus_data:
  rabbitmq_data:
  backups_data:
  loki_data:
  promtail_positions:
  grafana_data:
  apt_cache:
  apt_log:
  verdaccio_data:
  caddy_config:
    external: true
    name: smsly-hosting_caddy_config
  caddy_data:
    external: true
    name: smsly-hosting_caddy_data
  letsencrypt_data:
  static_volume:
  media_volume:
