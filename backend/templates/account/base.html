<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trulay Grid{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #080c18;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px, 24px 24px, 96px 96px, 96px 96px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e7eb;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: #0d1322;
            border: 1px solid #1a2438;
            border-radius: 12px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #10b981;
        }

        .logo p {
            color: #6b7280;
            font-size: 14px;
            margin-top: 8px;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: #111827;
            border: 1px solid #1a2438;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            transition: border-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #10b981;
        }

        input::placeholder {
            color: #4b5563;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: #10b981;
            color: #05060d;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .btn-social {
            background: #111827;
            border: 1px solid #1a2438;
            color: #e5e7eb;
            margin-bottom: 12px;
        }

        .btn-social:hover {
            background: #162032;
            border-color: #2a3a58;
        }

        .btn-github {
            background: #111827;
        }

        .btn-github:hover {
            background: #162032;
        }

        .btn-google {
            background: #fff;
            color: #333;
        }

        .btn-google:hover {
            background: #f5f5f5;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #1a2438;
        }

        .divider span {
            padding: 0 16px;
            color: #6b7280;
            font-size: 13px;
        }

        .auth-links {
            text-align: center;
            margin-top: 24px;
        }

        .auth-links a {
            color: #10b981;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .auth-links a:hover {
            color: #059669;
        }

        .error-list {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .error-list ul {
            list-style: none;
            color: #fca5a5;
            font-size: 14px;
        }

        .error-list li {
            margin-bottom: 4px;
        }

        .help-text {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
        }

        svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>Trulay Grid</h1>
                <p>The trust layer for internet communications</p>
            </div>
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
