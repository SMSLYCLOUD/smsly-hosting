version: 1.3.6

server:
  host: 0.0.0.0
  port: 3080

auth:
  # Filled from env JWT_SECRET at runtime; keep placeholder to satisfy startup.
  jwt_secret: ${JWT_SECRET}

mongo:
  # LibreChat requires MongoDB; set via env MONGODB_URI in the service.
  uri: ${MONGODB_URI}

uploads:
  enabled: false

rag:
  enabled: false

logging:
  level: info
