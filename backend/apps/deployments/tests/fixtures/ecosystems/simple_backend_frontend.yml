version: "1"
name: "simple-stack"
mode: "production"

addons:
  postgres:
    type: postgres
    required: true

services:
  api:
    type: backend_api
    runtime: python
    dependencies:
      - postgres
    env:
      DATABASE_URL:
        source: addon
        addon: postgres
        required: true
        secret: true
      EXTERNAL_API_KEY:
        source: external_required
        required: true
        secret: true

  web:
    type: frontend
    runtime: node
    dependencies:
      - api
    env:
      NEXT_PUBLIC_API_URL:
        source: service_public_url
        service: api
        required: true
        public: true
