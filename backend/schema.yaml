          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        line_items:
          readOnly: true
        pdf_url:
          type: string
          format: uri
          maxLength: 200
        paid_at:
          type: string
          format: date-time
          nullable: true
        due_date:
          type: string
          format: date-time
        user:
          type: integer
          readOnly: true
        subscription:
          type: integer
          readOnly: true
          nullable: true
      required:
      - due_date
      - id
      - line_items
      - period_end
      - period_start
      - status
      - subscription
      - subtotal
      - tax
      - total
      - user
    InvoiceStatusEnum:
      enum:
      - DRAFT
      - SENT
      - PAID
      - OVERDUE
      type: string
      description: |-
        * `DRAFT` - Draft
        * `SENT` - Sent
        * `PAID` - Paid
        * `OVERDUE` - Overdue
    Login:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - password
    ManagedServer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Human-readable label, e.g. 'Production VPS' or 'Staging EU'
          maxLength: 100
        host:
          type: string
          description: IP address or domain, e.g. '198.51.100.5' or 'prod.example.com'
          maxLength: 255
        api_url:
          type: string
          format: uri
          description: Full URL to the SMSLY Hosting API (auto-filled after provisioning)
          maxLength: 200
        ssh_port:
          type: integer
          description: SSH port for direct server access
        is_primary:
          type: boolean
          description: Mark one server as the main production server
        status:
          allOf:
          - $ref: '#/components/schemas/ManagedServerStatusEnum'
          readOnly: true
        last_health_check:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        server_version:
          type: string
          readOnly: true
        services_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        provision_status:
          allOf:
          - $ref: '#/components/schemas/ProvisionStatusEnum'
          readOnly: true
      required:
      - created_at
      - host
      - id
      - last_health_check
      - name
      - provision_status
      - server_version
      - services_count
      - status
    ManagedServerCreate:
      type: object
      description: For 'Connect Existing' mode — user provides api_url + api_token.
      properties:
        name:
          type: string
          description: Human-readable label, e.g. 'Production VPS' or 'Staging EU'
          maxLength: 100
        host:
          type: string
          description: IP address or domain, e.g. '198.51.100.5' or 'prod.example.com'
          maxLength: 255
        api_url:
          type: string
          format: uri
          description: Full URL to the SMSLY Hosting API (auto-filled after provisioning)
          maxLength: 200
        api_token:
          type: string
          description: Bearer token for the remote API (auto-filled after provisioning)
          maxLength: 255
        ssh_port:
          type: integer
          description: SSH port for direct server access
        is_primary:
          type: boolean
          description: Mark one server as the main production server
      required:
      - host
      - name
    ManagedServerProvision:
      type: object
      description: For 'Provision New' mode — user provides SSH credentials.
      properties:
        name:
          type: string
          description: Human-readable label, e.g. 'Production VPS' or 'Staging EU'
          maxLength: 100
        host:
          type: string
          description: IP address or domain, e.g. '198.51.100.5' or 'prod.example.com'
          maxLength: 255
        ssh_port:
          type: integer
          description: SSH port for direct server access
        ssh_user:
          type: string
          description: SSH username (usually root)
          maxLength: 100
        ssh_password:
          type: string
          writeOnly: true
          description: SSH password (encrypted at rest)
          maxLength: 255
        ssh_key:
          type: string
          writeOnly: true
          description: SSH private key content (encrypted at rest)
        ssh_auth_method:
          allOf:
          - $ref: '#/components/schemas/SshAuthMethodEnum'
          writeOnly: true
        is_primary:
          type: boolean
          description: Mark one server as the main production server
      required:
      - host
      - name
      - ssh_auth_method
    ManagedServerStatusEnum:
      enum:
      - ONLINE
      - OFFLINE
      - UNKNOWN
      type: string
      description: |-
        * `ONLINE` - Online
        * `OFFLINE` - Offline
        * `UNKNOWN` - Unknown
    MetricsResponse:
      type: object
      properties:
        cpu: {}
        memory: {}
        network: {}
        disk: {}
        current: {}
      required:
      - cpu
      - current
      - disk
      - memory
      - network
    PaginatedAPIKeyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
    PaginatedAddonList:
      type: object
      required:
      - count
      - results
      properties:
        count:
