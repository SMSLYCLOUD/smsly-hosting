      description: |-
        * `ACTIVE` - Active
        * `PAST_DUE` - Past Due
        * `CANCELLED` - Cancelled
        * `TRIAL` - Trial
    VerifyEmail:
      type: object
      properties:
        key:
          type: string
          writeOnly: true
      required:
      - key
    Volume:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        mount_path:
          type: string
          description: Path inside container e.g. /data
          maxLength: 255
        size_gb:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        service:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - mount_path
      - name
      - service
  securitySchemes:
    APITokenAuth:
      type: http
      scheme: bearer
      bearerFormat: smsly_<token>
      description: SMSLY personal API token, prefixed with smsly_.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
