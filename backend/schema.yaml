components:
  schemas:
    APIKey:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        prefix:
          type: string
          readOnly: true
        last_used:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_used
      - name
      - prefix
    Addon:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        service:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        addon_type:
          $ref: '#/components/schemas/AddonTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/AddonStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - addon_type
      - created_at
      - id
      - name
      - service
      - status
    AddonStatusEnum:
      enum:
      - PROVISIONING
      - ACTIVE
      - FAILED
      - DELETED
      type: string
      description: |-
        * `PROVISIONING` - Provisioning
        * `ACTIVE` - Active
        * `FAILED` - Failed
        * `DELETED` - Deleted
    AddonTypeEnum:
      enum:
      - POSTGRES
      - REDIS
      - MYSQL
      - MONGODB
      - QDRANT
      type: string
      description: |-
        * `POSTGRES` - PostgreSQL
        * `REDIS` - Redis
        * `MYSQL` - MySQL
        * `MONGODB` - MongoDB
        * `QDRANT` - Qdrant (Vector DB)
    AnalyticsPayload:
      type: object
      properties:
        data: {}
      required:
      - data
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          maxLength: 255
        action:
          type: string
          maxLength: 255
        target:
          type: string
          maxLength: 255
        metadata: {}
        previous_hash:
          type: string
          readOnly: true
        hash:
          type: string
          readOnly: true
      required:
      - hash
      - id
      - previous_hash
      - timestamp
    BackupSchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_server_wide:
          type: boolean
        cron_expression:
          type: string
          maxLength: 100
        retention_days:
          type: integer
        enabled:
          type: boolean
        last_run:
          type: string
          format: date-time
          nullable: true
        next_run:
          type: string
          format: date-time
          nullable: true
        service:
          type: string
          format: uuid
          nullable: true
      required:
      - id
    BackupTypeEnum:
      enum:
      - MANUAL
      - SCHEDULED
      - PRE_TRANSFER
      type: string
      description: |-
        * `MANUAL` - Manual
        * `SCHEDULED` - Scheduled
        * `PRE_TRANSFER` - Pre-Transfer
    BillingCycleEnum:
      enum:
      - MONTHLY
      - YEARLY
      type: string
      description: |-
        * `MONTHLY` - Monthly
        * `YEARLY` - Yearly
    BlankEnum:
      enum:
      - ''
    BlueprintPayload:
      type: object
      properties:
        data: {}
    BuildpackEnum:
      enum:
      - NIXPACKS
      - DOCKER
      - STATIC
      type: string
      description: |-
        * `NIXPACKS` - Nixpacks
        * `DOCKER` - Dockerfile
        * `STATIC` - Static Site
    Checkout:
      type: object
      description: Serializer for checkout requests.
      properties:
        plan:
          $ref: '#/components/schemas/PlanEnum'
        provider:
          oneOf:
          - $ref: '#/components/schemas/ProviderEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - plan
    CloudProvider:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: User-friendly name for this integration
          maxLength: 255
        provider_type:
          $ref: '#/components/schemas/ProviderTypeEnum'
        region:
          type: string
          description: Default region for resources
          maxLength: 50
        project_id:
          type: string
          nullable: true
          description: GCP/Azure Project/Subscription ID
          maxLength: 255
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - provider_type
    CloudProviderCreate:
      type: object
      properties:
        name:
          type: string
          description: User-friendly name for this integration
          maxLength: 255
        provider_type:
          $ref: '#/components/schemas/ProviderTypeEnum'
        region:
          type: string
          description: Default region for resources
          maxLength: 50
        project_id:
          type: string
          nullable: true
          description: GCP/Azure Project/Subscription ID
          maxLength: 255
        tenant_id:
          type: string
          nullable: true
          description: Azure Tenant ID
          maxLength: 255
        api_key:
          type: string
          writeOnly: true
        api_secret:
          type: string
          writeOnly: true
      required:
      - name
      - provider_type
    CloudResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resource_id:
          type: string
          description: Provider-specific ID (ARN, SelfLink, etc)
          maxLength: 255
        resource_type:
          type: string
          description: e.g., AWS::S3::Bucket, Microsoft.Web/sites
          maxLength: 100
        name:
          type: string
          maxLength: 255
        region:
          type: string
          maxLength: 50
        status:
          type: string
          maxLength: 50
        metadata:
          description: Additional properties (tags, specific config)
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        provider:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - name
      - provider
      - resource_id
      - resource_type
      - updated_at
    Contact:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        company:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 5000
      required:
      - email
      - message
      - name
    CronJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        schedule:
          type: string
          description: Cron schedule e.g. '*/5 * * * *'
          maxLength: 100
        command:
          type: string
          description: Command to execute inside the container
          maxLength: 500
        is_active:
          type: boolean
        last_run_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        next_run_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        service:
          type: string
          format: uuid
      required:
      - command
      - created_at
      - id
      - last_run_at
      - name
      - next_run_at
      - schedule
      - service
      - updated_at
    DeployStrategyEnum:
      enum:
      - ROLLING
      - BLUE_GREEN
      - CANARY
      type: string
      description: |-
        * `ROLLING` - Rolling Update
        * `BLUE_GREEN` - Blue/Green
        * `CANARY` - Canary
    DeployTypeEnum:
      enum:
      - GIT
      - DOCKER
      - UPLOAD
      - TEMPLATE
      - FUNCTION
      type: string
      description: |-
        * `GIT` - Git Repository
        * `DOCKER` - Docker Image
        * `UPLOAD` - File Upload
        * `TEMPLATE` - Predefined Template
        * `FUNCTION` - Serverless Function
    Deployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        duration_seconds:
          type: number
          format: double
          readOnly: true
          nullable: true
        service_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        commit_hash:
          type: string
          maxLength: 40
        commit_message:
          type: string
        status:
          $ref: '#/components/schemas/DeploymentStatusEnum'
        build_logs:
          type: string
        runtime_logs_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        pipeline_stages:
          description: List of pipeline stages (name, status, duration)
        ai_diagnosis:
          type: string
          description: AI suggested fix for failure
        review_summary:
          description: AI-recommended resources, env vars, and issues for review
        vulnerability_report:
          description: Trivy scan results
        container_id:
          type: string
          nullable: true
          maxLength: 255
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        is_rollback:
          type: boolean
          description: Whether this deployment is a rollback
        service:
          type: string
          format: uuid
        rollback_from:
          type: string
          format: uuid
          nullable: true
          description: The deployment this was rolled back from
      required:
      - commit_hash
      - created_at
      - duration_seconds
      - id
      - service
      - service_name
      - updated_at
    DeploymentStatusEnum:
      enum:
      - QUEUED
      - REVIEW
      - BUILDING
      - DEPLOYING
      - HEALTH_CHECK
      - ACTIVE
      - FAILED
      - CANCELLED
      type: string
      description: |-
        * `QUEUED` - Queued
        * `REVIEW` - Review
        * `BUILDING` - Building
        * `DEPLOYING` - Deploying
        * `HEALTH_CHECK` - Health Check
        * `ACTIVE` - Active
        * `FAILED` - Failed
        * `CANCELLED` - Cancelled
    EnvVar:
      type: object
      description: |-
        Serializer for Environment Variables.
        Renamed from EnvironmentVariableSerializer to match view import.
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          maxLength: 255
        value:
          type: string
          maxLength: 255
        is_secret:
          type: boolean
      required:
      - id
      - key
    HealthStatusEnum:
      enum:
      - healthy
      - unhealthy
      - unknown
      - starting
      type: string
      description: |-
        * `healthy` - Healthy
        * `unhealthy` - Unhealthy
        * `unknown` - Unknown
        * `starting` - Starting
    IntelligencePayload:
      type: object
      properties:
        data: {}
    InviteMember:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - role
    Invoice:
