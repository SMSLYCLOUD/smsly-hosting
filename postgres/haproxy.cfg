defaults
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend master
    bind *:5000
    default_backend master

backend master
    option httpchk GET /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:8008 maxconn 100 check port 8008
    server patroni2 patroni2:8008 maxconn 100 check port 8008
    server patroni3 patroni3:8008 maxconn 100 check port 8008

frontend replicas
    bind *:5001
    default_backend replicas

backend replicas
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:8008 maxconn 100 check port 8008
    server patroni2 patroni2:8008 maxconn 100 check port 8008
    server patroni3 patroni3:8008 maxconn 100 check port 8008

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
